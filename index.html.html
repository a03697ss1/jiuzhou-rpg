function startGame(){document.getElementById('startStatus').textContent='正在生成九州世界、3,000名NPC與2,275種妖物型態…';setTimeout(()=>{try{let name=document.getElementById('name').value.trim()||'無名',age=+document.getElementById('age').value||16,gender=document.getElementById('gender').value;let npcs=[];for(let i=0;i<3000;i++)npcs.push(makeNPC(i));s={name,age,gender,year:213,day:1,hour:8,place:'青陽鎮',layer:'地面',root:pick(roots),realm:'練氣一層',hp:100,maxhp:100,mp:35,maxmp:35,atk:8,def:6,agi:7,stones:500,exp:0,expNeed:100,good:0,evil:0,dao:0,cultivationDays:0,lastRetreatDay:-99,techs:['基礎吐納'],skills:[],techInventory:[],materials:{'普通靈草':2,'玄鐵':0,'妖骨':0,'妖皮':0,'妖核碎片':0,'靈露':0,'天機碎片':0},bag:[['［初階］低級生命藥水',3,'❤️ HP +10'],['［初階］低級靈力藥水',3,'🔵 靈力 +10'],['母親的姻緣戒指',1,'💍 可送予戀愛對象觸發婚姻'],['［初階］寵物飼料',2,'🐾 寵物經驗+12、好感+1']],equip:{武器:'［初階］木劍（攻+3）',頭:'無',衣:'［初階］新手布衣（防+3）',褲:'［初階］新手布褲（防+2）',鞋:'［初階］新手布鞋（防+1）',項鍊:'無',戒指:'無',配飾:'無'},sect:null,sectRank:null,sectRep:0,spouse:null,children:[],pets:[],petSlots:1,petSlotPurchases:0,npcs,monsterPool:generateMonsterPool(),sects:sectTemplates.map((x,i)=>({id:i,name:x[0],type:x[1],dyn:x[2],power:rint(45,95),treasury:rint(20000,300000),relations:{},war:null})),wars:[],worldEvents:[],auction:[],log:[],kills:{一般種:0,特殊種:0,高危種:0,妖王種:0,生物:0,人類:0},tribulation:null,immortal:false};document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');log('📜 你背起行囊，帶著500靈石、母親的姻緣戒指與一把［初階］木劍離開家門。');log('🌿 靈根覺醒：'+s.root+'。青陽鎮外，九州萬象正在自行運轉。');seedAuction();tab('adventure');render()}catch(err){console.error(err);document.getElementById('startStatus').textContent='啟動失敗：'+err.message}},30)}

function win(){let t=enemy.tier,reward=t==='一般種'?rint(30,80):t==='特殊種'?rint(90,220):t==='高危種'?rint(350,900):t==='妖王種'?rint(1800,6000):rint(15,70),xp=t==='一般種'?12:t==='特殊種'?28:t==='高危種'?75:t==='妖王種'?220:10;s.stones+=reward;s.exp=Math.min(s.expNeed,s.exp+xp);s.kills[t]=(s.kills[t]||0)+1;if(['一般種','特殊種','高危種','妖王種'].includes(t)){s.materials['妖核碎片']=(s.materials['妖核碎片']||0)+(t==='一般種'?1:t==='特殊種'?2:4);if(Math.random()<(t==='特殊種'?.08:t==='高危種'?.16:t==='妖王種'?.35:.025))addBag('神秘妖獸蛋',1,'🥚 可孵化普通/特殊種，極低機率高危種寵物')}s.pets.forEach(p=>{p.exp+=Math.max(5,Math.floor(xp*.65));levelPet(p)});log(`🏆 擊敗 ${enemy.name}【${t}】，獲得 ${reward} 靈石、${xp} 修為。`);enemy=null;closeModal();render()}

function techniques(c){let learned=[...s.techs,...s.skills],owned=s.techInventory||[];c.innerHTML=`<h2>📖 功法</h2><h3>✅ 已學會</h3><div class="cards">${learned.map(n=>{let t=[...basicTechs,...rareTechs].find(x=>x.name===n);return `<div class="card"><b>${n}</b><br>${t?.type||'基礎'}<br><span class="sub">${t?.desc||'已掌握的修行法門'}</span></div>`}).join('')||'<div class="card">尚無</div>'}</div><h3>📜 持有功法（未學習）</h3><div class="cards">${owned.map(n=>{let t=rareTechs.find(x=>x.name===n)||basicTechs.find(x=>x.name===n);return `<div class="card"><b>${n}</b><br>${t?.desc||''}<br>來源：${t?.source||'未知'}<br><button onclick="learnOwnedTech('${n}')">參悟學習</button></div>`}).join('')||'<div class="card">目前沒有未學習功法。多數功法需透過購買、任務、NPC或冒險取得。</div>'}</div><h3>🌱 基礎功法商店</h3><div class="cards">${basicTechs.filter(t=>t.cost>0).map(t=>`<div class="card"><b>${t.name}</b> <span class="pill">${t.type}</span><br>${t.desc}<br><b>${t.cost} 靈石</b><br>${learned.includes(t.name)?'<span class="green">已習得</span>':owned.includes(t.name)?'<span class="orange">已持有</span>':`<button onclick="buyTechnique('${t.name}',${t.cost})">購買功法卷</button>`}</div>`).join('')}</div>`}

function learnOwnedTech(n){let t=[...basicTechs,...rareTechs].find(x=>x.name===n);if(!t)return;if(t.special){if((s.materials[t.special.item]||0)<t.special.count||s.exp<t.special.exp)return log(`⚠️ 【${n}】需要 ${t.special.item}×${t.special.count} 並消耗修為 ${t.special.exp}。`),render();s.materials[t.special.item]-=t.special.count;s.exp-=t.special.exp}if(t.kind==='skill')s.skills.push(n);else s.techs.push(n);s.techInventory=s.techInventory.filter(x=>x!==n);log(`📖 你成功參悟【${n}】。`);render()}
function breakthrough(){if(s.exp<s.expNeed)return;if(s.immortal)return immortalBreakthrough();let p=realmPower(s.realm),major=Math.floor((p-1)/10),lv=(p-1)%10+1;if(p>=80)return startTribulation();let needRetreat=major+1;if(s.cultivationDays<needRetreat||s.techs.length+s.skills.length<1){log(`⚠️ 突破準備不足：至少需要 ${needRetreat} 次閉關積累與一門修行功法。`);render();return}let chance=.72+Math.min(.18,((s.kills.特殊種||0)+(s.kills.高危種||0))*.01);if(Math.random()>chance){s.exp=Math.floor(s.expNeed*.72);s.hp=Math.max(1,Math.floor(s.maxhp*.4));log('💥 突破失敗，經脈受創，修為回落。');render();return}s.exp=0;if(lv<10){lv++;s.realm=realmNames[major]+lv+'層'}else{s.realm=realmNames[major+1]+'1層'}s.expNeed=Math.floor(s.expNeed*1.3+40);s.maxhp+=18+major*6;s.maxmp+=7+major*3;s.atk+=4+major;s.def+=3+major;s.hp=s.maxhp;s.mp=s.maxmp;log('✨ 天地靈氣匯聚——突破成功！晉入【'+s.realm+'】。');render()}
function immortalBreakthrough(){let order=['真仙','天仙','帝仙','神帝'],cur=order.findIndex(x=>s.realm.startsWith(x));if(cur<0)cur=0;if(cur===3){log('👑 你已位列神帝。');render();return}let needDao=[8,18,35][cur],needBoss=[2,6,12][cur];if(s.dao<needDao||(s.kills.高危種+s.kills.妖王種)<needBoss){log(`🌌 仙境突破不足：大道感悟 ${needDao}、高危/妖王討伐 ${needBoss}。`);render();return}s.dao-=needDao;s.realm=order[cur+1];s.exp=0;s.expNeed=Math.floor(s.expNeed*2.1);s.maxhp+=250*(cur+1);s.maxmp+=180*(cur+1);s.atk+=90*(cur+1);s.def+=70*(cur+1);s.hp=s.maxhp;s.mp=s.maxmp;log('🌌 你對大道的理解跨越天關，晉升【'+s.realm+'】！');render()}
function startTribulation(){showModal(`<h2>🌩️ 渡劫</h2><p>真仙之前不存在大道要求。渡劫依照你的修為根基、閉關、戰績與所在地判定。</p><div class="card">失敗：跌回大乘五層、HP=1、最大HP暫時30，24小時後恢復。</div><div class="choices"><button class="primary" onclick="doTribulation()">引動天劫</button><button onclick="closeModal()">暫緩</button></div>`)}
function doTribulation(){let score=s.cultivationDays*1.2+((s.kills.高危種||0)*6)+((s.kills.妖王種||0)*12)+(placeInfo[s.place]?.danger||1)*2,chance=clamp(.22+score/100,.22,.8);if(Math.random()<chance){s.realm='真仙';s.immortal=true;s.dao=0;s.exp=0;s.expNeed=900;s.maxhp+=180;s.maxmp+=120;s.atk+=55;s.def+=45;s.hp=s.maxhp;s.mp=s.maxmp;log('🌩️✨ 渡劫成功，飛升【真仙】！從此大道系統正式開啟。')}else{s.realm='大乘5層';s.hp=1;s.maxhpBackup=s.maxhp;s.maxhp=30;s.tribulation={hours:0};log('🌩️💥 渡劫失敗！跌回大乘五層，HP=1，最大HP暫時30。')}closeModal();render()}
function sect(c){let mine=s.sect?`<div class="card"><b>${s.sect}</b><br>身份：${s.sectRank}<br>宗門聲望：${s.sectRep}<div class="choices"><button onclick="sectTask()">📜 宗門任務</button><button onclick="sectPromote()">⬆️ 申請晉升</button><button onclick="leaveSect()">🚪 退出宗門</button></div></div>`:'<div class="card">你目前是散修，可加入宗門；大型宗門可能要求比試、繳費或聲望。</div>';c.innerHTML=`<h2>🏯 宗門系統</h2>${mine}<div class="cards">${s.sects.map((x,i)=>`<div class="card"><b>${x.name}</b><br>${x.type}・${x.dyn}<br>勢力：${x.power}/100<br>${!s.sect?`<button onclick="joinSect(${i})">申請入宗</button>`:''}</div>`).join('')}</div>`}
function joinSect(i){if(s.sect)return;let x=s.sects[i],fee=x.power>80?1200:650;if(s.stones<fee)return log(`💰 ${x.name} 要求繳納 ${fee} 靈石，你的靈石不足。`),render();if(Math.random()>.7+realmPower(s.realm)/180)return log(`⚔️ ${x.name} 入門比試失敗。`),render();s.stones-=fee;s.sect=x.name;s.sectRank='外門弟子';s.sectRep=5;log(`🏯 加入【${x.name}】成為外門弟子。`);render()}

function npc(c){let near=s.npcs.filter(n=>n.alive&&n.place===s.place).slice(0,2);c.innerHTML=`<h2>🌸 當前場所人物</h2><p class="sub">只顯示實際位於【${s.place}】附近的人物。荒野有時一個人也遇不到。</p>${near.length?`<div class="cards">${near.map(n=>`<div class="card"><b>${n.gender==='女'?'🌸':'🗡️'} ${n.name}</b><br>性別：${n.gender}<br>${n.realm}・${n.sect}<br>${n.age}歲・${n.personality}<br>💥 戰力值：${Math.floor(realmPower(n.realm)*90+n.talent*8)}<br>好感：<span class="red">${heartBar(n.aff)}</span><br>${n.married?'💍 已婚':''}<div class="choices"><button onclick="npcAct('${n.id}','chat')">💬 交談</button><button onclick="npcAct('${n.id}','gift')">🎁 贈禮</button><button onclick="npcAct('${n.id}','help')">🤝 幫助</button><button onclick="npcAct('${n.id}','attack')">⚔️ 攻擊</button><button onclick="npcAct('${n.id}','rob')">💰 搶奪</button>${n.gender!==(s.gender==='少女'?'女':'男')&&n.aff>=65&&!n.married?`<button onclick="npcAct('${n.id}','love')">💗 表明心意</button>`:''}${n.aff>=85&&!n.married?`<button onclick="npcAct('${n.id}','marry')">💍 求婚</button>`:''}</div></div>`).join('')}</div>`:'<div class="card">此刻附近沒有可互動的修士。探索時可能遇見旅人、宗門弟子或散修。</div>'}<h3>👨‍👩‍👧 家族</h3><div class="card">伴侶：${s.spouse||'無'}<br>子女：${s.children.length?s.children.join('、'):'無'}</div>`}
function npcAct(id,a){let n=s.npcs.find(x=>x.id===id);if(!n||!n.alive||n.place!==s.place)return;if(a==='chat'){advance(1);let mod=s.good>s.evil?1:s.evil>s.good?-1:0;n.aff=clamp(n.aff+rint(1,4)+mod,-100,100);log(`💬 你與 ${n.name} 交談。`)}if(a==='gift'){if(s.stones<80)return log('💰 至少需要80靈石準備像樣的禮物。'),render();s.stones-=80;n.aff=clamp(n.aff+8,-100,100);log(`🎁 ${n.name} 收下禮物。`)}if(a==='help'){s.good+=5;n.aff=clamp(n.aff+7,-100,100);log(`🤝 你幫助了 ${n.name}，善值 +5。`)}if(a==='attack'){n.alive=false;s.evil+=25;log(`⚔️ 你惡意攻擊並殺死 ${n.name}，惡值 +25。`)}if(a==='rob'){let g=Math.min(n.wealth,rint(30,180));n.wealth-=g;s.stones+=g;n.aff=-100;s.evil+=12;log(`💰 搶走 ${g} 靈石，惡值 +12。`)}if(a==='love'){n.aff=clamp(n.aff+6,-100,100);log(`💗 你向 ${n.name} 表明心意。`)}if(a==='marry'){let ring=s.bag.find(x=>x[0]==='母親的姻緣戒指'&&x[1]>0);if(!ring)return log('💍 姻緣戒指已不在身上。'),render();ring[1]--;n.married=true;n.partner='PLAYER';s.spouse=n.name;log(`💍 你與 ${n.name} 結為道侶。`)}render()}

function hatchEgg(i,inCombat=false){if(s.pets.length>=s.petSlots)return log('🐾 寵物欄已滿。'),itemMenu(inCombat);let r=Math.random(),tier=r<.003?'高危種':r<.12?'特殊種':'一般種',pool=s.monsterPool.filter(m=>m.tier===tier&&!m.boss),m=pick(pool),skillCount=tier==='高危種'?4:tier==='特殊種'?3:2,p={name:m.name,species:m.base,tier,level:1,exp:0,expNeed:50,maxhp:tier==='高危種'?130:tier==='特殊種'?95:70,hp:70,maxmp:tier==='高危種'?55:tier==='特殊種'?40:25,mp:25,aff:10,skills:[m.skill,...['撕咬','靈氣彈','護主','迅捷突襲']].slice(0,skillCount-1)};p.hp=p.maxhp;p.mp=p.maxmp;s.pets.push(p);s.bag[i][1]--;log(`🥚 妖獸蛋孵化！獲得【${m.name}・${tier}】。`);closeModal();render()}
function petPower(p){return Math.floor(p.level*70+p.maxhp*1.5+p.maxmp+p.skills.length*100+(p.tier==='高危種'?700:p.tier==='特殊種'?300:0))}function levelPet(p){while(p.exp>=p.expNeed){p.exp-=p.expNeed;p.level++;p.expNeed=Math.floor(p.expNeed*1.25);p.maxhp+=10;p.maxmp+=4;p.hp=p.maxhp;p.mp=p.maxmp}}

function sellPet(i){let p=s.pets[i],price=Math.floor(petPower(p)*.35);if(!confirm(`販售 ${p.name}，獲得約 ${price} 靈石？`))return;s.stones+=price;s.pets.splice(i,1);log(`💰 販售寵物，獲得 ${price} 靈石。`);render()}function discardPet(i){let p=s.pets[i];if(!confirm(`確定丟棄 ${p.name}？此行為會增加惡值。`))return;s.pets.splice(i,1);s.evil+=15;log(`🚮 你丟棄了 ${p.name}，惡值 +15。`);render()}
function marketPrice(base){let war=s.wars.filter(w=>w.active).length;return Math.floor(base*(1+war*.06)*(0.95+Math.random()*.18))}
function market(c){let items=[['普通靈草',55],['玄鐵',140],['妖骨',180],['妖皮',165],['靈露',220],['［初階］低級生命藥水',95],['［初階］低級靈力藥水',110],['［初階］鐵劍（攻+6）',850],['［中階］青鋒劍（攻+12）',2800],['［中階］玄甲衣（防+14）',3600],['神秘妖獸蛋',1800],['［初階］寵物飼料',70]];c.innerHTML=`<h2>💰 交易市場</h2><p class="sub">裝備與修行物資不再是廉價消耗品，戰爭仍會影響價格。</p><div class="cards">${items.map(x=>{let p=marketPrice(x[1]);return `<div class="card"><b>${x[0]}</b><br>${p} 靈石<br><button onclick="buyItem('${x[0]}',${p})">購買</button></div>`}).join('')}</div><h2>🔨 拍賣行</h2><div class="cards">${s.auction.map((a,i)=>`<div class="card"><b>${a.name}</b><br>${a.desc}<br>目前價格：${a.price} 靈石<br><button onclick="bid(${i})">出價</button></div>`).join('')}</div>`}
function buyItem(n,p){if(s.stones<p)return log('💰 靈石不足。'),render();s.stones-=p;if(n.includes('劍（攻+')){s.equip.武器=n;log(`🗡️ 購買並裝備 ${n}。`)}else addBag(n,1,n.includes('蛋')?'🥚 可孵化妖物寵物':n.includes('飼料')?'🐾 寵物成長用':'購買所得');render()}
function seedAuction(){if(!s)return;s.auction=[];let pool=[['［中階］玄霜劍（攻+15）','冰屬性法器',4800],['［高階］雷火丹','突破與戰鬥皆可用',3200],['天衍殘篇','特殊功法，學習另有條件',9000],['神秘妖獸蛋','可能孵化特殊種，極低機率高危種',2200],['［仙階］虛空石','仙階煉器材料',24000]];for(let i=0;i<4;i++){let x=pick(pool);s.auction.push({name:x[0],desc:x[1],price:Math.floor(x[2]*(.9+Math.random()*.4))})}}
function bid(i){let a=s.auction[i],p=Math.floor(a.price*1.1);if(s.stones<p)return log('💰 無法支付下一口價。'),render();if(Math.random()<.55){s.stones-=p;if(a.name==='天衍殘篇')s.techInventory.push('天衍殘篇');else addBag(a.name,1,a.desc);log(`🔨 以 ${p} 靈石拍得【${a.name}】。`);s.auction.splice(i,1)}else{a.price=Math.floor(p*1.12);log('🔨 有其他修士加價。')}render()}
function canCraftHere(){let p=s.place;return /鎮|城|京|港|關|宗|宮|門|谷/.test(p)||!!s.sect}
function craft(c){if(!canCraftHere()){c.innerHTML=`<h2>🔥 煉丹與煉器</h2><div class="card red">此處沒有穩定丹爐、器爐與地火。煉丹／煉器只能在城鎮、商店、宗門等安全設施內使用。</div>`;return}c.innerHTML=`<h2>🔥 煉丹</h2><div class="cards">${recipes.pill.map((r,i)=>recipeCard(r,'pill',i)).join('')}</div><h2>⚒️ 煉器</h2><div class="cards">${recipes.gear.map((r,i)=>recipeCard(r,'gear',i)).join('')}</div>`}
function recipeCard(r,type,i){return `<div class="card"><b>${r[0]}</b><br>${r[2]}<br><span class="tiny">材料：${Object.entries(r[1]).map(([k,v])=>k+'×'+v).join('、')}</span><br><button onclick="craftItem('${type}',${i})">煉製</button></div>`}
function craftItem(type,i){if(!canCraftHere())return log('🔥 此地無法煉製。'),render();let r=recipes[type][i];for(let [k,v] of Object.entries(r[1]))if((s.materials[k]||0)<v)return log('🔥 材料不足：'+k),render();for(let [k,v] of Object.entries(r[1]))s.materials[k]-=v;if(Math.random()<.72+realmPower(s.realm)/220){addBag(r[0],1,r[2]);log(`🔥 煉製成功：【${r[0]}】。`)}else log('💥 煉製失敗。');render()}
function world(c){let counts={};s.monsterPool.forEach(m=>counts[m.tier]=(counts[m.tier]||0)+1);c.innerHTML=`<h2>🌏 完整九州</h2><div class="world">${dynasties.map(d=>`<div><b>${d[0]}</b><br><span class="gold">${d[1]}</span><br><small>${d[2]}</small><br>${d.slice(3).map(p=>`<span class="pill">${p}</span>`).join('')}</div>`).join('')}</div><h3>👾 妖物生態</h3><div class="card">陸地／天空／水域皆有獨立生態。<br>一般種：<b>${counts.一般種||0}</b> 種<br>對應特殊種：<b>${counts.特殊種||0}</b> 種<br>高危種・菁英：<b>${counts.高危種||0}</b> 種（特殊地區）<br>妖王種・BOSS：<b>${counts.妖王種||0}</b> 種（特殊區域、世界事件、禁忌道具或禁地）</div><h3>⚔️ 敵對類型</h3><div class="card">👾 妖物　🐺 生物　🗡️ 人類：強盜、土匪、亡命劫修、嗜血散修等。</div><h3>🌌 仙道</h3><div class="card">練氣 → 築基 → 金丹 → 元嬰 → 化神 → 煉虛 → 合體 → 大乘 → 渡劫 → 真仙 → 天仙 → 帝仙 → <b class="gold">神帝</b><br><br>大道只在成仙後開啟，並成為真仙之後各仙境的重要突破條件。</div>`}
function chronicle(c){c.innerHTML=`<h2>📜 九州世錄</h2><h3>🏆 玩家戰績</h3><div class="card">一般種：${s.kills.一般種||0}<br>特殊種：${s.kills.特殊種||0}<br>高危種：${s.kills.高危種||0}<br>妖王種：${s.kills.妖王種||0}<br>敵對生物：${s.kills.生物||0}<br>敵對人類：${s.kills.人類||0}</div><h3>🌏 世界事件</h3><div class="log">${s.worldEvents.map(x=>`<div class="entry">${x}</div>`).join('')||'<div class="entry">世界暫時平靜。</div>'}</div>`}
function showModal(x){document.getElementById('modalbody').innerHTML=x;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modalbody').innerHTML=''}

const SAVE_PREFIX='jiuzhouRPG_v4_', SAVE_VERSION=4;
let autoSaveTimer=null,lastAutoSavedAt=0,saveManagerFromStart=false;
function snapshot(){return {version:SAVE_VERSION,savedAt:new Date().toISOString(),state:s,enemy:enemy,tabNow:tabNow};}
function saveKey(slot){return SAVE_PREFIX+slot}
function saveMeta(slot){try{let raw=localStorage.getItem(saveKey(slot));if(!raw)return null;let d=JSON.parse(raw),g=d.state||d;return {slot,savedAt:d.savedAt||null,name:g.name||'未知',realm:g.realm||'未知境界',year:g.year||213,day:g.day||1,place:g.place||'未知地點',gender:g.gender||'',legacy:!d.state};}catch(e){return null}}
function writeSave(slot,{silent=false}={}){if(!s)return false;try{let data=snapshot();localStorage.setItem(saveKey(slot),JSON.stringify(data));if(slot==='auto')lastAutoSavedAt=Date.now();if(!silent){log(slot==='auto'?'💾 已建立自動存檔。':`💾 已保存至存檔 ${slot}。`);toast(slot==='auto'?'💾 已自動存檔':`💾 存檔 ${slot} 完成`);}refreshContinueButton();return true}catch(e){console.error(e);if(!silent)alert('存檔失敗：瀏覽器儲存空間可能不足。\n'+e.message);return false}}
function autoSave(reason=''){if(!s)return;clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>{writeSave('auto',{silent:true});toast('💾 已自動存檔')},900)}
function quickSave(){if(!s)return;writeSave('auto');}
function loadSave(slot){try{let raw=localStorage.getItem(saveKey(slot));if(!raw)return alert('這個存檔槽目前是空的。');let d=JSON.parse(raw);s=d.state||d;enemy=d.enemy||null;tabNow=d.tabNow||'adventure';ensureState();document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');closeModal();render();toast(`▶️ 已讀取 ${slot==='auto'?'自動存檔':'存檔 '+slot}`)}catch(e){alert('讀取存檔失敗：'+e.message)}}
function deleteSave(slot){if(!localStorage.getItem(saveKey(slot)))return;if(!confirm(`確定要刪除${slot==='auto'?'自動存檔':'存檔 '+slot}嗎？`))return;localStorage.removeItem(saveKey(slot));openSaveManager(saveManagerFromStart);refreshContinueButton()}
function newestSaveSlot(){let arr=['auto','1','2','3'].map(k=>saveMeta(k)).filter(Boolean);arr.sort((a,b)=>new Date(b.savedAt||0)-new Date(a.savedAt||0));return arr[0]?.slot||null}
function refreshContinueButton(){let b=document.getElementById('continueBtn'),slot=newestSaveSlot();if(!b)return;if(slot){b.classList.remove('hidden');b.textContent='▶️ 繼續遊戲';b.onclick=()=>loadSave(slot)}else b.classList.add('hidden')}
function slotHTML(slot){let m=saveMeta(slot),label=slot==='auto'?'🛟 自動存檔':'📁 手動存檔 '+slot;if(!m)return `<div class="saveslot ${slot==='auto'?'auto':''}"><b>${label}</b><br><span class="sub">空白存檔槽</span><div class="saveactions">${s?`<button onclick="writeSave('${slot}');openSaveManager(${saveManagerFromStart})">💾 儲存</button>`:''}</div></div>`;let time=m.savedAt?new Date(m.savedAt).toLocaleString('zh-TW'):'舊版存檔';return `<div class="saveslot ${slot==='auto'?'auto':''}"><b>${label}</b><br>${m.gender} ${m.name}・<span class="gold">${m.realm}</span><br>王朝${m.year}年 第${m.day}日・${m.place}<br><span class="tiny sub">${time}</span><div class="saveactions"><button onclick="loadSave('${slot}')">▶️ 讀取</button>${s?`<button onclick="writeSave('${slot}');openSaveManager(${saveManagerFromStart})">💾 覆蓋</button>`:''}<button onclick="exportSave('${slot}')">📤 匯出</button><button onclick="deleteSave('${slot}')">🗑️ 刪除</button></div></div>`}
function openSaveManager(fromStart=false){saveManagerFromStart=!!fromStart;showModal(`<h2>💾 修仙存檔</h2><p class="sub">3 個手動槽＋1 個自動槽。角色、NPC、寵物、功法、宗門、戰爭、妖物生態、市場、拍賣與當前戰鬥都會一起保存。</p><div class="savegrid">${['auto','1','2','3'].map(slotHTML).join('')}</div><hr class="sep"><div class="saveactions"><button onclick="document.getElementById('saveImport').click()">📥 匯入備份</button>${s?'<button onclick="exportCurrent()">📤 匯出目前世界</button>':''}<button onclick="closeModal()">關閉</button></div><p class="tiny sub">自動存檔會在移動、修煉、戰鬥、交易、NPC互動與世界時間推進後延遲寫入，降低手機卡頓。</p>`)}
function exportPayload(data,name){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportSave(slot){let raw=localStorage.getItem(saveKey(slot));if(!raw)return;let d=JSON.parse(raw),g=d.state||d;exportPayload(d,`九州修仙錄_${g.name||'角色'}_${slot}_${Date.now()}.json`)}
function exportCurrent(){if(!s)return;exportPayload(snapshot(),`九州修仙錄_${s.name}_目前世界_${Date.now()}.json`)}
function importSaveFile(file){let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);let g=d.state||d;if(!g||!g.name||!g.npcs)throw new Error('不是有效的九州修仙錄存檔');localStorage.setItem(saveKey('3'),JSON.stringify(d.state?d:{version:2,savedAt:new Date().toISOString(),state:d,enemy:null,tabNow:'adventure'}));alert('匯入成功！已放入「手動存檔 3」。');openSaveManager(saveManagerFromStart);refreshContinueButton()}catch(e){alert('匯入失敗：'+e.message)}};reader.readAsText(file)}
function toast(msg){let t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1500)}
function migrateLegacy(){let old=localStorage.getItem('jiuzhouRPG_v3_auto')||localStorage.getItem('jiuzhouRPG_v2');if(old&&!localStorage.getItem(saveKey('1'))){try{let g=JSON.parse(old);localStorage.setItem(saveKey('1'),JSON.stringify({version:2,savedAt:new Date().toISOString(),state:g,enemy:null,tabNow:'adventure'}))}catch(e){}}}
window.addEventListener('beforeunload',()=>{if(s)writeSave('auto',{silent:true})});
window.addEventListener('load',()=>{migrateLegacy();document.getElementById('startBtn')?.addEventListener('click',startGame);document.getElementById('saveImport')?.addEventListener('change',e=>{let f=e.target.files?.[0];if(f)importSaveFile(f);e.target.value=''});refreshContinueButton()});

const ROOT_KEYS=['火','水','風','雷','木','土','冰'];
const ROOT_ICONS={火:'🔥',水:'💧',風:'🌪️',雷:'⚡',木:'🌳',土:'🪨',冰:'❄️'};
const TECH_ROOT_REQ={
 '烈火術':{root:'火',need:40},'水靈盾':{root:'水',need:35},'御風步':{root:'風',need:30},'雷鳴訣':{root:'雷',need:60},'冰魄封脈':{root:'冰',need:60},'回春術':{root:'木',need:35}
};
function rollRootAffinities(){let a={};ROOT_KEYS.forEach(k=>a[k]=rint(1,70));let dominant=pick(ROOT_KEYS);a[dominant]=rint(72,100);if(Math.random()<.18){let second=pick(ROOT_KEYS.filter(x=>x!==dominant));a[second]=rint(60,92)}return a}
function dominantRootName(a){let k=ROOT_KEYS.reduce((best,x)=>a[x]>a[best]?x:best,ROOT_KEYS[0]);return `${ROOT_ICONS[k]}${k}`}
function gameHours(){return ((s.year-213)*360+(s.day-1))*24+s.hour}
function recoverRetreatCharges(){if(!s)return;if(s.retreatCharges==null)s.retreatCharges=5;if(s.retreatRecoveryAnchor==null)s.retreatRecoveryAnchor=gameHours();let now=gameHours(),elapsed=now-s.retreatRecoveryAnchor;if(elapsed>=12&&s.retreatCharges<5){let add=Math.min(5-s.retreatCharges,Math.floor(elapsed/12));s.retreatCharges+=add;s.retreatRecoveryAnchor+=add*12;if(s.retreatCharges>=5)s.retreatRecoveryAnchor=now}else if(s.retreatCharges>=5){s.retreatRecoveryAnchor=now}}
function nextRetreatRecovery(){recoverRetreatCharges();if(s.retreatCharges>=5)return '已滿';let remain=12-(gameHours()-s.retreatRecoveryAnchor);return `${Math.max(1,Math.ceil(remain))}小時後 +1`}
function isSafeLocation(place=s.place){return /鎮|城|皇城|帝都|京|港|關$|仙庭|宮$|宗$|門$/.test(place)}
function safeZoneCrisisActive(){return !!(s.safeZoneCrisis&&gameHours()<s.safeZoneCrisis.until)}

function ensureState(){if(!s)return;s.good=s.good||0;s.evil=s.evil||0;s.dao=s.dao||0;s.lastRetreatDay=s.lastRetreatDay??-99;s.techInventory=s.techInventory||[];s.pets=s.pets||[];s.petSlots=s.petSlots||1;s.petSlotPurchases=s.petSlotPurchases||0;s.kills=s.kills||{};['一般種','特殊種','高危種','妖王種','生物','人類'].forEach(k=>s.kills[k]=s.kills[k]||0);if(!s.equip)s.equip={};if(!s.equip.武器||s.equip.武器==='無')s.equip.武器='［初階］木劍（攻+3）';if(!s.monsterPool||s.monsterPool.length<2200)s.monsterPool=generateMonsterPool();if(!s.rootAffinities)s.rootAffinities=rollRootAffinities();s.root=dominantRootName(s.rootAffinities);if(s.retreatCharges==null)s.retreatCharges=5;if(s.retreatRecoveryAnchor==null)s.retreatRecoveryAnchor=gameHours();s.starterGuide=s.starterGuide||{step:0};s.safeZoneCrisis=s.safeZoneCrisis||null;recoverRetreatCharges()}

function chooseItemTarget(i,target,inCombat=false,petIndex=-1){let x=s.bag[i];if(!x||x[1]<=0)return;if(x[0].includes('蛋')){if(target!=='player')return;return hatchEgg(i,inCombat)}let amount=0;if(target==='player'){if(x[0].includes('生命')){amount=recoveryAmount(x[0],'hp');s.hp=Math.min(s.maxhp,s.hp+amount)}else if(x[0].includes('靈力')){amount=recoveryAmount(x[0],'mp');s.mp=Math.min(s.maxmp,s.mp+amount)}else if(x[0].includes('回元')){amount=x[0].includes('［高階］')?300:x[0].includes('［中階］')?120:50;s.hp=Math.min(s.maxhp,s.hp+amount)}else if(x[0].includes('凝靈')){amount=x[0].includes('［高階］')?200:x[0].includes('［中階］')?80:30;s.mp=Math.min(s.maxmp,s.mp+amount)}else if(x[0].includes('飼料'))return log('🐾 寵物飼料不能給玩家吃。'),itemMenu(inCombat)}else{let p=s.pets[petIndex];if(!p)return;if(x[0].includes('飼料')){p.exp+=x[0].includes('高階')?60:x[0].includes('中階')?30:12;p.aff=clamp(p.aff+1,0,100);levelPet(p)}else if(x[0].includes('生命')||x[0].includes('回元')){amount=recoveryAmount(x[0],'hp');p.hp=Math.min(p.maxhp,p.hp+amount)}else if(x[0].includes('靈力')||x[0].includes('凝靈')){amount=recoveryAmount(x[0],'mp');p.mp=Math.min(p.maxmp,p.mp+amount)}}x[1]--;log(`🧪 使用 ${x[0]}${amount?`，恢復 ${amount}`:''}。`);if(inCombat&&enemy){enemyTurn();refreshCombat()}else{closeModal();render()}}

function techniques(c){let learned=[...s.techs,...s.skills],owned=s.techInventory||[];c.innerHTML=`<h2>📖 功法</h2><h3>🌿 靈根資質</h3>${rootPanel()}<h3>✅ 已學會</h3><div class="cards">${learned.map(n=>{let t=[...basicTechs,...rareTechs].find(x=>x.name===n);return `<div class="card"><b>${n}</b><br>${t?.type||'基礎'}<br><span class="sub">${t?.desc||'已掌握的修行法門'}</span><br><span class="tiny">${techniqueReqText(n)}</span></div>`}).join('')||'<div class="card">尚無</div>'}</div><h3>📜 持有功法（未學習）</h3><div class="cards">${owned.map(n=>{let t=rareTechs.find(x=>x.name===n)||basicTechs.find(x=>x.name===n);return `<div class="card"><b>${n}</b><br>${t?.desc||''}<br>需求：${techniqueReqText(n)}<br>來源：${t?.source||'未知'}<br><button onclick="learnOwnedTech('${n}')">參悟學習</button></div>`}).join('')||'<div class="card">目前沒有未學習功法。多數功法需透過購買、任務、NPC或冒險取得。</div>'}</div><h3>🌱 基礎功法商店</h3><div class="cards">${basicTechs.filter(t=>t.cost>0).map(t=>`<div class="card"><b>${t.name}</b> <span class="pill">${t.type}</span><br>${t.desc}<br>需求：${techniqueReqText(t.name)}<br><b>${t.cost} 靈石</b><br>${learned.includes(t.name)?'<span class="green">已習得</span>':owned.includes(t.name)?'<span class="orange">已持有</span>':`<button onclick="buyTechnique('${t.name}',${t.cost})">購買功法卷</button>`}</div>`).join('')}</div>`}
function learnOwnedTech(n){let t=[...basicTechs,...rareTechs].find(x=>x.name===n);if(!t)return;let rr=TECH_ROOT_REQ[n];if(rr&&(s.rootAffinities[rr.root]||0)<rr.need)return log(`⚠️ 【${n}】至少需要 ${rr.root}靈根 ${rr.need}，你目前只有 ${s.rootAffinities[rr.root]||0}。`),render();if(t.special){if((s.materials[t.special.item]||0)<t.special.count||s.exp<t.special.exp)return log(`⚠️ 【${n}】需要 ${t.special.item}×${t.special.count} 並消耗修為 ${t.special.exp}。`),render();s.materials[t.special.item]-=t.special.count;s.exp-=t.special.exp}if(t.kind==='skill')s.skills.push(n);else s.techs.push(n);s.techInventory=s.techInventory.filter(x=>x!==n);log(`📖 你成功參悟【${n}】。`);render()}
function useSkill(name){if(s.mp<8){log('🔵 靈力不足。');refreshCombat();return}s.mp-=8;if(name.includes('回氣')||name.includes('回春')){let heal=name.includes('回春')?35:18;s.hp=Math.min(s.maxhp,s.hp+heal);log(`🌿 ${name}恢復${heal} HP。`)}else{let rr=TECH_ROOT_REQ[name],rootMul=rr?(.55+(s.rootAffinities[rr.root]||0)/100):1,mult=(name.includes('雷')?1.6:name.includes('劍')?1.35:1.2)*rootMul,dmg=Math.max(3,Math.floor((s.atk+12)*mult)-enemy.def+rint(0,9));enemy.hp-=dmg;log(`✨ 施展【${name}】${rr?`（${rr.root}靈根${s.rootAffinities[rr.root]}）`:''}，造成 ${dmg} 傷害。`)}if(enemy&&enemy.hp<=0)return win();if(enemy)enemyTurn();refreshCombat()}
function npc(c){ensureNearbyNPCs();let max=isSafeLocation()?2:rint(1,2),near=s.npcs.filter(n=>n.alive&&n.place===s.place).slice(0,max);c.innerHTML=`<h2>🌸 當前場所人物</h2><p class="sub">只顯示實際位於【${s.place}】附近的人物；荒野通常只有一、兩人。</p>${near.length?`<div class="cards">${near.map(n=>`<div class="card"><b>${n.gender==='女'?'🌸':'🗡️'} ${n.name}</b><br>性別：${n.gender}<br>${n.realm}・${n.sect}<br>${n.age}歲・${n.personality}<br>💥 戰力值：${Math.floor(realmPower(n.realm)*90+n.talent*8)}<br>好感：<span class="red">${heartBar(n.aff)}</span><br>${n.married?'💍 已婚':''}<div class="choices"><button onclick="openNPCDialogue('${n.id}')">💬 交談</button><button onclick="npcAct('${n.id}','gift')">🎁 贈禮</button><button onclick="npcAct('${n.id}','help')">🤝 幫助</button><button onclick="npcAct('${n.id}','attack')">⚔️ 攻擊</button><button onclick="npcAct('${n.id}','rob')">💰 搶奪</button>${n.gender!==(s.gender==='少女'?'女':'男')&&n.aff>=65&&!n.married?`<button onclick="npcAct('${n.id}','love')">💗 表明心意</button>`:''}${n.aff>=85&&!n.married?`<button onclick="npcAct('${n.id}','marry')">💍 求婚</button>`:''}</div></div>`).join('')}</div>`:'<div class="card">此刻附近沒有可互動的修士。</div>'}<h3>👨‍👩‍👧 家族</h3><div class="card">伴侶：${s.spouse||'無'}<br>子女：${s.children.length?s.children.join('、'):'無'}</div>`}
function npcGreeting(n){let mood=s.evil>s.good+20?'戒備地看著你，手已按在兵器上。':n.personality==='冷淡'?'只淡淡看了你一眼。':n.injured?'臉色蒼白，似乎受了傷。':`正在${isSafeLocation()?'附近停留':'趕路'}，注意到你靠近。`;return `「${n.name}」${mood}`}
function openNPCDialogue(id){let n=s.npcs.find(x=>x.id===id);if(!n||!n.alive||n.place!==s.place)return;showModal(`<h2>💬 與 ${n.name} 交談</h2><div class="dialogue">${npcGreeting(n)}</div><div class="choices"><button onclick="npcDialogueChoice('${id}','greet')">1. 向前打招呼</button><button onclick="npcDialogueChoice('${id}','helpq')">2. 你需要幫助嗎？</button><button onclick="npcDialogueChoice('${id}','asksect')">3. 詢問宗門與附近消息</button><button onclick="npcDialogueChoice('${id}','askself')">4. 詢問對方近況</button><button onclick="closeModal()">5. 告辭</button></div>`)}
function npcDialogueChoice(id,ch){let n=s.npcs.find(x=>x.id===id);if(!n)return;advance(1);let speech='',gain=0;if(ch==='greet'){gain=s.evil>s.good+20?0:rint(1,3);speech=n.personality==='冷淡'?'「嗯。有事直說。」':'「道友有禮。初次見面，多多關照。」'}else if(ch==='helpq'){if(n.injured){gain=6;s.good+=3;n.injured=false;speech='「若你真願出手相助，我記下這份人情。」'}else{gain=2;speech='「暫時無礙，不過多謝你有這份心。」'}}else if(ch==='asksect'){gain=1;speech=n.sect==='散修'?'「我無門無派。若你想拜師，可往大城或名山尋宗門。」':`「我出身${n.sect}。入門規矩不算簡單，但總比散修多些依靠。」`}else if(ch==='askself'){gain=1;speech=`「我叫${n.name}，${n.age}歲，如今${n.realm}。九州太大，我也只是走自己的路。」`}n.aff=clamp(n.aff+gain,-100,100);showModal(`<h2>💬 ${n.name}</h2><div class="dialogue">${speech}</div><p>好感：<span class="red">${heartBar(n.aff)}</span>${gain?` <span class="green">+${gain}</span>`:''}</p><div class="choices"><button onclick="openNPCDialogue('${id}')">繼續交談</button><button onclick="closeModal();render()">結束對話</button></div>`)}
function sect(c){let mine=s.sect?`<div class="card"><b>${s.sect}</b><br>身份：${s.sectRank}<br>宗門聲望：${s.sectRep}<div class="choices"><button onclick="sectTask()">📜 宗門任務</button><button onclick="sectPromote()">⬆️ 申請晉升</button><button onclick="leaveSect()">🚪 退出宗門</button></div></div>`:'<div class="card">你目前是散修。加入宗門前可以先與接引弟子交談；若修為與財力足夠，也能自立門戶。</div>';c.innerHTML=`<h2>🏯 宗門系統</h2>${mine}${!s.sect?'<div class="card"><button class="primary" onclick="openCreateSectDialog()">🏗️ 創建宗門</button><br><span class="tiny sub">條件：至少金丹一層、20,000靈石。</span></div>':''}<div class="cards">${s.sects.map((x,i)=>`<div class="card"><b>${x.name}</b><br>${x.type}・${x.dyn}<br>勢力：${x.power}/100<br>${!s.sect?`<button onclick="openSectJoinDialog(${i})">與接引弟子交談</button>`:''}</div>`).join('')}</div>`}
function openSectJoinDialog(i){let x=s.sects[i],fee=x.power>80?1200:650;showModal(`<h2>🏯 ${x.name}</h2><div class="dialogue"><b>接引弟子：</b>「想入我${x.name}，不是報個名字便行。你可先問清規矩，再決定是否參加入門試煉。」</div><div class="card">宗門：${x.type}<br>所屬：${x.dyn}<br>入門費：${fee} 靈石<br>仍需通過基礎比試</div><div class="choices"><button onclick="sectJoinDialogue(${i},'rules')">1. 詢問入門規矩</button><button onclick="sectJoinDialogue(${i},'test')">2. 參加入門試煉</button><button onclick="sectJoinDialogue(${i},'rumor')">3. 打聽宗門近況</button><button onclick="closeModal()">4. 暫時離開</button></div>`)}
function sectJoinDialogue(i,ch){let x=s.sects[i],fee=x.power>80?1200:650;if(ch==='rules')return showModal(`<h2>📜 入門規矩</h2><div class="dialogue">「繳納${fee}靈石，再通過一次基礎比試。若修為太弱，長老不會放你進山門。」</div><button onclick="openSectJoinDialog(${i})">返回</button>`);if(ch==='rumor')return showModal(`<h2>💬 宗門近況</h2><div class="dialogue">「近來九州並不太平，宗門正在招募能辦事的弟子。若入門，任務自然少不了。」</div><button onclick="openSectJoinDialog(${i})">返回</button>`);if(ch==='test'){closeModal();joinSect(i)}}
function openCreateSectDialog(){if(s.sect)return;let names=['凌虛閣','青霄門','問道山莊'];showModal(`<h2>🏗️ 自立宗門</h2><div class="dialogue">建立宗門意味著你要負責山門、弟子、資源與敵人。沒有金丹修為與足夠靈石，根本無法立足。</div><div class="card">條件：金丹一層以上・20,000靈石</div><div class="choices">${names.map((n,i)=>`<button onclick="createSect('${n}')">${i+1}. 創立【${n}】</button>`).join('')}<button onclick="closeModal()">取消</button></div>`)}
function createSect(name){if(realmPower(s.realm)<21)return showModal(`<h2>🏗️ 創建失敗</h2><div class="dialogue">你的修為尚未達到金丹一層，無法鎮住山門。</div><button onclick="closeModal()">返回</button>`);if(s.stones<20000)return showModal(`<h2>🏗️ 創建失敗</h2><div class="dialogue">建立最基本的山門也需要20,000靈石。</div><button onclick="closeModal()">返回</button>`);s.stones-=20000;s.sect=name;s.sectRank='宗主';s.sectRep=20;s.sects.push({id:s.sects.length,name,type:'自創宗門',dyn:(placeInfo[s.place]?.王朝||'無'),power:20,treasury:5000,relations:{},war:null,playerFounded:true});log(`🏗️ 你耗費20,000靈石，在九州立下【${name}】，自任宗主。`);closeModal();render()}
function market(c){let items=[['普通靈草',55],['玄鐵',140],['妖骨',180],['妖皮',165],['靈露',220],['［初階］低級生命藥水',95],['［初階］低級靈力藥水',110],['［中階］生命藥水',420],['［中階］靈力藥水',460],['［高階］生命藥水',1800],['［高階］靈力藥水',1950],['［初階］鐵劍（攻+6）',850],['［中階］青鋒劍（攻+12）',2800],['［中階］玄甲衣（防+14）',3600],['神秘妖獸蛋',1800],['［初階］寵物飼料',70]];if(isImmortal()){items.push(['［仙階］生命藥水',12000],['［仙階］靈力藥水',13500])}c.innerHTML=`<h2>💰 交易市場</h2><p class="sub">裝備與修行物資價格會受戰爭影響。仙階藥品只有成仙後才可能在高級市場看到。</p><div class="cards">${items.map(x=>{let p=marketPrice(x[1]);return `<div class="card"><b>${x[0]}</b><br>${x[0].includes('生命藥水')?`效果：HP +${recoveryAmount(x[0],'hp')}<br>`:x[0].includes('靈力藥水')?`效果：靈力 +${recoveryAmount(x[0],'mp')}<br>`:''}${p} 靈石<br><button onclick="buyItem('${x[0]}',${p})">購買</button></div>`}).join('')}</div><h2>🔨 拍賣行</h2><div class="cards">${s.auction.map((a,i)=>`<div class="card"><b>${a.name}</b><br>${a.desc}<br>目前價格：${a.price} 靈石<br><button onclick="bid(${i})">出價</button></div>`).join('')}</div>`}
function buyItem(n,p){if(s.stones<p)return log('💰 靈石不足。'),render();s.stones-=p;if(n.includes('劍（攻+')){s.equip.武器=n;log(`🗡️ 購買並裝備 ${n}。`)}else{let desc=n.includes('生命藥水')?`❤️ HP +${recoveryAmount(n,'hp')}`:n.includes('靈力藥水')?`🔵 靈力 +${recoveryAmount(n,'mp')}`:n.includes('蛋')?'🥚 可孵化妖物寵物':n.includes('飼料')?'🐾 寵物成長用':'購買所得';addBag(n,1,desc)}render()}

function rollRootAffinities(){let a={},main=pick(ROOT_KEYS);ROOT_KEYS.forEach(k=>a[k]=k===main?rint(85,100):rint(1,5));return a}
function migrateRootsV06(){if(s.rulesVersion06)return;let old=s.rootAffinities||rollRootAffinities(),main=ROOT_KEYS.reduce((b,k)=>(old[k]||0)>(old[b]||0)?k:b,ROOT_KEYS[0]),a={};ROOT_KEYS.forEach(k=>a[k]=k===main?clamp(Math.max(85,old[k]||85),85,100):clamp(old[k]||rint(1,5),1,5));s.rootAffinities=a;s.root=dominantRootName(a);s.rulesVersion06=true}
function realmFromPower(p){p=Math.max(1,Math.floor(p));if(p>=100){if(p>=235)return '神帝';if(p>=190)return '帝仙';if(p>=145)return '天仙';return '真仙'}let major=Math.min(7,Math.floor((p-1)/10)),lv=(p-1)%10+1;return realmNames[major]+lv+'層'}
function playerSex(){return s.gender==='少女'?'女':'男'}
function romanceAllowed(n){return n.gender!==playerSex()}
function heartBar(aff){let n=clamp(Math.floor((Math.max(0,aff||0)+.001)/10),0,10);return '♥'.repeat(n)+'♡'.repeat(10-n)}
function heartCount(aff){return clamp(Math.floor(Math.max(0,aff||0)/10),0,10)}
function addExp(amount,source='修行'){if(!s||amount<=0)return;s.exp=(s.exp||0)+Math.floor(amount);log(`✨ ${source}獲得修為 +${Math.floor(amount)}。`);checkExpFull()}
function checkExpFull(){if(!s||s.exp<s.expNeed)return;let key=s.realm+'|'+s.expNeed;if(s.expFullAlertKey===key)return;s.expFullAlertKey=key;setTimeout(()=>{if(s&&s.exp>=s.expNeed)showModal(`<h2>✨ 修為已滿</h2><div class="dialogue">你的修為已達目前境界上限，請前往【🧘 修煉】嘗試提升境界。</div><div class="card">目前修為：${s.exp}/${s.expNeed}<br>溢出修為：<b class="gold">${Math.max(0,s.exp-s.expNeed)}</b><br><span class="sub">突破成功後，溢出的修為會自動補回下一境界。</span></div><button class="primary" onclick="closeModal();tab('cult')">前往突破</button> <button onclick="closeModal()">稍後</button>`)},40)}
function cultivationGain(){let p=realmPower(s.realm),major=Math.min(12,Math.floor((p-1)/10)),lv=(p-1)%10+1,base=10+major*20+Math.floor(lv*2.5);if(p>=100)base=240+Math.floor((p-100)*2.2);let bonus=s.techs.includes('凝神訣')?1.18:1;return Math.floor(rint(Math.floor(base*.8),Math.floor(base*1.2))*bonus)}
function combatPower(x=s){if(!x)return 0;if(x===s){let p=realmPower(s.realm),rootBest=Math.max(...ROOT_KEYS.map(k=>s.rootAffinities?.[k]||0)),tech=(s.techs?.length||0)*32+(s.skills?.length||0)*48;return Math.max(1,Math.floor(p*125+s.maxhp*1.05+s.maxmp*.75+s.atk*13+s.def*12+s.agi*7+gearBonus()*1.8+rootBest*1.4+tech))}let rp=x.realm?realmPower(x.realm):Math.max(1,(x.danger||1)*8);return Math.max(1,Math.floor(rp*115+(x.maxhp||x.hp||0)*.9+(x.atk||0)*12+(x.def||0)*11+(x.maxmp||x.mp||0)*.65+(x.tier==='特殊種'?75:x.tier==='高危種'?180:x.tier==='妖王種'?420:0)))}
function powerClass(v){let d=v-combatPower();return d<0?'green':d<=100?'':'red'}
function powerLabel(v){let d=v-combatPower();return d<0?'較弱':d<=100?'相近':'危險'}
function inFirstDynasty(place=s.place){return placeInfo[place]?.王朝==='大御王朝'}
function isGiftName(n){return /^🎁|禮物|香囊|玉佩|花束|糕點/.test(n)}

function guardClearEvil(){if(!isSafeLocation())return;let amount=Math.min(s.evil,30),cost=amount*35;if(amount<=0)return log('🛡️ 你目前沒有需要清除的惡值。'),render();showModal(`<h2>🛡️ 城鎮衛隊・清除惡名</h2><div class="card">可清除惡值：${amount}<br>所需靈石：${cost}<br><span class="sub">衛隊會要求繳納罰金、賠償與登記費用。</span></div><button class="primary" onclick="confirmClearEvil(${amount},${cost})">確認處理</button> <button onclick="closeModal()">取消</button>`)}

function startEggIncubation(i,inCombat=false){let x=s.bag[i];if(!x||x[1]<=0||!isEggName(x[0]))return;let r=Math.random(),hours=r<.005?48:r<.07?36:r<.28?24:r<.58?18:12;s.incubatingEggs.push({id:'egg'+Date.now()+Math.random(),name:x[0],startedAt:gameHours(),readyAt:gameHours()+hours,hours,forcedSpecial:hours===48});x[1]--;log(`🥚 將妖獸蛋放入孵化陣，預計 ${hours} 小時後孵化${hours===48?'；此蛋靈息異常濃厚，必為特殊種':''}。`);if(inCombat&&enemy){enemyTurn();refreshCombat()}else{closeModal();render()}}

function petElement(m){let n=(m.name||'')+(m.skill||'');if(/火|焰|熔|赤/.test(n))return '火';if(/水|潮|海|冰湖/.test(n))return '水';if(/雷|電/.test(n))return '雷';if(/冰|霜|寒/.test(n))return '冰';if(/風|翼|羽/.test(n))return '風';if(/木|竹|藤|靈鹿/.test(n))return '木';return '土'}

function claimEgg(id){processIncubatingEggs();let idx=s.incubatingEggs.findIndex(e=>e.id===id),egg=s.incubatingEggs[idx];if(!egg||!egg.ready)return;if(s.pets.length>=s.petSlots)return log('🐾 寵物欄已滿，暫時無法取出孵化完成的寵物。'),render();let r=Math.random(),tier=egg.forcedSpecial?'特殊種':r<.001?'高危種':r<.095?'特殊種':'一般種',pool=s.monsterPool.filter(m=>m.tier===tier&&!m.boss),m=pick(pool),p={name:m.name,species:m.base,tier,element:petElement(m),level:1,exp:0,expNeed:50,maxhp:tier==='高危種'?130:tier==='特殊種'?95:70,maxmp:tier==='高危種'?55:tier==='特殊種'?40:25,aff:10};p.hp=p.maxhp;p.mp=p.maxmp;p.skills=petSkillsFor(m,tier);s.pets.push(p);s.incubatingEggs.splice(idx,1);log(`🥚 孵化完成！獲得【${m.name}・${tier}・${p.element}屬性】。`);render()}

function market(c){if(!isSafeLocation()){c.innerHTML=`<h2>💰 商店與市集</h2><div class="card red">荒野中沒有固定商人。請前往村莊、城鎮、商港或宗門據點交易。</div>${sellPanelHTML(false)}`;return}let items=[...SHOP_ITEMS_V06];if(placeInfo[s.place]?.danger>=4){let root=pick(ROOT_KEYS);items.push([`［高階］${root}靈根淬煉丹`,8500])}if(isImmortal())items.push(['［仙階］生命藥水',18000],['［仙階］靈力藥水',19500]);c.innerHTML=`<h2>💰 商店・購買</h2><p class="sub">禮物必須實際購買或取得後才能送給NPC；裝備不會購買後自動穿上。</p><div class="cards">${items.map(x=>{let p=marketPrice(x[1]);return `<div class="card"><b>${x[0]}</b><br>${p} 靈石<br><button onclick="buyItem('${x[0]}',${p})">購買</button></div>`}).join('')}</div>${sellPanelHTML(true)}<h2>🔨 拍賣行</h2><div class="cards">${s.auction.map((a,i)=>`<div class="card"><b>${a.name}</b><br>${a.desc}<br>目前價格：${a.price} 靈石<br><button onclick="bid(${i})">出價</button></div>`).join('')}</div>`}
function buyItem(n,p){if(s.stones<p)return log('💰 靈石不足。'),render();s.stones-=p;let desc=n.includes('生命藥水')?`❤️ HP +${recoveryAmount(n,'hp')}`:n.includes('靈力藥水')?`🔵 靈力 +${recoveryAmount(n,'mp')}`:isEggName(n)?'🥚 可放入孵化陣':isGiftName(n)?'🎁 可贈送NPC':n.includes('靈根淬煉丹')?'🌿 玩家使用後永久提升對應靈根1～3':isPetFoodName(n)?'🐾 寵物專用':'購買所得';addBag(n,1,desc);log(`🛍️ 購買【${n}】，已放入背包。`);render()}
function sellPanelHTML(enabled){let bag=s.bag.map((x,i)=>({x,i})).filter(o=>o.x[1]>0&&o.x[0]!=='母親的姻緣戒指'),mats=Object.entries(s.materials).filter(([,v])=>v>0),tech=(s.techInventory||[]);return `<h2>💰 販賣給商人</h2>${!enabled?'<p class="red">目前不在可交易地點，無法出售。</p>':''}<h3>🎒 背包物品</h3><div class="cards">${bag.map(o=>`<div class="card"><b>${o.x[0]}</b><br>持有：${o.x[1]}<br>商人收購：${estimateSellPrice(o.x[0],o.x[2])} 靈石<br><button onclick="sellBagItem(${o.i})" ${enabled?'':'disabled'}>販售1個</button></div>`).join('')||'<div class="card">沒有可販售物品。</div>'}</div><h3>🧱 素材</h3><div class="cards">${mats.map(([n,v])=>`<div class="card"><b>${n}</b><br>持有：${v}<br>收購：${materialSellPrice(n)} 靈石<br><button onclick="sellMaterial('${n}')" ${enabled?'':'disabled'}>販售1個</button></div>`).join('')||'<div class="card">沒有素材。</div>'}</div><h3>📜 未學習/重複功法</h3><div class="cards">${tech.map((n,i)=>`<div class="card"><b>${n}</b><br>收購：${techniqueSellPrice(n)} 靈石<br><button onclick="sellTechnique(${i})" ${enabled?'':'disabled'}>販售</button></div>`).join('')||'<div class="card">沒有可販售功法卷。</div>'}</div>`}
function sellBagItem(i){if(!isSafeLocation())return;let b=s.bag[i];if(!b||b[1]<=0)return;let v=estimateSellPrice(b[0],b[2]);b[1]--;s.stones+=v;log(`💰 將【${b[0]}】出售給商人，獲得 ${v} 靈石。`);render()}
function sellMaterial(n){if(!isSafeLocation()||!s.materials[n])return;let v=materialSellPrice(n);s.materials[n]--;s.stones+=v;log(`💰 出售 ${n}，獲得 ${v} 靈石。`);render()}
function sellTechnique(i){if(!isSafeLocation())return;let n=s.techInventory[i];if(!n)return;let v=techniqueSellPrice(n);s.techInventory.splice(i,1);s.stones+=v;log(`📜 出售功法卷【${n}】，獲得 ${v} 靈石。`);render()}

function techniques(c){let learned=[...s.techs,...s.skills],owned=s.techInventory||[];c.innerHTML=`<h2>📖 功法</h2><h3>✅ 已學會</h3><div class="cards">${learned.map(n=>{let t=[...basicTechs,...rareTechs].find(x=>x.name===n);return `<div class="card"><b>${n}</b><br>${t?.type||'基礎'}<br><span class="sub">${t?.desc||'已掌握的修行法門'}</span><br><span class="tiny">${techniqueReqText(n)}</span></div>`}).join('')||'<div class="card">尚無</div>'}</div><h3>📜 持有功法（未學習/重複卷）</h3><div class="cards">${owned.map((n,i)=>{let t=rareTechs.find(x=>x.name===n)||basicTechs.find(x=>x.name===n),already=learned.includes(n);return `<div class="card"><b>${n}</b>${already?' <span class="orange">重複卷</span>':''}<br>${t?.desc||''}<br>需求：${techniqueReqText(n)}<br>來源：${t?.source||'未知'}<br>${already?'<span class="sub">此功法已學會，不可重複學習；可在商店販售。</span>':`<button onclick="learnOwnedTech('${n}')">參悟學習</button>`}</div>`}).join('')||'<div class="card">目前沒有未學習功法。</div>'}</div><h3>🌱 基礎功法商店</h3><div class="cards">${basicTechs.filter(t=>t.cost>0).map(t=>`<div class="card"><b>${t.name}</b> <span class="pill">${t.type}</span><br>${t.desc}<br>需求：${techniqueReqText(t.name)}<br><b>${t.cost} 靈石</b><br>${learned.includes(t.name)?'<span class="green">已習得</span>':`<button onclick="buyTechnique('${t.name}',${t.cost})">購買功法卷</button>`}</div>`).join('')}</div>`}
function learnOwnedTech(n){if(s.techs.includes(n)||s.skills.includes(n))return log(`📖 【${n}】已經學會，重複功法卷可拿到商店販售。`),render();let idx=s.techInventory.indexOf(n),t=[...basicTechs,...rareTechs].find(x=>x.name===n);if(idx<0||!t)return;let rr=TECH_ROOT_REQ[n];if(rr&&(s.rootAffinities[rr.root]||0)<rr.need)return log(`⚠️ 【${n}】至少需要 ${rr.root}靈根 ${rr.need}。`),render();if(t.special){if((s.materials[t.special.item]||0)<t.special.count||s.exp<t.special.exp)return log(`⚠️ 【${n}】需要 ${t.special.item}×${t.special.count} 並消耗修為 ${t.special.exp}。`),render();s.materials[t.special.item]-=t.special.count;s.exp-=t.special.exp}if(t.kind==='skill')s.skills.push(n);else s.techs.push(n);s.techInventory.splice(idx,1);log(`📖 成功參悟【${n}】。`);render()}
function buyTechnique(n,cost){if(s.stones<cost)return log('💰 靈石不足。'),render();s.stones-=cost;s.techInventory.push(n);log(`📜 花費 ${cost} 靈石購得【${n}】功法卷。${s.techs.includes(n)||s.skills.includes(n)?'你已學會此功法，可將重複卷出售。':''}`);render()}

function makeSectQuest(){let stars=rint(1,5),types=['kill','gather','talk'],type=pick(types),places=Object.keys(placeInfo).filter(p=>placeInfo[p].王朝===placeInfo[s.place]?.王朝&&!isSafeLocation(p));if(!places.length)places=Object.keys(placeInfo).filter(p=>!isSafeLocation(p));let place=pick(places),q={id:'sq'+(s.questSerial++),stars,type,place,progress:0,count:type==='talk'?1:stars<=2?rint(1,2):rint(2,4),accepted:false};if(type==='kill'){q.target=pick(['妖物','生物','人類']);q.title='清剿任務';q.description=`前往【${place}】擊敗 ${q.count} 名/隻${q.target}`}else if(type==='gather'){q.target=pick(['普通靈草','玄鐵','妖骨','妖皮','靈露']);q.title='採集任務';q.description=`前往【${place}】採集 ${q.target} ×${q.count}`}else{q.target='NPC';q.title='聯絡任務';q.description=`前往【${place}】與任意NPC交談 ${q.count} 次`}q.rewardRep=stars*12+rint(3,8);q.rewardStones=stars*180+rint(50,180);q.rewardExp=stars*18;return q}
function refreshSectOffers(){if(!s.sectQuestOffers?.length)s.sectQuestOffers=[makeSectQuest(),makeSectQuest(),makeSectQuest()]}
function sectTask(){refreshSectOffers();showModal(`<h2>📜 宗門任務</h2><p class="sub">星數越高，敵人/地區與目標數量通常越困難，宗門聲望與獎勵也越高。</p>${s.sectQuestOffers.map(q=>`<div class="card"><b>${'⭐'.repeat(q.stars)} ${q.title}</b><br>${q.description}<br>獎勵：聲望 +${q.rewardRep}、靈石 +${q.rewardStones}、修為 +${q.rewardExp}<br><button onclick="acceptSectQuest('${q.id}')">接受任務</button></div>`).join('')}<h3>進行中</h3>${(s.activeSectQuests||[]).map(q=>`<div class="card"><b>${'⭐'.repeat(q.stars)} ${q.title}</b><br>${q.description}<br>進度：${q.progress}/${q.count}<br><button onclick="submitSectQuest('${q.id}')" ${q.progress>=q.count?'':'disabled'}>提交任務</button></div>`).join('')||'<div class="card">目前沒有進行中的宗門任務。</div>'}<button onclick="closeModal()">關閉</button>`)}
function acceptSectQuest(id){let i=s.sectQuestOffers.findIndex(q=>q.id===id);if(i<0)return;if(s.activeSectQuests.length>=3)return alert('最多同時接受3個宗門任務');let q=s.sectQuestOffers.splice(i,1)[0];q.accepted=true;s.activeSectQuests.push(q);log(`📜 接受${q.stars}星宗門任務【${q.title}】：${q.description}`);closeModal();render()}
function submitSectQuest(id){let i=s.activeSectQuests.findIndex(q=>q.id===id),q=s.activeSectQuests[i];if(!q||q.progress<q.count)return;s.sectRep+=q.rewardRep;s.stones+=q.rewardStones;s.good+=Math.max(1,q.stars);s.activeSectQuests.splice(i,1);addExp(q.rewardExp,'宗門任務');log(`🏯 提交${q.stars}星任務成功：聲望 +${q.rewardRep}、靈石 +${q.rewardStones}。`);s.sectQuestOffers=[];closeModal();render()}
const SECT_RANK_REQ=[{from:'記名弟子',to:'外門弟子',power:15,realm:'築基5層',rep:30},{from:'外門弟子',to:'內門弟子',power:33,realm:'元嬰3層',rep:80},{from:'內門弟子',to:'親傳弟子',power:57,realm:'煉虛7層',rep:160},{from:'親傳弟子',to:'長老',power:71,realm:'大乘1層',rep:300}];
function joinSect(i){if(s.sect)return;let x=s.sects[i],fee=x.power>80?1200:650;if(s.stones<fee)return log(`💰 ${x.name} 要求繳納 ${fee} 靈石。`),render();if(Math.random()>.72+realmPower(s.realm)/220)return log(`⚔️ ${x.name} 入門比試失敗。`),render();s.stones-=fee;s.sect=x.name;s.sectRank='記名弟子';s.sectRep=5;s.sectQuestOffers=[];log(`🏯 加入【${x.name}】，先從記名弟子做起。`);render()}
function sectPromote(){if(!s.sect||s.sectRank==='宗主')return;let r=SECT_RANK_REQ.find(x=>x.from===s.sectRank);if(!r)return log('🏯 目前已無更高一般弟子階級可申請。'),render();if(realmPower(s.realm)<r.power)return log(`⚠️ 晉升${r.to}需要至少【${r.realm}】。`),render();if(s.sectRep<r.rep)return log(`⚠️ 晉升${r.to}需要宗門聲望 ${r.rep}。`),render();s.sectRank=r.to;log(`⬆️ 通過宗門考核，晉升為【${r.to}】！`);render()}
function leaveSect(){if(!s.sect)return;showModal(`<h2>🚪 退出宗門</h2><div class="dialogue">確定要退出【${s.sect}】嗎？退出後目前宗門聲望與未完成宗門任務都會清除。</div><button class="red" onclick="confirmLeaveSect()">確認退出</button> <button onclick="closeModal()">取消</button>`)}
function confirmLeaveSect(){let old=s.sect;s.sect=null;s.sectRank=null;s.sectRep=0;s.activeSectQuests=[];s.sectQuestOffers=[];log(`🚪 你正式退出【${old}】。`);closeModal();render()}
function sect(c){let req=s.sectRank&&!['宗主','長老'].includes(s.sectRank)?SECT_RANK_REQ.find(x=>x.from===s.sectRank):null,mine=s.sect?`<div class="card"><b>${s.sect}</b><br>身份：${s.sectRank}<br>宗門聲望：${s.sectRep}${req?`<br>下一階：${req.to}（${req.realm}、聲望${req.rep}）`:''}<div class="choices"><button onclick="sectTask()">📜 宗門任務</button><button onclick="sectPromote()">⬆️ 申請晉升</button><button onclick="leaveSect()">🚪 退出宗門</button></div></div>`:'<div class="card">你目前是散修。加入宗門後會先成為記名弟子。</div>';c.innerHTML=`<h2>🏯 宗門系統</h2>${mine}${!s.sect?'<div class="card"><button class="primary" onclick="openCreateSectDialog()">🏗️ 創建宗門</button></div>':''}<div class="cards">${s.sects.map((x,i)=>`<div class="card"><b>${x.name}</b><br>${x.type}・${x.dyn}<br>勢力：${x.power}/100<br>${!s.sect?`<button onclick="openSectJoinDialog(${i})">與接引弟子交談</button>`:''}</div>`).join('')}</div>`}

function giftMenu(id){let n=s.npcs.find(x=>x.id===id);if(!n)return;let gifts=s.bag.map((x,i)=>({x,i})).filter(o=>o.x[1]>0&&isGiftName(o.x[0]));showModal(`<h2>🎁 贈禮給 ${n.name}</h2>${gifts.length?`<div class="cards">${gifts.map(o=>`<div class="card"><b>${o.x[0]}</b><br>持有：${o.x[1]}<br><button onclick="giveGift('${id}',${o.i})">贈送</button></div>`).join('')}</div>`:'<div class="card">你沒有任何「禮物類」物品。可至城鎮、商店或市集購買。</div>'}<button onclick="closeModal()">取消</button>`)}
function giveGift(id,bi){let n=s.npcs.find(x=>x.id===id),b=s.bag[bi];if(!n||!b||b[1]<=0||!isGiftName(b[0]))return;let gain=b[0].includes('白玉')?5:b[0].includes('花束')?4:3;b[1]--;n.aff=clamp((n.aff||0)+gain,0,100);log(`🎁 你將【${b[0]}】送給 ${n.name}，好感 +${gain}。`);closeModal();render()}
function makeNpcHelpQuest(n){let type=pick(['donate','kill','heal']),q={type,accepted:false,completed:false,progress:0,count:1,rewardStones:rint(80,260),rewardItem:Math.random()<.4?'普通靈草':null};if(type==='donate'){q.amount=rint(120,420);q.title='籌措急用靈石';q.desc=`捐助 ${q.amount} 靈石`}else if(type==='kill'){q.place=isSafeLocation()?pick(Object.keys(placeInfo).filter(p=>placeInfo[p].王朝===placeInfo[s.place]?.王朝&&!isSafeLocation(p))):s.place;q.title='清除附近威脅';q.desc=`前往【${q.place}】擊敗1隻妖物`;q.target='妖物'}else{q.item='［初階］低級生命藥水';q.title='救治傷勢';q.desc=`交付 ${q.item} ×1`}return q}
function showNpcHelpQuest(id){let n=s.npcs.find(x=>x.id===id);if(!n)return;if(!n.helpQuest||n.helpQuest.completed)n.helpQuest=makeNpcHelpQuest(n);let q=n.helpQuest;showModal(`<h2>🤝 ${n.name} 的請求</h2><div class="dialogue">「若你願意幫我這個忙，我一定記得這份人情。」</div><div class="card"><b>${q.title}</b><br>${q.desc}<br>獎勵：好感 +1顆心、靈石 +${q.rewardStones}${q.rewardItem?`、${q.rewardItem}×1`:''}<br>${q.accepted?`進度：${q.progress}/${q.count}`:''}</div><div class="choices">${!q.accepted?`<button onclick="acceptNpcHelpQuest('${id}')">接受請求</button>`:`<button onclick="completeNpcHelpQuest('${id}')">完成/提交</button>`}<button onclick="openNPCDialogue('${id}')">返回</button></div>`)}
function acceptNpcHelpQuest(id){let n=s.npcs.find(x=>x.id===id),q=n?.helpQuest;if(!q)return;q.accepted=true;if(q.type!=='kill')q.progress=0;log(`🤝 接受 ${n.name} 的請求：【${q.title}】${q.desc}`);showNpcHelpQuest(id)}
function completeNpcHelpQuest(id){let n=s.npcs.find(x=>x.id===id),q=n?.helpQuest;if(!q||!q.accepted)return;if(q.type==='donate'){if(s.stones<q.amount)return alert('靈石不足');s.stones-=q.amount;q.progress=1}else if(q.type==='heal'){let b=s.bag.find(x=>x[0]===q.item&&x[1]>0);if(!b)return alert('缺少救治所需藥水');b[1]--;q.progress=1}else if(q.type==='kill'&&q.progress<q.count)return alert('任務尚未完成');q.completed=true;n.aff=clamp((n.aff||0)+10,0,100);s.good+=3;s.stones+=q.rewardStones;if(q.rewardItem)addBag(q.rewardItem,1,'NPC答謝');log(`💗 完成 ${n.name} 的請求，好感 +1顆心，並獲得獎勵。`);closeModal();render()}
function npc(c){ensureNearbyNPCs();let near=s.npcs.filter(n=>n.alive&&n.place===s.place).slice(0,2);c.innerHTML=`<h2>🌸 當前場所人物</h2><p class="sub">只會顯示目前實際位於【${s.place}】附近的一至兩名NPC。</p>${near.length?`<div class="cards">${near.map(n=>{let hearts=heartCount(n.aff),opp=romanceAllowed(n);return `<div class="card"><b>${n.gender==='女'?'🌸':'🗡️'} ${n.name}</b><br>性別：${n.gender}<br>${n.realm}・${n.sect}<br>${n.age}歲・${n.personality}<br>💥 戰力值：${Math.floor(realmPower(n.realm)*115+n.talent*7)}<br>好感：<span class="red">${heartBar(n.aff)}</span>（${hearts}/10）<br>${n.romance?'💞 戀愛關係<br>':''}${n.married?'💍 已婚':''}<div class="choices"><button onclick="openNPCDialogue('${n.id}')">💬 交談</button><button onclick="giftMenu('${n.id}')">🎁 贈禮</button><button onclick="showNpcHelpQuest('${n.id}')">🤝 幫助</button><button onclick="npcAct('${n.id}','attack')">⚔️ 攻擊</button><button onclick="npcAct('${n.id}','rob')">💰 搶奪</button>${opp&&!n.romance&&!n.married&&hearts>=7?`<button onclick="confessNPC('${n.id}')">💗 告白</button>`:''}${opp&&n.romance&&!n.married&&hearts>=9?`<button onclick="marryNPC('${n.id}')">💍 求婚</button>`:''}</div></div>`}).join('')}</div>`:'<div class="card">此刻附近沒有可互動的修士。</div>'}<h3>👨‍👩‍👧 家族</h3><div class="card">伴侶：${s.spouse||'無'}<br>子女：${s.children.length?s.children.join('、'):'無'}</div>`}
function openNPCDialogue(id){let n=s.npcs.find(x=>x.id===id);if(!n||!n.alive||n.place!==s.place)return;let q=n.helpQuest&&n.helpQuest.accepted&&!n.helpQuest.completed?`<div class="questbox">🤝 進行中的請求：${n.helpQuest.title}・${n.helpQuest.desc}</div>`:'';showModal(`<h2>💬 與 ${n.name} 交談</h2><div class="dialogue">${npcGreeting(n)}</div>${q}<div class="choices"><button onclick="npcDialogueChoice('${id}','greet')">1. 向前打招呼</button><button onclick="showNpcHelpQuest('${id}')">2. 你需要幫助嗎？</button><button onclick="npcDialogueChoice('${id}','asksect')">3. 詢問宗門與附近消息</button><button onclick="npcDialogueChoice('${id}','askself')">4. 聊聊近況</button><button onclick="closeModal()">5. 告辭</button></div>`)}
function npcDialogueChoice(id,ch){let n=s.npcs.find(x=>x.id===id);if(!n)return;advance(1);let speech='',gain=0;if(ch==='greet'){gain=Math.random()<.25?1:0;speech=n.personality==='冷淡'?'「嗯。有事直說。」':'「道友有禮。」'}else if(ch==='asksect'){gain=Math.random()<.15?1:0;speech=n.sect==='散修'?'「散修行路難，若有合適宗門，也可以去看看。」':`「我出身${n.sect}，最近宗門正在招募能辦事的弟子。」`}else{gain=Math.random()<.18?1:0;speech=`「我最近都在${s.place}附近活動，九州的風聲可不太平。」`}if(s.evil>s.good+20)gain=0;n.aff=clamp((n.aff||0)+gain,0,100);updateQuestProgress('talk','NPC',1);let item='';if(Math.random()<.05){let it=pick(['普通靈草','靈露','🎁 清心香囊']);if(it.startsWith('🎁'))addBag(it,1,'🎁 NPC交談時贈予的禮物');else s.materials[it]=(s.materials[it]||0)+1;item=`<br><span class="gold">🎁 對方順手送你：${it}</span>`;log(`🎁 與 ${n.name} 聊天時意外得到 ${it}。`)}showModal(`<h2>💬 ${n.name}</h2><div class="dialogue">${speech}</div><p>好感：<span class="red">${heartBar(n.aff)}</span>${gain?` <span class="green">+${gain}</span>`:''}${item}</p><div class="choices"><button onclick="openNPCDialogue('${id}')">繼續交談</button><button onclick="closeModal();render()">結束對話</button></div>`)}
function confessNPC(id){let n=s.npcs.find(x=>x.id===id);if(!n||!romanceAllowed(n)||heartCount(n.aff)<7||n.married)return;let chance=.62+Math.max(0,s.good-s.evil)/1000;if(Math.random()<chance){n.romance=true;s.relationships[n.id]='戀愛';log(`💗 你向 ${n.name} 告白，對方接受了你的心意。`)}else{n.aff=Math.max(0,n.aff-4);log(`💔 ${n.name} 暫時沒有接受你的告白。`)}render()}
function marryNPC(id){let n=s.npcs.find(x=>x.id===id);if(!n||!romanceAllowed(n)||!n.romance||heartCount(n.aff)<9||n.married)return;let ring=s.bag.find(x=>x[0]==='母親的姻緣戒指'&&x[1]>0);if(!ring)return log('💍 你缺少母親的姻緣戒指，暫時無法完成婚約。'),render();if(s.spouse)return log('💍 你已經有伴侶。'),render();ring[1]--;n.married=true;n.partner='PLAYER';s.spouse=n.name;s.relationships[n.id]='配偶';log(`💍 你將母親的姻緣戒指交給 ${n.name}，兩人正式結為道侶。`);render()}
function npcAct(id,a){let n=s.npcs.find(x=>x.id===id);if(!n||!n.alive||n.place!==s.place)return;if(a==='gift')return giftMenu(id);if(a==='help')return showNpcHelpQuest(id);if(a==='love')return confessNPC(id);if(a==='marry')return marryNPC(id);if(a==='attack'){s.evil+=12;n.aff=Math.max(0,n.aff-30);log(`⚔️ 你惡意向 ${n.name} 出手，惡值 +12。`);makeEnemy({name:n.name,tier:'人類',category:'人類',danger:Math.max(1,Math.ceil(realmPower(n.realm)/10)),realm:n.realm,skill:'修士功法',look:`${n.realm}修士`});return}if(a==='rob'){s.evil+=18;let g=Math.min(n.wealth||0,rint(20,180));n.wealth=Math.max(0,(n.wealth||0)-g);s.stones+=g;n.aff=Math.max(0,n.aff-40);log(`💰 你搶奪 ${n.name} ${g} 靈石，惡值 +18。`);render()}}

function expandPetSlot(){if(s.petSlots>=10)return;let cost=Math.floor(500*Math.pow(1.65,s.petSlotPurchases));if(s.stones<cost)return log(`💰 擴充需要 ${cost} 靈石。`),render();s.stones-=cost;s.petSlots++;s.petSlotPurchases++;log(`🐾 寵物欄擴充至 ${s.petSlots} 格，花費 ${cost} 靈石。`);render()}

window.addEventListener('load',()=>{setTimeout(()=>{let h=document.querySelector('#start h1');if(h)h.textContent=`九州修仙錄 ${V06_LABEL}`;document.title=`九州修仙錄 ${V06_LABEL}`;if(s){ensureV06State();render()}},0)});

</script></body></html>
