<style id="r5-style">
#r5Prologue{min-height:500px;position:relative;overflow:hidden;border-radius:14px;background:#040910}
#r5Prologue .sky{position:absolute;inset:-8%;background:
 radial-gradient(circle at 72% 24%,rgba(169,197,255,.14),transparent 22%),
 radial-gradient(circle at 32% 76%,rgba(185,63,61,.22),transparent 30%),
 linear-gradient(180deg,#050814,#111a2a 55%,#23130f);animation:r5sky 15s ease-in-out infinite alternate}
#r5Prologue .cloud{position:absolute;width:65%;height:22%;border-radius:50%;filter:blur(22px);background:rgba(155,170,190,.09);animation:r5cloud 16s linear infinite}
#r5Prologue .cloud.c1{left:-20%;top:20%}#r5Prologue .cloud.c2{right:-25%;top:55%;animation-duration:21s;animation-direction:reverse}
#r5Prologue .mount{position:absolute;left:-5%;right:-5%;bottom:-3%;height:42%;background:linear-gradient(160deg,transparent 0 20%,#0a0f17 21% 35%,transparent 36%),linear-gradient(25deg,transparent 0 32%,#080c12 33% 54%,transparent 55%),linear-gradient(145deg,transparent 0 45%,#0d1219 46% 66%,transparent 67%);opacity:.9}
#r5Prologue .seal{position:absolute;left:50%;top:42%;width:220px;height:220px;transform:translate(-50%,-50%) scale(.75);border:1px solid rgba(221,187,100,.35);border-radius:50%;box-shadow:0 0 35px rgba(222,183,75,.18),inset 0 0 30px rgba(222,183,75,.12);opacity:0;transition:all 1.2s}
#r5Prologue .seal:before,#r5Prologue .seal:after{content:"";position:absolute;inset:24px;border:1px dashed rgba(222,183,75,.3);border-radius:50%;animation:r5spin 12s linear infinite}
#r5Prologue .seal:after{inset:54px;animation-direction:reverse;animation-duration:8s}
#r5Prologue .flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}
#r5Prologue .titlefx{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);font-size:46px;font-weight:900;letter-spacing:.22em;color:#f1d58b;text-shadow:0 0 24px rgba(244,202,104,.35);opacity:0;transition:1.4s}
#r5Prologue .caption{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);width:min(780px,86%);text-align:center;font-size:20px;line-height:2;color:#eef3f8;text-shadow:0 2px 10px #000;opacity:0;transition:.9s}
#r5Prologue .caption.show{opacity:1}#r5Prologue .seal.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#r5Prologue .titlefx.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#r5Prologue .controls{position:absolute;right:18px;bottom:16px;display:flex;gap:8px;z-index:5}
#r5Prologue.scene-war .flash{animation:r5flash 2.2s ease 1}
#r5Prologue.scene-city .sky{background:radial-gradient(circle at 70% 18%,rgba(255,221,146,.28),transparent 28%),linear-gradient(180deg,#24405b,#7f6e58 60%,#302d25)}
@keyframes r5sky{from{transform:scale(1.04) translate3d(-1%,0,0)}to{transform:scale(1.11) translate3d(1.5%,-1%,0)}}
@keyframes r5cloud{from{transform:translateX(-10%)}to{transform:translateX(70%)}}
@keyframes r5spin{to{transform:rotate(360deg)}}
@keyframes r5flash{0%,30%,100%{opacity:0}35%{opacity:.7}38%{opacity:0}58%{opacity:.35}61%{opacity:0}}
@media(prefers-reduced-motion:reduce){#r5Prologue *{animation:none!important;transition:none!important}}
.info-click{cursor:pointer;text-decoration:none}
</style>

function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function nowText(){return `仙曆 ${S.year}年・第${S.day}日 ${String(S.hour).padStart(2,'0')}:00`}
function log(msg){S.log.unshift(`[${String(S.hour).padStart(2,'0')}:00] ${msg}`);S.log=S.log.slice(0,120);renderLog()}
function advance(h,{outdoor=false}={}){S.hour+=h;if(outdoor)S.outdoorHours=(S.outdoorHours||0)+h;while(S.hour>=24){S.hour-=24;S.day++;if(S.day>360){S.day=1;S.year++}}}
function regionOf(place){for(const [z,r] of Object.entries(REGIONS)){if([r.main,...r.towns,...r.wild,...r.secrets,r.danger,r.gate].includes(place))return z}return null}
function placeType(place){for(const r of Object.values(REGIONS)){if(place===r.main)return '主城';if(r.towns.includes(place))return '城鎮';if(r.wild.includes(place))return '野外';if(r.secrets.includes(place))return '秘境';if(place===r.danger)return '危險區';if(place===r.gate)return '傳送陣'}return '特殊區域'}
function rootRoll(){
 const normals=['火','水','木','風','雷','土'];
 const main=pick(normals), sub=pick(normals.filter(x=>x!==main));
 const roots={};
 ROOTS.forEach(x=>{
   if(x===main) roots[x]=rand(95,100);
   else if(x===sub) roots[x]=rand(45,50);
   else if(x==='光'||x==='暗') roots[x]=0;
   else roots[x]=1;
 });
 return {main,sub,roots};
}

function initBigMapDrag(){
 const view=document.getElementById('bigMapView'),canvas=document.getElementById('bigMapCanvas');if(!view||!canvas)return;
 let pos=S.bigMapPos||{x:-420,y:-240},drag=false,sx=0,sy=0,ox=0,oy=0;
 const clampPos=()=>{const minX=Math.min(0,view.clientWidth-canvas.offsetWidth),minY=Math.min(0,view.clientHeight-canvas.offsetHeight);pos.x=clamp(pos.x,minX,0);pos.y=clamp(pos.y,minY,0);canvas.style.transform=`translate(${pos.x}px,${pos.y}px)`;S.bigMapPos=pos};clampPos();
 view.onpointerdown=e=>{if(e.target.closest('.map-node'))return;drag=true;view.classList.add('dragging');sx=e.clientX;sy=e.clientY;ox=pos.x;oy=pos.y;view.setPointerCapture(e.pointerId)};
 view.onpointermove=e=>{if(!drag)return;pos={x:ox+e.clientX-sx,y:oy+e.clientY-sy};clampPos()};
 view.onpointerup=e=>{drag=false;view.classList.remove('dragging');try{view.releasePointerCapture(e.pointerId)}catch{}};
}

function gatherNearby(){
 if(!['野外','秘境'].includes(placeType(S.place)))return;
 const table={'青陽山':['靈草','梨草','藥草','凝露花','青紋藤'],'落星谷':['靈草','藥草','百年靈草','玉葉果'],'雷鳴沼':['靈草','藥草','靈露'],'晶礦秘境':['靈石','靈原鐵','赤銅礦','玄鐵'],'潮汐秘境':['靈露','水晶石']};

}
function encounterMonster(){
 if(placeType(S.place)!=='野外')return;
 if(S.quests.some(q=>q.id==='firstCombatEntry'&&!q.done))return startFirstCombatTutorial();
 if(S.quests.some(q=>q.id==='firstTry'&&!q.done))return doFirstTry();
 if(S.quests.some(q=>q.id==='itemUse'&&!q.done))return doItemUse();
 if(!S.flags.freeRoam)return alert('目前只能進行主線指定戰鬥。');
 const pool=EAST_MONSTERS[S.place];if(!pool)return alert('此地目前沒有已設定妖物池。');
 const total=pool.reduce((a,b)=>a+b.weight,0),roll=Math.random()*total;let cur=0,m=pool[0];for(const x of pool){cur+=x.weight;if(roll<=cur){m=x;break}}startBattle(m)
}

function startBattle(mon){
 battle={round:1,auto:S.settings.autoBattle,playerTeam:[{type:'player',name:S.name,hp:S.hp,maxhp:S.maxhp,mp:S.mp,maxmp:S.maxmp,atk:S.atk,def:S.def,agi:S.agi,hit:S.hit,status:[]}],enemyTeam:[JSON.parse(JSON.stringify(mon))],logs:[`遭遇 ${mon.name}！`]};
 showBattle()
}
function showBattle(){
 const b=battle;if(!b)return;
 const allies=b.playerTeam.map(f=>fighterHTML(f)).join(''), enemies=b.enemyTeam.map(f=>fighterHTML(f)).join('');
 showModal('⚔️ 戰鬥',`<div class="battle-team"><div><h3>我方</h3>${allies}</div><div><h3>敵方</h3>${enemies}</div></div>
 <div class="actions"><button onclick="battleAttack()">普通攻擊</button><button onclick="battleTechnique()">功法</button><button onclick="toggleAutoBattle()">${b.auto?'停止自動':'自動戰鬥'}</button><button onclick="battleRun()">逃跑</button></div>
 <div class="battle-log">${b.logs.slice(-15).map(x=>`<div>${x}</div>`).join('')}</div>`);
 if(b.auto)setTimeout(()=>{if(battle&&battle.auto)battleAttack()},450)
}
function fighterHTML(f){return `<div class="fighter ${f.hp<=0?'dead':''}"><b>${f.name}</b><br>❤️ ${Math.max(0,f.hp)}/${f.maxhp||f.hp}　🔵 ${f.mp||0}/${f.maxmp||f.mp||0}<br><span class="tiny">攻${f.atk} 防${f.def} 身${f.agi} 命${f.hit}</span>${(f.status||[]).map(x=>`<span class="status-dot">${x}</span>`).join('')}</div>`}
function calcDamage(a,d,m=1){return Math.max(1,Math.floor((a.atk*1.1-d.def*.55)*m+rand(-2,3)))}
function battleAttack(){
 const b=battle;if(!b)return;const p=b.playerTeam[0],e=b.enemyTeam.find(x=>x.hp>0);if(!e)return;
 const dmg=calcDamage(p,e);e.hp-=dmg;b.logs.push(`${p.name} 普通攻擊，對 ${e.name} 造成 ${dmg} 傷害。`);
 if(e.hp<=0){battleWin();return}
 enemyTurn();if(battle)showBattle()
}
function battleTechnique(){
 if(!battle)return;
 if(!S.techniques.length){battle.logs.push('目前尚未學會可使用的正式功法。');showBattle();return}
 battleAttack()
}
function enemyTurn(){
 const b=battle;if(!b)return;const p=b.playerTeam[0],e=b.enemyTeam.find(x=>x.hp>0);if(!e)return;
 const dmg=calcDamage(e,p,.95);p.hp-=dmg;b.logs.push(`${e.name} 攻擊，造成 ${dmg} 傷害。`);
 if(p.hp<=0){S.hp=1;S.mp=p.mp;battle=null;closeModal();log('💀 戰敗，戰鬥結束後回到1氣血。');render()}
}
function battleWin(){const b=battle,e=b.enemyTeam[0];S.hp=Math.max(1,b.playerTeam[0].hp);S.mp=b.playerTeam[0].mp;S.experience++;S.coins+=rand(8,18);battle=null;closeModal();log(`⚔️ 擊敗 ${e.name}，歷練 +1。`);render()}
function toggleAutoBattle(){battle.auto=!battle.auto;S.settings.autoBattle=battle.auto;showBattle()}
function battleRun(){if(!battle)return;const chance=clamp(50+(S.agi-battle.enemyTeam[0].agi)*2,5,95);if(Math.random()*100<chance){battle=null;closeModal();log('🏃 成功逃離戰鬥。');render()}else{battle.logs.push('逃跑失敗！');enemyTurn();if(battle)showBattle()}}

function initDrag(){

 const clampBox=()=>{const w=box.offsetWidth,h=box.offsetHeight,maxX=Math.max(0,innerWidth-w),maxY=Math.max(0,innerHeight-h);let x=parseFloat(box.style.left),y=parseFloat(box.style.top);if(Number.isNaN(x))x=Math.max(0,innerWidth-w-18);if(Number.isNaN(y))y=Math.max(0,innerHeight-h-18);x=clamp(x,0,maxX);y=clamp(y,0,maxY);box.style.left=x+'px';box.style.top=y+'px';if(S)S.logPos={x,y,w:box.offsetWidth,h:box.offsetHeight}};
 const restore=()=>{const p=S?.logPos||{};box.style.right='auto';box.style.bottom='auto';box.style.width=(p.w||360)+'px';box.style.height=(p.h||300)+'px';box.style.left=(Number.isFinite(p.x)?p.x:Math.max(0,innerWidth-(p.w||360)-18))+'px';box.style.top=(Number.isFinite(p.y)?p.y:Math.max(0,innerHeight-(p.h||300)-18))+'px';clampBox()};
 setTimeout(restore,0);
 head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;pid=e.pointerId;const r=box.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;try{head.setPointerCapture(pid)}catch{}});
 head.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pid)return;box.style.left=clamp(e.clientX-dx,0,Math.max(0,innerWidth-box.offsetWidth))+'px';box.style.top=clamp(e.clientY-dy,0,Math.max(0,innerHeight-box.offsetHeight))+'px'});
 const stop=()=>{if(!dragging)return;dragging=false;pid=null;clampBox()};head.addEventListener('pointerup',stop);head.addEventListener('pointercancel',stop);window.addEventListener('resize',clampBox);
 window.__logClamp=clampBox;window.__logPreMinHeight=()=>preMinHeight;window.__setLogPreMinHeight=v=>preMinHeight=v;
}

document.getElementById('logMin').addEventListener('click',()=>{

 if(!min){window.__setLogPreMinHeight?.(b.offsetHeight);b.classList.add('log-min');document.getElementById('logMin').textContent='□'}
 else{b.classList.remove('log-min');b.style.height=(window.__logPreMinHeight?.()||300)+'px';document.getElementById('logMin').textContent='—'}
 setTimeout(()=>window.__logClamp?.(),0)
});
document.getElementById('continueBtn').style.display=hasSave()?'inline-block':'none';
initDrag();
</script>

// ---------- gathering ----------
function r4RecoverGather(){
 if(!S)return;
 for(const [place,cfg] of Object.entries(R4_GATHER_CFG)){
  const st=S.gatherState[place]||(S.gatherState[place]={charges:cfg.max,anchor:S.effectiveMinutes||0,monsterCount:0});
  const elapsed=(S.effectiveMinutes||0)-st.anchor;
  if(elapsed>=120&&st.charges<cfg.max){
    const add=Math.min(cfg.max-st.charges,Math.floor(elapsed/120));st.charges+=add;st.anchor+=add*120;
  }
  if(st.charges>=cfg.max)st.anchor=S.effectiveMinutes||0;
 }
}
gatherNearby=function(){
 r4Ensure();const cfg=R4_GATHER_CFG[S.place];if(!cfg)return;
 r4RecoverGather();const st=S.gatherState[S.place];
 if(st.charges<=0){const remain=120-((S.effectiveMinutes||0)-st.anchor);return alert(`此地目前沒有可採集次數。約再經過 ${Math.max(1,Math.ceil(remain/60))} 小時有效時間恢復1次。`)}
 const tier2=Math.random()<cfg.tier2,pool=tier2?cfg.pool2:cfg.pool1,mat=pick(pool);st.charges--;
 S.materials[mat]=(S.materials[mat]||0)+1;r4AdvanceMinutes(r4ActionMinutes('gather'),{effective:true});
 log(`🌿 探索附近，採集到【${mat}】×1。剩餘採集 ${st.charges}/${cfg.max}。`);render()
}

 let lines=REGION_ROADS.map(([a,b])=>r4Line(...regionCenters[a],...regionCenters[b],false)).join('');
 const specials={
  '九天浮島群':[760,260],'幽冥地脈':[760,760],'仙門天域':[760,35],
  '雲岫仙島':[1420,300],'天穹浮島':[610,220],'紫霄天嶼':[930,215],'九曜懸空城':[770,330],
  '蓬玄島':[1430,650],'滄瀾島':[1470,760],'玄鯨群島':[1380,850],'歸墟仙島':[1510,900],'冤魂地界':[520,760]
 };
 // teleport links
 lines+=r4Line(1310,550,1430,650,true)+r4Line(1240,900,1380,850,true)+r4Line(760,520,760,260,true)+r4Line(760,520,760,760,true);
 const nodes=[];
 for(const [z,r] of Object.entries(REGIONS)){
  const [px,py]=regionCenters[z],subs=[r.main,...r.towns,...r.wild,...r.secrets,...(r.danger?[r.danger]:[]),r.gate].filter(Boolean);
  nodes.push(`<div class="map-node ${S.place===z?'current':''}" style="left:${px}px;top:${py}px"><b>${z}</b></div>`);
  subs.forEach((p,i)=>{const a=Math.PI*2*i/subs.length,radX=115,radY=82,x=px+Math.cos(a)*radX,y=py+Math.sin(a)*radY;nodes.push(`<div class="map-node sub ${S.place===p?'current':''}" style="left:${x}px;top:${y}px">${p}</div>`);if(i===0)lines+=r4Line(px,py,x,y,false)})
 }
 Object.entries(specials).forEach(([n,[x,y]])=>nodes.push(`<div class="map-node special ${S.place===n?'current':''}" style="left:${x}px;top:${y}px">${n}</div>`));
 setTimeout(initBigMapDrag,0);
 return `<div id="bigMapView" class="map-wrap"><div id="bigMapCanvas" class="bigmap">${lines}${nodes.join('')}</div></div><div class="map-legend"><span>━━━━ 直通道路</span><span style="color:#b08bed">┄┄┄ 傳送／特殊連通</span><span class="gold">黃框＝玩家目前所在地</span></div>`
}

   // 入門教學2完全不經NPC

function r53DialogueState(name){
  S.dialogueState=S.dialogueState||{};
  if(!S.dialogueState[name]){
    S.dialogueState[name]={used:[],charges:5,lastRecoverAt:r4GameMinutes()};
  }
  const st=S.dialogueState[name];
  if(st.charges==null)st.charges=Math.max(0,5-(st.used?.length||0));
  if(st.lastRecoverAt==null)st.lastRecoverAt=r4GameMinutes();
  const elapsed=r4GameMinutes()-st.lastRecoverAt;
  if(elapsed>=180 && st.charges<5){
    const add=Math.min(5-st.charges,Math.floor(elapsed/180));
    st.charges+=add;
    st.lastRecoverAt+=add*180;
    // 允許重新開始下一輪，仍維持句子不重複直到5句用完
    if((st.used||[]).length>=5 && st.charges>0)st.used=[];
  }
  return st;
}

function r53ConfirmCultDone(){

function r53MoveGroup(p){
  const t=placeType(p);
  if(t==='主城')return 'city';
  if(t==='城鎮')return 'town';
  if(t==='野外'||t==='秘境')return 'wild';
  return 'other';
}
function r53TravelMinutes(from,to){
  const a=r53MoveGroup(from),b=r53MoveGroup(to);
  // 縮短耗時
  if((a==='city'&&b==='town')||(a==='town'&&b==='city'))return rand(20,40);
  if((a==='town'&&b==='wild')||(a==='wild'&&b==='town'))return rand(15,30);
  if(a==='town'&&b==='town')return rand(25,45);
  return rand(20,40);
}
function r53TravelShouldCount(from,to){
  S.travelHistory=S.travelHistory||[];
  const h=S.travelHistory;
  // 直接 AB 往返：前兩次算，第三次開始不算
  if(h.length>=2){
    const last=h[h.length-1],prev=h[h.length-2];
    if(prev.from===from && prev.to===to && last.from===to && last.to===from)return false;
  }
  // city > town > wild > town > city 這類來回循環也不算最後回刷
  if(h.length>=3){
    const seq=[h[h.length-3],h[h.length-2],h[h.length-1]];
    if(seq[0].from===to && seq[0].to===seq[2].to && seq[1].to===from && seq[2].from===from && seq[2].to===seq[0].to)return false;
  }
  return true;
}
function r53RecordTravel(from,to,counted){
  S.travelHistory=S.travelHistory||[];
  S.travelHistory.push({from,to,counted,at:r4GameMinutes()});
  if(S.travelHistory.length>8)S.travelHistory.shift();
}
moveTo=function(p){

  // 新手主線路線鎖
  if(!r53ConfirmCultDone()){
    const firstBattle=S.quests.some(q=>q.id==='firstBattle'&&!q.claimed);
    const firstCombat=S.quests.some(q=>q.id==='firstCombatEntry'&&!q.claimed);
    const allowed=new Set(['朝御城']);
    if(firstBattle||firstCombat){
      allowed.add('青陽鎮');
      if(firstCombat)allowed.add('青陽山');
    }
    if(!allowed.has(p))return;
  }

  const from=S.place;
  const counted=r53TravelShouldCount(from,p);
  const mins=counted?r53TravelMinutes(from,p):0;
  if(mins>0)r4AdvanceMinutes(mins,{effective:true});
  S.place=p;
  r53RecordTravel(from,p,counted);
  log(`🧭 前往【${p}】${counted?`，耗時 ${mins} 分鐘。`:'。重複移動，不計時間。'}`);
  const q=S.quests.find(x=>x.id==='returnCity'&&!x.done);if(q&&p==='朝御城')q.done=true;
  render();
};

<script id="r5-5-overrides">
'use strict';

// =====================================================
// 地圖：主城 -> 鄰近城鎮 -> 野外；第三城鎮 -> 傳送塔 -> 秘境
// =====================================================
function r55Line(x1,y1,x2,y2,cls=''){
 const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
 return `<div class="route-edge ${cls}" style="left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${ang}deg)"></div>`
}
function r55RegionBlock(z,r,bx,by){
 const main=[bx,by], towns=(r.towns||[]).map((n,i)=>[n,bx+145,by-80+i*80]),
       wild=(r.wild||[]).map((n,i)=>[n,bx+290,by-80+i*80]);
 let nodes=`<div class="route-node main ${S.place===r.main?'current':''}" style="left:${main[0]}px;top:${main[1]}px">${r.main}<br><span class="tiny">${z}</span></div>`, lines='';
 towns.forEach(([n,x,y],i)=>{
   nodes+=`<div class="route-node town ${S.place===n?'current':''}" style="left:${x}px;top:${y}px">${n}</div>`;
   lines+=r55Line(main[0]+42,main[1],x-40,y);
   if(wild[i]){
     const [wn,wx,wy]=wild[i];
     nodes+=`<div class="route-node wild ${S.place===wn?'current':''}" style="left:${wx}px;top:${wy}px">${wn}</div>`;
     lines+=r55Line(x+40,y,wx-40,wy);
   }
 });
 const gateX=bx+430,gateY=by+100;
 if(r.gate){
   nodes+=`<div class="route-node gate ${S.place===r.gate?'current':''}" style="left:${gateX}px;top:${gateY}px">${r.gate}</div>`;
   // 依既有東州規則：第三鄰城 -> 傳送塔
   const feeder=towns[Math.min(2,towns.length-1)];
   if(feeder)lines+=r55Line(feeder[1]+40,feeder[2],gateX-52,gateY,'tele');
   (r.secrets||[]).forEach((s,i)=>{
     const sx=bx+565,sy=gateY+(i-(r.secrets.length-1)/2)*60;
     nodes+=`<div class="route-node secret ${S.place===s?'current':''}" style="left:${sx}px;top:${sy}px">${s}</div>`;
     lines+=r55Line(gateX+50,gateY,sx-45,sy,'tele');
   });
 }
 if(r.danger){
   const dx=bx-5,dy=by+105;
   nodes+=`<div class="route-node danger ${S.place===r.danger?'current':''}" style="left:${dx}px;top:${dy}px">${r.danger}</div>`;
   lines+=r55Line(main[0],main[1]+28,dx,dy-24,'danger');
 }
 return lines+nodes
}
function r55GroundMapHTML(){

  '西北州':[80,170],'北州':[650,150],'東北州':[1220,170],

 };

 Object.entries(layout).forEach(([z,[x,y]])=>body+=r55RegionBlock(z,REGIONS[z],x,y));

 // 九州外海島用虛線；蓬玄島固定在西州外海

 ];

 });
 setTimeout(()=>r54InitCenteredDrag('bigMapView','bigMapCanvas','groundMapPos55'),0);
 return `<div id="bigMapView" class="map-wrap"><div id="bigMapCanvas" class="bigmap" style="width:1950px;height:1320px">${body}</div></div>

}

// ---------- quest archive & pin ----------
function r56QuestRecord(id){
 r56Ensure();
 if(!S.questArchive[id]){
   const d=R56_QUESTS[id]||{};
   S.questArchive[id]={id,type:d.type||'主線',title:d.title||id,npc:d.npc||'',history:[],choiceLog:[],accepted:false,claimed:false};
 }
 return S.questArchive[id]
}
function r56SyncQuestArchive(q){
 const a=r56QuestRecord(q.id);a.accepted=true;a.claimed=!!q.claimed;a.done=!!q.done;a.objective=q.desc;a.reward=q.reward;a.pinned=!!q.pinned
}
function r56Pin(id){
 const q=S.quests.find(x=>x.id===id);if(!q)return;
 if(q.pinned){q.pinned=false}
 else{
   if(S.quests.filter(x=>x.pinned&&!x.claimed).length>=3)return alert('最多只能釘選三個任務。');
   q.pinned=true
 }
 r56SyncQuestArchive(q);render()
}
addQuest=function(q){
 if(S.quests.some(x=>x.id===q.id))return;
 const autoPin=S.quests.filter(x=>x.pinned&&!x.claimed).length<3;
 const obj={...q,pinned:autoPin,done:false,claimed:false};
 S.quests.push(obj);r56SyncQuestArchive(obj)
};

// ---------- tutorial 1/2 canonical ----------
function r56Tutorial1Ready(){return Object.values(S.questState.tutorial1.visited).every(Boolean)}
function r56CompleteTutorial1(){
 const q=S.quests.find(x=>x.id==='tutorial1');if(!q||!r56Tutorial1Ready()||q.claimed)return;
 q.done=true;q.claimed=true;q.pinned=false;S.questState.tutorial1.claimed=true;
 S.special['［特殊］新手大禮包']=(S.special['［特殊］新手大禮包']||0)+1;
 addQuest({id:'tutorial2',type:'主線',region:'東州',title:'入門教學２',
 desc:'打開背包介面點選［特殊］分頁，使用新手大禮包，並在裝備介面穿戴［無階］新手護符後點擊完成任務。',
 reward:'靈幣＋300、［初階］氣血藥水×2、［初階］靈力藥水×2、歷練×2。'});
 S.questState.tutorial2={specialViewed:false,giftOpened:false,amuletEquipped:false,ready:false};
 r56SyncQuestArchive(q);log('✅ ［主線］入門教學１完成，獲得新手大禮包×1。');render()
}
r5CompleteTutorial2=function(){
 const q=S.quests.find(x=>x.id==='tutorial2');if(!q?.done||q.claimed)return;
 q.claimed=true;q.pinned=false;S.coins+=300;
 S.items['［初階］氣血藥水']=(S.items['［初階］氣血藥水']||0)+2;
 S.items['［初階］靈力藥水']=(S.items['［初階］靈力藥水']||0)+2;
 S.experience+=2;S.flags.peopleUnlocked=true;S.flags.questUiUnlocked=true;
 r56SyncQuestArchive(q);currentPage='people';
 log('✅ ［主線］入門教學２完成。任務介面已開啟。');render()
};

renderQuests=function(){
 r56Ensure();
 const qs=S.quests.filter(q=>q.pinned&&!q.claimed).slice(0,3);
 document.getElementById('questPanel').innerHTML=qs.length?qs.map(q=>{
  let extra='';
  if(q.id==='tutorial1'){
    const v=S.questState.tutorial1.visited;
    extra=['adventure','bag','training','roots','tech'].map(k=>`<div class="quest-step ${v[k]?'done':''}">${v[k]?'✅':'⬜'} ${{adventure:'冒險',bag:'背包',training:'修煉',roots:'靈根',tech:'功法'}[k]}</div>`).join('');
    if(r56Tutorial1Ready()&&!q.claimed)extra+=`<button class="primary" onclick="r56CompleteTutorial1()">完成任務</button>`;
  }
  if(q.id==='tutorial2'){
    const t=S.questState.tutorial2||{};
    extra=`<div class="quest-step ${t.specialViewed?'done':''}">${t.specialViewed?'✅':'⬜'} 點選［特殊］分頁</div>
    <div class="quest-step ${t.giftOpened?'done':''}">${t.giftOpened?'✅':'⬜'} 使用新手大禮包</div>
    <div class="quest-step ${t.amuletEquipped?'done':''}">${t.amuletEquipped?'✅':'⬜'} 穿戴［無階］新手護符</div>`;
    if(q.done&&!q.claimed)extra+=`<button class="primary" onclick="r5CompleteTutorial2()">完成任務</button>`;
  }
  if(q.id==='tour'){
    const v=S.questState?.tour?.visited||{};
    extra=[['board','布告欄'],['alchemy','煉金爐'],['forge','鑄造台'],['tea','茶館'],['clinic','醫館'],['jail','監牢']]
    .map(([k,n])=>`<div class="quest-step ${v[k]?'done':''}">${v[k]?'✅':'⬜'} ${n}</div>`).join('')
  }
  return `<div class="quest"><b>📜 ${q.type}・${q.title}</b><br><span class="small">${q.desc}</span>${extra}<div class="reward">任務回報：${q.reward}</div></div>`
 }).join(''):'<div class="muted small">目前沒有釘選任務。</div>'
};

navAllowed=function(k){
 r56Ensure();
 if(k==='quests')return !!S.flags.questUiUnlocked;
 if(['adventure','bag','training','roots','tech'].includes(k))return true;
 if(k==='people')return !!S.flags.peopleUnlocked;
 if(k==='map')return !!S.flags.mapUnlocked||!!S.flags.freeRoam;
 if(k==='partners')return !!S.flags.partnersUnlocked;
 if(k==='pets')return !!S.flags.petsUnlocked;
 if(k==='world')return !!S.flags.freeRoam;
 return true
};
renderNav=function(){
 const list=[...NAV];
 if(!list.some(x=>x[0]==='quests'))list.splice(6,0,['quests','📜 任務']);
 document.getElementById('nav').innerHTML=list.filter(([k])=>navAllowed(k)).map(([k,n])=>`<button class="${currentPage===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('')
};

 let selected=S.questSelection&&all.some(q=>q.id===S.questSelection)?S.questSelection:all[0].id;S.questSelection=selected;
 const left=all.map(q=>`<button class="quest-list-btn ${selected===q.id?'active':''}" onclick="S.questSelection='${q.id}';renderPage()">

 <div class="quest-mini-status">${q.claimed?'已完成':q.done?'可回報':'進行中'}${q.pinned?'・已釘選':''}</div></button>`).join('');
 const q=all.find(x=>x.id===selected),a=r56QuestRecord(q.id),d=R56_QUESTS[q.id];
 const history=(a.history||[]).map(h=>`<div class="${h.k}">${h.speaker?`<b>${h.speaker}：</b>`:''}${h.text}</div>`).join('')||'<div class="muted">目前沒有任務交談紀錄。</div>';
 const detail=`<h2>［${q.type}］${q.title}</h2>
 <button class="pin-btn ${q.pinned?'on':''}" onclick="r56Pin('${q.id}')">${q.pinned?'📌 取消釘選':'📌 釘選任務'}</button>
 <h3>任務交談／回覆／選擇</h3><div class="quest-history">${history}</div>

// ---------- Travel exact timing + anti-farm ----------
function r57IsGate(p){return /傳送塔$/.test(p)}
function r57IsSecretOrIsland(p){
 const t=placeType(p);return t==='秘境'||['蓬玄島','滄瀾島','玄鯨群島','歸墟仙島','雲岫仙島','天穹浮島','九天浮島群','紫霄天嶼','九曜懸空城','問道檯','萬獸檯'].includes(p)
}
function r57TravelBase(from,to){
 if((r57IsGate(from)&&r57IsSecretOrIsland(to))||(r57IsGate(to)&&r57IsSecretOrIsland(from)))return 5; // 傳送
 if(r57IsGate(from)||r57IsGate(to))return 20; // 某處 <-> 傳送塔
 const a=placeType(from),b=placeType(to);
 if((a==='主城'&&b==='城鎮')||(a==='城鎮'&&b==='主城'))return 10;
 if((a==='城鎮'&&(b==='野外'||b==='秘境'))||((a==='野外'||a==='秘境')&&b==='城鎮'))return 15;
 return 10
}
function r57TravelMinutes(from,to){
 S.travelAntiFarm=S.travelAntiFarm||{count:0,lastTravelAt:null};
 const af=S.travelAntiFarm,now=r4GameMinutes();
 // 只要中間有任何非移動行為使遊戲時間前進，重置連續移動次數。
 if(af.lastTravelAt!=null && now>af.lastTravelAt)af.count=0;
 af.count++;
 const mins=af.count<=2?r57TravelBase(from,to):0;
 return mins
}
function r57MarkTravelEnd(){S.travelAntiFarm.lastTravelAt=r4GameMinutes()}
function r57PreConfirmRoads(){
 const active=S.quests.filter(q=>q.type==='主線'&&!q.claimed).map(q=>q.id);
 const roamEarly=active.some(id=>['firstBattle','firstCombatEntry','techQuest','firstTry','itemUse','breakthrough','returnCity'].includes(id));

  '青陽鎮':['朝御城','青陽山'],
  '青陽山':['青陽鎮']

}

 };

function r58RecoverTrainingCharges(){
 r58Ensure();
 for(const key of ['ground','meditation']){
   const st=S.trainingSystem[key];
   if(st.charges>=st.max){st.anchor=S.effectiveMinutes||0;continue}
   const elapsed=(S.effectiveMinutes||0)-st.anchor;
   if(elapsed>=360){
     const add=Math.min(st.max-st.charges,Math.floor(elapsed/360));
     st.charges+=add;st.anchor+=add*360
   }
 }
}
function r58TrainingGain(base){
 let gain=base;
 if(S.teaNextTrainingPct>0){gain=Math.ceil(base*(1+S.teaNextTrainingPct));S.teaNextTrainingPct=0}
 return gain
}

function r58GatherInit(place){
 const cfg=R4_GATHER_CFG[place];if(!cfg)return null;
 const st=S.gatherState[place]||(S.gatherState[place]={charges:cfg.max,zeroAt:null});
 if(st.charges==null)st.charges=cfg.max;
 return st
}
r4RecoverGather=function(){
 if(!S?.gatherState)return;
 const now=r4GameMinutes();
 for(const [place,cfg] of Object.entries(R4_GATHER_CFG)){
   const st=r58GatherInit(place);if(!st)continue;
   if(st.charges>0){st.zeroAt=null;continue} // 只要保留1次就不恢復
   if(S.place===place){if(st.zeroAt==null)st.zeroAt=now;continue}
   if(st.zeroAt==null)st.zeroAt=now;
   const elapsed=now-st.zeroAt;
   if(elapsed>=90){
     const add=Math.min(cfg.max,Math.floor(elapsed/90));
     st.charges=Math.min(cfg.max,st.charges+add);
     st.zeroAt+=add*90;
     if(st.charges>=cfg.max)st.zeroAt=null
   }
 }
};
gatherNearby=function(){
 if(!r57ConfirmDone())return;
 const cfg=R4_GATHER_CFG[S.place];if(!cfg)return;
 const st=r58GatherInit(S.place);r4RecoverGather();
 if(st.charges<=0)return alert('此地採集次數已用完。離開該區域後，每1.5小時恢復1次。');
 const tier2=Math.random()<cfg.tier2,pool=tier2?cfg.pool2:cfg.pool1,mat=pick(pool);
 st.charges--;if(st.charges===0)st.zeroAt=r4GameMinutes();
 S.materials[mat]=(S.materials[mat]||0)+1;
 r4AdvanceMinutes(r4ActionMinutes('gather'),{effective:true});
 log(`🌿 採集到【${mat}】×1。剩餘採集 ${st.charges}/${cfg.max}。${st.charges===0?'已清空；離開區域後開始恢復。':''}`);render()

// 5. 個人煉金爐／鑄造台：獨立能量＋1格特殊輔助槽
// 公共設備不消耗個人能量。
// =====================================================
function r510CraftEnsure(){
 S.personalCraft=S.personalCraft||{
   alchemy:{energy:100,max:100,lastAt:r4GameMinutes(),aux:null},
   forge:{energy:100,max:100,lastAt:r4GameMinutes(),aux:null}
 };
 for(const k of ['alchemy','forge']){
   const x=S.personalCraft[k];if(x.energy==null)x.energy=100;if(x.max==null)x.max=100;if(x.lastAt==null)x.lastAt=r4GameMinutes()
 }
}
function r510RecoverEnergy(){
 r510CraftEnsure();const now=r4GameMinutes();
 for(const k of ['alchemy','forge']){
   const x=S.personalCraft[k];
   if(x.energy>=x.max){x.lastAt=now;continue}
   const steps=Math.floor((now-x.lastAt)/120);
   if(steps>0){x.energy=Math.min(x.max,x.energy+steps*10);x.lastAt+=steps*120}
 }
}
const _r4AdvanceMinutesR510=r4AdvanceMinutes;
r4AdvanceMinutes=function(mins,opt={}){
 _r4AdvanceMinutesR510(mins,opt);r510RecoverEnergy()
};
function r510EnergyHTML(kind,label){
 r510RecoverEnergy();const x=S.personalCraft[kind],pct=Math.round(x.energy/x.max*100);
 return `<div class="energy-card"><b>${label}</b><br>${x.energy}/${x.max}
  <div class="energy-bar"><i style="width:${pct}%"></i></div>
  <div class="small muted">每次個人製作消耗10；每2遊戲小時恢復10；上限100。</div>
  <div class="aux-slot-box"><b>特殊輔助槽 ×1</b><br>${x.aux||'未放置輔助材料'}<br><span class="tiny muted">正式具名輔助材料與效果尚未定案，因此本版不自行編造效果。</span></div>
 </div>`
}
function r510RecipeRows(cat,mode){
 return (RECIPES[cat]||[]).map(x=>`<div class="craft-recipe"><b>${x[0]}</b><br>${x[1]}<br><span class="muted">${x[2]||''}</span><br>
 <button ${r59HasIngredients(x[1])?'':'disabled'} onclick="r510Craft('${x[0].replaceAll("'","\\'")}','${x[1].replaceAll("'","\\'")}','${cat}','${mode}')">製作</button></div>`).join('')
}
function r510Craft(name,req,cat,mode){
 if(!r59HasIngredients(req))return alert('材料不足。');
 if(mode==='personalAlchemy'||mode==='personalForge'){
   r510CraftEnsure();const kind=mode==='personalAlchemy'?'alchemy':'forge',x=S.personalCraft[kind];
   r510RecoverEnergy();if(x.energy<10)return alert('能量不足。');
   x.energy-=10
 }
 r59CraftItem(name,req,cat);
 if(mode==='personalAlchemy'||mode==='personalForge'){
   const kind=mode==='personalAlchemy'?'alchemy':'forge';
   log(`⚡ 個人製作消耗10點${kind==='alchemy'?'煉丹':'煉器'}能量，目前 ${S.personalCraft[kind].energy}/100。`)
 }
 render()
}

function r512RecoverCraft(){r512Ensure();const now=r4GameMinutes(),a=S.craftMastery.alchemy,f=S.craftMastery.forge;let steps=Math.floor((now-a.lastAt)/480);if(steps>0){a.heat=Math.max(0,a.heat-steps*10);a.lastAt+=steps*480}steps=Math.floor((now-f.lastAt)/480);if(steps>0){f.aura=Math.min(100,f.aura+steps*10);f.lastAt+=steps*480}}
const _r512Advance=r4AdvanceMinutes;r4AdvanceMinutes=function(mins,opt={}){_r512Advance(mins,opt);if(S)r512RecoverCraft()};
function r512Tier(name){for(const t of ['初階','中階','高階','仙階','天階'])if(name.includes('［'+t+'］'))return t;return '初階'}
function r512AuxBonus(kind,key){const a=S.craftMastery[kind]?.aux;return a&&typeof a==='object'?(+a[key]||0):0}

function r512RollQuality(kind){const lv=S.craftMastery[kind].level,tab=R512_QUALITY[lv],roll=Math.random()*100;let sum=0,q='普通';for(const [k,v] of Object.entries(tab)){sum+=v;if(roll<sum){q=k;break}}const boost=r512AuxBonus(kind,'qualityBonus');if(boost>0&&Math.random()*100<boost){const order=['普通','優良','精品','珍稀','極品','完美'],i=order.indexOf(q);q=order[Math.min(order.length-1,i+1)]}return q}

function r512CoreAdd(kind,amount){const x=S.craftMastery[kind],threshold=[100,200,300,400,500][x.level-1];x.core+=amount;if(x.level<5&&x.core>=threshold){x.level++;x.core=0;log(`✨ ${kind==='alchemy'?'煉金爐':'鑄造台'}提升至${x.level}等：${R512_CRAFT_NAMES[kind][x.level-1]}。`)}else if(x.level===5)x.core=Math.min(500,x.core)}

function r512PlayerCraft(name,req,cat,mode){const kind=mode==='personalAlchemy'?'alchemy':'forge';r512Ensure();r512RecoverCraft();const x=S.craftMastery[kind],miss=r512Missing(req);if(miss)return alert('材料不足：'+miss);let costCore=10,costResource=20;if(kind==='alchemy'&&cat==='藥品'){costCore=1;costResource=2;if(x.heat+costResource>100)return alert('爐熱量將超過100，請等待降溫或使用降溫道具。');x.heat+=costResource}else if(kind==='alchemy'){if(x.heat+20>100)return alert('爐熱量將超過100，請等待降溫或使用降溫道具。');x.heat+=20}else{if(x.aura<20)return alert('鑄造靈氣不足20，無法繼續操作鑄造台。');x.aura-=20}r512CoreAdd(kind,costCore);const rate=r512Success(kind,name);if(Math.random()*100>=rate){log(`⚠️ ${name}製作失敗（成功率${rate}%）。核心流程已累積，主要材料未扣除。`);render();return}r59CraftItem(name,req,cat);const q=r512RollQuality(kind);r512RecordQuality(name,q);log(`✨ 製作成功：${name}－${q}×1（成功率${rate}%）。`);render()}

r510Profession=function(name){if(name==='林熙')return showModal('⚗️ 林熙・煉金師',`<div class="actions"><button onclick="r511PublicAlchemy('調製')">使用城鎮公共煉金爐</button><button class="primary" onclick="r512NpcCraftMenu('林熙')">委託林熙代製</button></div>`);if(name==='林旺')return showModal('⚒️ 林旺・鑄造師',`<div class="actions"><button onclick="r511PublicForge('煉器')">使用城鎮公共鑄造台</button><button class="primary" onclick="r512NpcCraftMenu('林旺')">委託林旺代製</button></div>`);if(name==='黃蕭')return r58TowerTransfer();const p=R510_NPCS[name]||{};if(p.trade)return r510Trade(name);showModal('🧰 '+name,'<div class="card">目前沒有額外職業介面。</div>')};r58Profession=r510Profession;

function r512FormationEnsure(){r512Ensure();const valid=new Set(r512TeamMembers().map(x=>x.id));for(const k of ['front1','front2','back1','back2'])if(S.formation[k]&&!valid.has(S.formation[k]))S.formation[k]=null;if(!Object.values(S.formation).includes('player'))S.formation.front1='player'}
function r512MoveFormation(slot){r512FormationEnsure();if(!S.formationPick){S.formationPick=slot;renderPage();return}const a=S.formationPick,b=slot,tmp=S.formation[a];S.formation[a]=S.formation[b];S.formation[b]=tmp;S.formationPick=null;r4ScheduleAutoSave();renderPage()}
function renderTeam(){r512FormationEnsure();const m=Object.fromEntries(r512TeamMembers().map(x=>[x.id,x]));const card=(slot,label,row)=>{const id=S.formation[slot],u=id?m[id]:null;return `<div class="team-slot ${row} ${S.formationPick===slot?'selected':''}" onclick="r512MoveFormation('${slot}')">${u?`<img src="${u.img}"><b>${label}</b><br>${u.name}<br><span class="muted">點兩個位置可交換</span>`:`<b>${label}</b><br><span class="muted">空位・點選後與另一格交換</span>`}</div>`};return pageHead('🛡️ 隊伍','我方戰鬥站位固定讀取此編成。')+`<div class="team-grid">${card('back1','後排1','back')}${card('back2','後排2','back')}${card('front1','前排1','front')}${card('front2','前排2','front')}</div><div class="formation-note">前排受到傷害的機率為60%；後排受到傷害的機率為40%。若被選中的排已無存活單位，攻擊會轉向另一排。</div>`}

function r512FighterPortrait(f){if(f.type==='player'||f.name===S.name)return r512Portrait('player');const n=(f.name||'').replace(/^【[^】]+】/,'');return r512Portrait('npc',n)}
function r512CombatCard(f,label,row,enemy=false){const hp=Math.max(0,f.hp||0),max=f.maxhp||Math.max(1,hp),mp=Math.max(0,f.mp||0),mmax=f.maxmp||0,img=!enemy?r512FighterPortrait(f):'',dead=hp<=0;return `<div class="combat-card ${row} ${dead?'dead':''}">${img?`<img src="${img}">`:`<span class="enemy-art-symbol">${/狼/.test(f.name)?'🐺':/蛇|蛟/.test(f.name)?'🐍':/鳥|雀|蝶/.test(f.name)?'🪽':/蛛|蟲/.test(f.name)?'🕷️':'👾'}</span>`}<div class="combat-data"><span class="small muted">${label}</span><div class="combat-name">${f.name}</div><div>❤️ ${hp}/${max}</div><div class="mini-bar"><i style="width:${Math.max(0,Math.min(100,hp/max*100))}%"></i></div>${mmax?`<div>🔵 ${mp}/${mmax}</div><div class="mini-bar mp"><i style="width:${Math.max(0,Math.min(100,mp/mmax*100))}%"></i></div>`:''}<div class="small">攻${f.atk??'—'} 防${f.def??'—'} 身${f.agi??'—'} 命${f.hit??'—'}</div></div></div>`}
function r512PlayerFormationForBattle(b){r512FormationEnsure();const byName=new Map(b.playerTeam.map(x=>[x.name,x]));const first=b.playerTeam[0],members={'player':first};for(const x of b.playerTeam){const n=(x.name||'').replace(/^【[^】]+】/,'');members['npc:'+n]=x}const slots={};for(const s of ['front1','front2','back1','back2'])slots[s]=members[S.formation[s]]||null;for(const x of b.playerTeam){if(Object.values(slots).includes(x))continue;const empty=['front1','front2','back1','back2'].find(s=>!slots[s]);if(empty)slots[empty]=x}return slots}
function r512EnemyFormation(b){if(!b.enemyFormation){const slots=['front1','front2','back1','back2'];b.enemyFormation={};for(const e of b.enemyTeam){const open=slots.filter(s=>!b.enemyFormation[s]),s=open[Math.floor(Math.random()*open.length)];b.enemyFormation[s]=e}}return b.enemyFormation}

function r512BossStage(b){const boss=b.enemyTeam.find(x=>/妖王|神獸|災獸/.test((x.tier||'')+(x.name||'')))||b.enemyTeam[0],hp=Math.max(0,boss.hp),max=boss.maxhp||Math.max(1,hp),mp=Math.max(0,boss.mp||0),mmax=boss.maxmp||0,isChang=/長右/.test(boss.name||''),P=r512PlayerFormationForBattle(b);const party=`<div class="formation-row">${['front1','front2'].map(s=>P[s]?r512CombatCard(P[s],s==='front1'?'前排1':'前排2','front'): '<div class="combat-card front"><span class="muted">空位</span></div>').join('')}</div><div class="formation-row">${['back1','back2'].map(s=>P[s]?r512CombatCard(P[s],s==='back1'?'後排1':'後排2','back'): '<div class="combat-card back"><span class="muted">空位</span></div>').join('')}</div>`;return `<div class="battle-visual"><div class="battle-row-label">敵方・${boss.tier||'BOSS'}</div><div class="boss-visual">${isChang?`<img src="${R512_IMG['boss_長右']}">`:''}<div class="boss-overlay"><h2>${boss.name}</h2><div class="boss-bigbar"><i style="width:${hp/max*100}%"></i></div><b>氣血 ${hp}/${max}</b>${mmax?`<div class="boss-bigbar mp" style="margin-top:8px"><i style="width:${mp/mmax*100}%"></i></div><b>靈力 ${mp}/${mmax}</b>`:''}<div style="margin-top:10px">攻 ${boss.atk}　防 ${boss.def}　身 ${boss.agi}　命 ${boss.hit}</div></div></div><div class="battle-row-label">我方</div>${party}</div>`}
showBattle=function(){const b=battle;if(!b)return;const boss=b.enemyTeam.some(e=>/妖王|神獸|災獸/.test((e.tier||'')+(e.name||''))),stage=boss?r512BossStage(b):r512NormalStage(b);showModal(boss?'⚔️ Boss 有圖戰':'⚔️ 有圖戰',`${stage}<div class="actions"><button onclick="battleAttack()">普攻</button><button onclick="battleTechnique()">功法</button><button onclick="r58BattleBag()">背包</button><button onclick="battleRun()">逃跑</button><button onclick="toggleAutoBattle()">${b.auto?'停止自動':'自動'}</button></div><div class="battle-log">${b.logs.slice(-15).map(x=>`<div>${x}</div>`).join('')}</div>`);if(b.auto)setTimeout(()=>{if(battle&&battle.auto)r58AutoStep()},S.autoBattleConfig?.speed==='fast'?220:450)};

function v070RealmInfo(realm=S.realm){
 const m=String(realm||'').match(/^(練氣|築基|金丹|元嬰|化神|煉虛|合體|大乘)(一層|二層|三層|四層|五層|六層|七層|八層|九層|圓滿)?$/);
 const name=m?m[1]:'練氣', label=m?.[2]||'一層';
 const labels=['一層','二層','三層','四層','五層','六層','七層','八層','九層','圓滿'];
 return {name,label,idx:Math.max(0,labels.indexOf(label)),ridx:V070_REALMS.indexOf(name)};
}
function v070NeedForRealm(realm=S.realm){const r=v070RealmInfo(realm);return V070_EXP_NEEDS[r.name]?.[Math.min(8,r.idx)]||100}
function v070SyncNeed(){S.expNeed=v070NeedForRealm(S.realm)}
function v070NextRealm(realm=S.realm){
 const r=v070RealmInfo(realm), labels=['一層','二層','三層','四層','五層','六層','七層','八層','九層','圓滿'];
 if(r.label!=='圓滿') return r.name+labels[r.idx+1];
 if(r.ridx>=0 && r.ridx<V070_REALMS.length-1) return V070_REALMS[r.ridx+1]+'一層';
 return null;
}
function v070AddCultivation(n,reason=''){v070SyncNeed();S.exp=Math.min(S.expNeed,(S.exp||0)+Math.max(0,Math.floor(n)));if(reason)log(`✨ ${reason}：修為 +${Math.floor(n)}。`)}

// ---------- 歷練：100顯示 + 20隱藏 ----------
function v070EnsureExperience(){
 S.experience=Math.max(0,Math.min(100,Number(S.experience||0)));
 S.experienceHidden=Math.max(0,Math.min(20,Number(S.experienceHidden||0)));
 S.experienceCounters=S.experienceCounters||{commission:0,gather:0,wildMinutes:0,monster:{一般種:0,特殊種:0,'高位種':0,'高危種（特）':0}};
}
function v070TotalExperience(){v070EnsureExperience();return S.experience+S.experienceHidden}
function v070AddExperience(n,why=''){v070EnsureExperience();let add=Math.max(0,Math.floor(n)),room=120-v070TotalExperience(),real=Math.min(add,room),toVisible=Math.min(real,100-S.experience);S.experience+=toVisible;S.experienceHidden+=real-toVisible;if(why&&real>0)log(`📘 ${why}：歷練 +${real}。`);return real}
function v070SpendExperience(n){v070EnsureExperience();n=Math.min(v070TotalExperience(),Math.max(0,Math.floor(n/10)*10));let total=v070TotalExperience()-n;S.experience=Math.min(100,total);S.experienceHidden=Math.max(0,total-100);return n}

function v070SixCoreBonus(){
 // 先以角色目前六核相對「本境界進入時自身基準」的累積表現計算；基準存檔後固定，不因裝備臨時變動重寫。
 S.realmCoreBaseline=S.realmCoreBaseline||{};const r=v070RealmInfo().name;
 if(!S.realmCoreBaseline[r])S.realmCoreBaseline[r]={hp:S.maxhp||S.hp||1,mp:S.maxmp||S.mp||1,atk:S.atk||1,def:S.def||1,agi:S.agi||1,hit:S.hit||1};
 const b=S.realmCoreBaseline[r],ratio=(S.maxmp/b.mp)*.30+(S.hit/b.hit)*.25+(S.maxhp/b.hp)*.15+(S.def/b.def)*.15+(S.atk/b.atk)*.10+(S.agi/b.agi)*.05;
 const pct=ratio*100;if(pct<100)return 0;if(pct<110)return 2;if(pct<120)return 4;if(pct<130)return 6;if(pct<140)return 8;if(pct<150)return 10;return 12;
}
function v070PillCount(n){return (S.items?.[n]||0)+(S.special?.[n]||0)}
function v070SelectedPill(){return S.breakPill&&v070PillCount(S.breakPill)>0?S.breakPill:''}

function v070SetExpSpend(v){v070EnsureExperience();let max=Math.floor(v070TotalExperience()/10)*10;S.breakExperienceSpend=Math.max(0,Math.min(max,Math.floor(Number(v)||0)/10*10));renderPage()}
function v070SetPill(n){S.breakPill=n||'';renderPage()}
renderTraining=function(){v070SyncNeed();v070EnsureExperience();const r=v070RealmInfo(),next=v070NextRealm(),isRB=r.label==='圓滿',rate=v070SuccessRate(isRB),maxSpend=Math.floor(v070TotalExperience()/10)*10;S.breakExperienceSpend=Math.min(S.breakExperienceSpend||0,maxSpend);const pills=['［初階］破境丹','［中階］破境丹','［高階］破境丹','［仙階］破境丹'].filter(x=>v070PillCount(x)>0);return pageHead('🧘 修練','累積修為後進行突破；圓滿後可在城鎮內破境。')+`<div class="grid2"><div class="card"><b>目前境界</b><br><span class="gold">${S.realm}</span><br>修為 ${S.exp}/${S.expNeed}</div><div class="card"><b>歷練</b><br>${S.experience}/100${S.experienceHidden?` <span class="tiny muted">（另有隱藏儲備）</span>`:''}<br><span class="tiny">每投入10點＝成功率+1%</span></div></div><div class="advance-card"><b>${isRB?'破境':'突破'}</b><br>${S.realm} → ${next||'渡劫（尚未設定）'}<hr><div class="rate-breakdown">基本率 <b>${rate.base}%</b>　六核 <b>+${rate.six}%</b>　歷練 <b>+${rate.exp}%</b>　破境丹 <b>+${rate.pill}%</b><br>最終成功率：<b class="gold">${rate.total}%</b></div><div class="card"><b>投入歷練</b><br><input type="range" min="0" max="${maxSpend}" step="10" value="${S.breakExperienceSpend||0}" oninput="v070SetExpSpend(this.value)"><br>消耗 ${S.breakExperienceSpend||0} 點 → +${Math.floor((S.breakExperienceSpend||0)/10)}%</div><div class="card"><b>破境丹（一次最多1顆）</b><br><select onchange="v070SetPill(this.value)"><option value="">不使用</option>${pills.map(x=>`<option value="${x}" ${S.breakPill===x?'selected':''}>${x}（+${V070_PILL_BONUS[x]}%）×${v070PillCount(x)}</option>`).join('')}</select></div><button class="primary" ${(!next||S.exp<S.expNeed||S.fatigue>=100||(isRB&&placeType(S.place)!=='城鎮'))?'disabled':''} onclick="v070AttemptAdvance()">嘗試${isRB?'破境':'突破'}</button>${isRB&&placeType(S.place)!=='城鎮'?'<div class="card red">破境只能在城鎮內進行。野外破境會造成大量靈力外溢並引來妖物，因此系統禁止進行。</div>':''}</div>`};
function v070ConsumePill(){const p=v070SelectedPill();if(!p)return;if(S.items?.[p]>0){S.items[p]--;if(S.items[p]<=0)delete S.items[p]}else if(S.special?.[p]>0){S.special[p]--;if(S.special[p]<=0)delete S.special[p]}}
function v070ApplyAdvanceGrowth(){S.maxhp=Math.max(S.maxhp||S.hp,Math.round((S.maxhp||100)*1.08));S.maxmp=Math.max(S.maxmp||S.mp,Math.round((S.maxmp||35)*1.08));S.atk=Math.max(1,Math.round(S.atk*1.06));S.def=Math.max(1,Math.round(S.def*1.06));S.agi=Math.max(1,Math.round(S.agi*1.05));S.hit=Math.max(1,Math.round(S.hit*1.05));S.hp=S.maxhp;S.mp=S.maxmp}
function v070SetInjury(id){S.outsideStatus=S.outsideStatus||[];S.outsideStatus=S.outsideStatus.filter(x=>!['meridian_disorder','meridian_trauma'].includes(x.id));if(id==='meridian_disorder')S.outsideStatus.push({id,name:'經脈紊亂',desc:'攻、防、身、命 -5%；無法再次突破／破境。',curableByClinic:true});else S.outsideStatus.push({id,name:'經脈重創',desc:'攻、防、身、命 -10%；無法突破／破境，且無法修練。',curableByClinic:true})}

openClinic=function(){v070EnsureExperience();S.outsideStatus=S.outsideStatus||[];const cost=v070ClinicGeneralCost(),treatable=S.outsideStatus.filter(x=>v070StatusFee(x)>0),meridian=S.outsideStatus.find(x=>['meridian_disorder','meridian_trauma'].includes(x.id));showModal('🏥 醫館',`<div class="grid2"><div class="card"><b>❤️ 一般治療</b><br>氣血每恢復10點＝1靈幣；靈力每恢復5點＝1靈幣。<br>本次費用：<b>${cost}</b> 靈幣<br><button ${cost<=0?'disabled':''} onclick="v070ClinicHealGeneral()">接受治療</button></div><div class="card"><b>🛏️ 疲勞調養</b><br>每實際降低1點疲勞＝2靈幣；一次最多20點。<br>目前疲勞：${S.fatigue}/100<br><input id="v070RestFatigue" type="number" min="1" max="20" value="10" style="width:80px"><button ${S.fatigue<=0?'disabled':''} onclick="v070ClinicRest()">開始調養</button></div></div><div class="card"><b>🩺 異常狀態治療</b><br>${treatable.length?treatable.map(x=>`<div>${x.name}・剩餘${x.turns||x.remainingTurns||1}回合　<b>${v070StatusFee(x)}靈幣</b> <button onclick="v070ClinicCure('${x.id}')">治療</button></div>`).join(''):'<span class="muted">身體狀態良好，目前沒有需要醫治的常規異常。</span>'}${treatable.length>1?`<br><button onclick="v070ClinicCureAll()">全部治療</button>`:''}</div><div class="card"><b>☯️ 經脈治療</b><br>${meridian?`${meridian.name}<br>${meridian.desc}<br>治療費：<b>${v070MeridianFee(meridian)}</b> 靈幣<br><button onclick="v070ClinicCureMeridian()">療養經脈</button>`:'<span class="muted">目前沒有突破／破境造成的經脈傷勢。</span>'}</div>`)};

}

  if(id==='player') return 'player';

  }

  for(const k of ['front1','front2','back1','back2']) if(S.formation[k]===id) S.formation[k]=null;
  const otherIds=Object.values(S.formation).filter(Boolean);
  const same=otherIds.filter(x=>r518FormationKind(x)===kind).length;

r512PlayerFormationForBattle=function(b){
  r512FormationEnsure();
  const members={'player':b.playerTeam[0]};
  for(const x of b.playerTeam){
    const n=(x.name||'').replace(/^【[^】]+】/,'');
    if(x.type==='pet'){
      const idx=(S.pets||[]).findIndex(p=>(p.name||'')===n);
      if(idx>=0) members['pet:'+idx]=x;
    }else if(x.type!=='player') members['npc:'+n]=x;
  }
  const slots={};
  for(const s of ['front1','front2','back1','back2']) slots[s]=members[S.formation[s]]||null;
  for(const x of b.playerTeam){if(Object.values(slots).includes(x))continue;const empty=['front1','front2','back1','back2'].find(s=>!slots[s]);if(empty)slots[empty]=x}
  return slots;
};

<script id="r520-hostile-formula-update">
/* =====================================================
   R5.20：商人境界基礎靈幣＋搶奪境界差／身法公式正式更新
   基底：R5.19
   ===================================================== */
(function(){
'use strict';

const R520_REALMS=['練氣','築基','金丹','元嬰','化神','煉虛','合體','大乘'];
const R520_MERCHANT_BASE_COINS={
  練氣:[100,250],
  築基:[300,700],
  金丹:[900,1800],
  元嬰:[2500,5000],
  化神:[7000,14000],
  煉虛:[20000,40000],
  合體:[60000,120000],
  大乘:[180000,350000]
};

function r520RandInt(min,max){
  min=Math.ceil(min);max=Math.floor(max);
  return Math.floor(Math.random()*(max-min+1))+min;
}
function r520RealmInfo(realm){
  const s=String(realm||'');
  const major=R520_REALMS.findIndex(x=>s.includes(x));
  let minor=0;
  if(s.includes('圓滿')) minor=10;
  else {
    const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
    const m=s.match(/([一二三四五六七八九])層/);
    if(m) minor=map[m[1]]||0;
  }
  return {major,minor};
}
function r520NpcRealm(name){
  return (window.R511_NPC&&R511_NPC[name]?.realm)||(window.R510_NPCS&&R510_NPCS[name]?.realm)||(window.R58_NPCS&&R58_NPCS[name]?.realm)||'';
}
function r520MajorName(realm){
  const info=r520RealmInfo(realm);
  return info.major>=0?R520_REALMS[info.major]:'';
}
function r520MerchantBaseCoinRoll(name){
  const major=r520MajorName(r520NpcRealm(name));
  const range=R520_MERCHANT_BASE_COINS[major];
  if(!range) return 0;
  return r520RandInt(range[0],range[1]);
}

function r520StealRealmMod(playerRealm,npcRealm){
  const p=r520RealmInfo(playerRealm),n=r520RealmInfo(npcRealm);
  if(p.major<0||n.major<0) return {major:0,minor:0,total:0};
  const diff=p.major-n.major;
  let major=0,minor=0;
  if(diff>=2) major=35;
  else if(diff===1) major=20;
  else if(diff===-1) major=-25;
  else if(diff<=-2) major=-45;
  else {
    const md=(p.minor||0)-(n.minor||0);
    minor=Math.min(15,Math.floor(Math.abs(md)/3)*5)*(md<0?-1:md>0?1:0);
  }
  return {major,minor,total:major+minor};
}
function r520StealAgiMod(playerAgi,npcAgi){
  playerAgi=Number(playerAgi)||0;npcAgi=Math.max(1,Number(npcAgi)||1);
  const pct=((playerAgi-npcAgi)/npcAgi)*100;
  let mod=0;
  if(pct>=50) mod=20;
  else if(pct>=30) mod=15;
  else if(pct>=15) mod=10;
  else if(pct>=5) mod=5;
  else if(pct<=-50) mod=-20;
  else if(pct<=-30) mod=-15;
  else if(pct<=-15) mod=-10;
  else if(pct<=-5) mod=-5;
  return {pct,mod};
}
function r520StealChance(name){
  const npc=r519HostileNpcFighter(name,1);
  const pc=typeof r4Core==='function'?r4Core():{agi:S.agi||0};
  const realm=r520StealRealmMod(S.realm,r520NpcRealm(name));
  const agi=r520StealAgiMod(pc.agi,npc.agi);
  const raw=50+realm.total+agi.mod;
  const chance=Math.max(5,Math.min(95,raw));
  return {chance,npc,playerAgi:pc.agi||0,npcAgi:npc.agi||0,realm,agi};
}

// 覆蓋 R5.19 簡化搶奪判定。
window.r519ConfirmSteal=function(name){
  r519EnsureHostile();
  const calc=r520StealChance(name),chance=calc.chance,npc=calc.npc;
  S.hostileState.cooldown[`${name}:搶奪`]=(r4GameMinutes?.()||0)+1440;
  if(Math.random()*100>=chance){
    S.npcAffinity[name]=(S.npcAffinity[name]||0)-.5;
    closeModal();
    log(`⚠️ 對${name}搶奪失敗（成功率${chance}%｜境界修正${calc.realm.total>=0?'+':''}${calc.realm.total}%｜身法修正${calc.agi.mod>=0?'+':''}${calc.agi.mod}%），好感－0.5心。`);
    render();
    return;
  }
  S.npcAffinity[name]=(S.npcAffinity[name]||0)-2;

<script id="battle-master-v1-script">
'use strict';

window.BATTLE_MASTER_V1 = {"canvas": {"width": 1600, "height": 900}, "main": {"x": 0, "y": 0, "width": 1300, "height": 800}, "bottom": {"x": 0, "y": 800, "width": 1300, "height": 100}, "side": {"x": 1300, "y": 0, "width": 300, "height": 900}, "battleCenterX": 650, "boss": {"topBossCenter": {"x": 650, "y": 165}, "bottomBossCenter": {"x": 650, "y": 305}, "minionRowCenterX": 650}};

/* 只允許整張 1600×900 畫布等比例縮放 */
function bmv1Scale(){
  const canvas=document.querySelector('.bmv1-canvas');
  if(!canvas)return;
  const sx=window.innerWidth/1600;
  const sy=window.innerHeight/900;
  const scale=Math.min(sx,sy);
  canvas.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
window.addEventListener('resize',bmv1Scale);

/* 右側固定行動順序 */
function bmv1TurnOrder(b){
  return [...b.playerTeam.filter(x=>x.hp>0).map(x=>({n:x.name,a:x.agi||0,s:'我'})),
          ...b.enemyTeam.filter(x=>x.hp>0).map(x=>({n:x.name,a:x.agi||0,s:'敵'}))]
    .sort((a,b)=>b.a-a.a)
    .map((x,i)=>`<span>${i+1}　${x.s}・${x.n}</span>`).join('');
}

/* 戰鬥主內容仍沿用穩定版 r519 元件。
   本測試分支只鎖總體畫布與三大區域，不定案卡框尺寸。 */
function bmv1CombatCore(b){
  const boss=b.enemyTeam.some(e=>/妖王|神獸|災獸/.test((e.tier||'')+(e.name||'')));
  return `<div class="bmv1-combat-content">
    <div class="r519-battle-top">
      <div class="r519-logo">九州修仙錄</div>
      <div class="r519-battle-kind">${boss?'妖王／神獸／災獸戰':'一般／特殊／高危戰'}</div>
    </div>
    <div class="r519-side-title">敵方</div>
    ${boss?r519BossArea(b):r519EnemySlots(b)}
    <div class="r519-midline"></div>
    <div class="r519-side-title">我方</div>
    ${r519PlayerSlots(b)}
    <div class="r519-formation-note">前排受到的傷害機率為60%；後排受到傷害機率為40%。</div>
  </div>`;
}

function bmv1UI(b){
  const boss=b.enemyTeam.some(e=>/妖王|神獸|災獸/.test((e.tier||'')+(e.name||'')));
  const logs=(b.logs||[]).slice(-30).map(x=>`<div>${x}</div>`).join('');
  const actions=`<div class="r519-actions">
    <button onclick="battleAttack()">普攻</button>
    <button onclick="battleTechnique()">功法</button>
    <button onclick="r58BattleBag()">背包</button>
    <button onclick="r519BattleDefend()">防禦</button>
    <button onclick="battleRun()">逃跑</button>
    <button onclick="toggleAutoBattle()">${b.auto?'停止自動戰鬥':'自動戰鬥'}</button>
  </div>`;

  return `<div class="bmv1-canvas">
    <section class="bmv1-main">
      <div class="bmv1-centerline"></div>
      ${bmv1CombatCore(b)}
    </section>

    <section class="bmv1-bottom">${actions}</section>

    <aside class="bmv1-side">
      <div class="bmv1-round">
        <span>第 ${b.round||1} 回合</span>
        <span>${boss?'BOSS戰':'一般戰鬥'}</span>
      </div>
      <div class="bmv1-order">
        <h3>行動順序</h3>
        <div class="bmv1-order-list">${bmv1TurnOrder(b)}</div>
      </div>
      <div class="bmv1-log">
        <h3>戰鬥日誌</h3>
        <div class="bmv1-log-body">${logs||'<div class="muted">尚無戰鬥紀錄。</div>'}</div>
      </div>
    </aside>

    <span class="bmv1-region-label main">主戰場 1300×800 / 中心 X=650</span>
    <span class="bmv1-region-label bottom">底部操作區 1300×100</span>
    <span class="bmv1-region-label side">右側資訊區 300×900</span>
  </div>`;
}

/* 覆寫一般戰鬥顯示入口：只套母版 */
showBattle=function(){
  const b=battle;if(!b)return;
  showModal('⚔️ 戰鬥',bmv1UI(b));
  const back=document.getElementById('modalBack');
  if(back)back.classList.add('bmv1-active','battle-locked');
  requestAnimationFrame(bmv1Scale);

  if(b.auto){
    setTimeout(()=>{
      if(battle&&battle.auto){
        (typeof r58AutoStep==='function'?r58AutoStep():battleAttack());
      }
    },S.autoBattleConfig?.speed==='fast'?220:450);
  }
};

/* 關閉戰鬥時移除母版 class */
const bmv1OldClose=window.closeModal;
window.closeModal=function(){
  const back=document.getElementById('modalBack');
  if(back)back.classList.remove('bmv1-active');
  return bmv1OldClose.apply(this,arguments);
};
</script>

<script id="battle-slot-v2-script">
'use strict';

const BSV2_ROOT_ORB={"火": "assets/img_057_4bdb069f10519f60.png", "水": "assets/img_058_a98e3ae88e0a62a0.png", "風": "assets/img_059_763a97b1c55d22dd.png", "土": "assets/img_060_69734c59d44030a1.png", "木": "assets/img_061_bb4db28d2e4e1059.png", "雷": "assets/img_062_a2f95cfb9e00c32d.png", "光": "assets/img_063_ed26021555c55d5a.png", "暗": "assets/img_064_82614cdafb7bbdec.png"};
const BSV2_MONSTER_ORB={"火": "assets/img_065_e4bb324baecac8ea.png", "水": "assets/img_066_6dac225464a59a39.png", "風": "assets/img_067_6c2d4d7fd46cc664.png", "土": "assets/img_068_83b697ee721c13c2.png", "木": "assets/img_069_94b79722f8750760.png", "雷": "assets/img_070_a17bc46d50589003.png", "光": "assets/img_071_6a463721bb6430a7.png", "暗": "assets/img_072_e204ecf4faa62edf.png"};

function bsv2Elements(raw){
  raw=String(raw||'');
  return ['火','水','風','土','木','雷','光','暗'].filter(x=>raw.includes(x)).slice(0,2);
}
function bsv2RootElements(f){
  const n=String(f?.name||'').replace(/^【[^】]+】/,'');
  if(f?.type==='player'||n===S.name)return [S.mainRoot].filter(Boolean);
  const npc=(R511_NPC||{})[n]||{};
  return bsv2Elements(npc.roots||f?.roots||f?.root||'');
}
function bsv2MonsterElements(f){
  return bsv2Elements(f?.attr||f?.element||f?.roots||f?.root||'');
}
function bsv2OrbHtml(f,enemy){
  const list=enemy?bsv2MonsterElements(f):bsv2RootElements(f);
  const map=enemy?BSV2_MONSTER_ORB:BSV2_ROOT_ORB;
  return `<span class="bsv2-orbs ${enemy?'monster':'root'}">${list.map(x=>map[x]?`<img src="${map[x]}" alt="${x}${enemy?'元素球':'靈根球'}">`:'').join('')}</span>`;
}
function bsv2Image(f,enemy){
  if(typeof r519FighterImage==='function')return r519FighterImage(f,enemy)||'';
  return '';
}
function bsv2Symbol(name){
  return typeof r519EnemySymbol==='function'?r519EnemySymbol(name||''):'👾';
}
function bsv2Card(f,row,enemy,cls){
  if(!f)return `<div class="bsv2-card empty ${cls}">${row}・空位</div>`;
  const hp=Math.max(0,Number(f.hp||0));
  const max=Math.max(1,Number(f.maxhp||f.hp||1));
  const mp=Math.max(0,Number(f.mp||0));
  const mmax=Math.max(0,Number(f.maxmp||f.mp||0));
  const img=bsv2Image(f,enemy);
  const art=img?`<img src="${img}" alt="${f.name||''}正式立繪">`:`<span class="bsv2-symbol">${bsv2Symbol(f.name||'')}</span>`;
  return `<div class="bsv2-card ${cls} ${hp<=0?'dead':''}">
    ${bsv2OrbHtml(f,enemy)}
    <div class="bsv2-art">${art}</div>
    <div class="bsv2-info">
      <div class="bsv2-name">${f.name||''}</div>
      <span class="bsv2-row">${row}</span>
      <div class="bsv2-statline"><span>HP</span><div class="bsv2-bar"><i style="width:${Math.max(0,Math.min(100,hp/max*100))}%"></i></div><span class="bsv2-num">${hp}/${max}</span></div>
      <div class="bsv2-statline"><span>MP</span><div class="bsv2-bar mp"><i style="width:${mmax?Math.max(0,Math.min(100,mp/mmax*100)):0}%"></i></div><span class="bsv2-num">${mp}/${mmax}</span></div>
    </div>
  </div>`;
}

function bsv2NormalEnemy(b){
  const E=r512EnemyFormation(b),g=s=>E[s]||null;
  return bsv2Card(g('back1'),'後排1',true,'bsv2-e-b1')+
         bsv2Card(g('back2'),'後排2',true,'bsv2-e-b2')+
         bsv2Card(g('front1'),'前排1',true,'bsv2-e-f1')+
         bsv2Card(g('front2'),'前排2',true,'bsv2-e-f2');
}
function bsv2NormalPlayer(b){
  const P=r512PlayerFormationForBattle(b),g=s=>P[s]||null;
  return bsv2Card(g('front1'),'前排1',false,'bsv2-p-f1')+
         bsv2Card(g('front2'),'前排2',false,'bsv2-p-f2')+
         bsv2Card(g('back1'),'後排1',false,'bsv2-p-b1')+
         bsv2Card(g('back2'),'後排2',false,'bsv2-p-b2');
}

function bsv2BossDetect(b){
  return b.enemyTeam.some(e=>/妖王|神獸|災獸|長老級|道祖級/.test(String(e.tier||'')+String(e.name||'')));
}
function bsv2BossUnit(b){
  return b.enemyTeam.find(e=>/妖王|神獸|災獸|長老級|道祖級/.test(String(e.tier||'')+String(e.name||'')))||b.enemyTeam[0];
}
function bsv2BossMinions(b,boss){
  const out=[];
  try{
    const E=r512EnemyFormation(b);
    ['front1','front2','back1','back2'].forEach(k=>{
      const x=E[k];
      if(x&&x!==boss&&!out.includes(x))out.push(x);
    });
  }catch(e){}
  b.enemyTeam.forEach(x=>{
    if(x&&x!==boss&&!out.includes(x))out.push(x);
  });
  return out.slice(0,4);
}
function bsv2BossCard(boss,mode){
  const hp=Math.max(0,Number(boss.hp||0));
  const max=Math.max(1,Number(boss.maxhp||boss.hp||1));
  const mp=Math.max(0,Number(boss.mp||0));
  const mmax=Math.max(0,Number(boss.maxmp||boss.mp||0));
  let img='';
  if(/長右/.test(boss.name||''))img=R512_IMG?.['boss_長右']||'';
  if(!img)img=bsv2Image(boss,true);
  const art=img?`<img src="${img}" alt="${boss.name||'BOSS'}">`:`<span class="bsv2-symbol" style="font-size:78px">${bsv2Symbol(boss.name||'')}</span>`;
  return `<div class="bsv2-boss-card ${mode==='A'?'top':'bottom'}">
    ${bsv2OrbHtml(boss,true)}
    <div class="bsv2-boss-art">${art}</div>
    <div class="bsv2-boss-info">
      <div class="bsv2-boss-name">${boss.name||'BOSS'}</div>
      <div class="bsv2-statline"><span>HP</span><div class="bsv2-bar"><i style="width:${Math.max(0,Math.min(100,hp/max*100))}%"></i></div><span class="bsv2-num">${hp}/${max}</span></div>
      <div class="bsv2-statline"><span>MP</span><div class="bsv2-bar mp"><i style="width:${mmax?Math.max(0,Math.min(100,mp/mmax*100)):0}%"></i></div><span class="bsv2-num">${mp}/${mmax}</span></div>
    </div>
  </div>`;
}
function bsv2BossEnemyRow(b,boss,mode){
  const mins=bsv2BossMinions(b,boss);
  const labels=['前排1','前排2','後排1','後排2'];
  const cards=[0,1,2,3].map(i=>bsv2Card(mins[i]||null,labels[i],true,'bsv2-boss-minion')).join('');
  return `<div class="bsv2-boss-row ${mode==='A'?'a':'b'}">${cards}</div>`;
}
function bsv2BossPlayerRow(b){
  const P=r512PlayerFormationForBattle(b);
  const arr=[P.front1||null,P.front2||null,P.back1||null,P.back2||null];
  const labels=['前排1','前排2','後排1','後排2'];
  return arr.map((x,i)=>bsv2Card(x,labels[i],false,`bsv2-boss-player bsv2-boss-p${i+1}`)).join('');
}

/* 覆寫母版主戰場內容；右欄、底部、1600×900 不變 */
bmv1CombatCore=function(b){
  const boss=bsv2BossDetect(b);

  if(!boss){
    return `<div class="bmv1-combat-content">
      <div class="bsv2-title enemy">敵方</div>
      ${bsv2NormalEnemy(b)}
      <div class="bsv2-title ally">我方</div>
      ${bsv2NormalPlayer(b)}
    </div>`;
  }

  const main=bsv2BossUnit(b);
  const mode=(b.bossPanelMode==='B'||S.bossPanelMode==='B')?'B':'A';

  return `<div class="bmv1-combat-content">
    ${bsv2BossCard(main,mode)}
    ${bsv2BossEnemyRow(b,main,mode)}
    <div class="bsv2-title ally boss">我方</div>
    ${bsv2BossPlayerRow(b)}
  </div>`;
};
</script>

<script id="battle-slot-v21-script">
'use strict';

/* 重新輸出卡框內容：
   HP / MP 不再塞在左側或右側資訊欄，
   改成卡框底部完整橫向雙條。 */
bsv2Card=function(f,row,enemy,cls){
  if(!f)return `<div class="bsv2-card empty ${cls}">${row}・空位</div>`;

  const hp=Math.max(0,Number(f.hp||0));
  const max=Math.max(1,Number(f.maxhp||f.hp||1));
  const mp=Math.max(0,Number(f.mp||0));
  const mmax=Math.max(0,Number(f.maxmp||f.mp||0));

  const img=bsv2Image(f,enemy);
  const art=img
    ? `<img src="${img}" alt="${f.name||''}正式立繪">`
    : `<span class="bsv2-symbol">${bsv2Symbol(f.name||'')}</span>`;

  const hpPct=Math.max(0,Math.min(100,hp/max*100));
  const mpPct=mmax?Math.max(0,Math.min(100,mp/mmax*100)):0;

  return `<div class="bsv2-card ${cls} ${hp<=0?'dead':''}">
    ${bsv2OrbHtml(f,enemy)}
    <div class="bsv2-art">${art}</div>

    <div class="bsv2-info">
      <div class="bsv2-name">${f.name||''}</div>
      <span class="bsv2-row">${row}</span>
    </div>

    <div class="bsv21-bottom-bars">
      <div class="bsv21-line">
        <span>HP</span>
        <div class="bsv21-bar"><i style="width:${hpPct}%"></i></div>
        <span class="bsv21-num">${hp}/${max}</span>
      </div>
      <div class="bsv21-line">
        <span>MP</span>
        <div class="bsv21-bar mp"><i style="width:${mpPct}%"></i></div>
        <span class="bsv21-num">${mp}/${mmax}</span>
      </div>
    </div>
  </div>`;
};

/* 重新鎖定 BOSS 四從屬卡的 class，避免 nth-child 造成位置飄動 */
bsv2BossEnemyRow=function(b,boss,mode){
  const mins=bsv2BossMinions(b,boss);
  const labels=['前排1','前排2','後排1','後排2'];

  const cards=[0,1,2,3].map(i=>{
    const cls=`bsv2-boss-minion bsv2-boss-${mode.toLowerCase()}${i+1}`;
    return bsv2Card(mins[i]||null,labels[i],true,cls);
  }).join('');

  return `<div class="bsv2-boss-row ${mode==='A'?'a':'b'}">${cards}</div>`;
};

bsv2BossPlayerRow=function(b){

  const arr=[P.front1||null,P.front2||null,P.back1||null,P.back2||null];
  const labels=['前排1','前排2','後排1','後排2'];

      x,
      labels[i],
      false,
      `bsv2-boss-player bsv2-boss-p${i+1}`
    )
  ).join('');
};
</script>

<script id="battle-human-portrait-v2-script">
'use strict';

/* 只重新輸出戰位卡內容：
   - HP / MP 改成 氣血 / 靈力
   - 站位文字移至框外下方
   - 其餘戰鬥資料與計算完全沿用
*/
bsv2Card=function(f,row,enemy,cls){
  if(!f){
    return `<div class="bsv2-card empty ${cls}">
      <span class="bsv2-empty-label">空位</span>
      <div class="bsv2-row-out">${row}</div>
    </div>`;
  }

  const hp=Math.max(0,Number(f.hp||0));
  const max=Math.max(1,Number(f.maxhp||f.hp||1));
  const mp=Math.max(0,Number(f.mp||0));
  const mmax=Math.max(0,Number(f.maxmp||f.mp||0));

  const img=bsv2Image(f,enemy);
  const art=img
    ? `<img src="${img}" alt="${f.name||''}正式立繪">`
    : `<span class="bsv2-symbol">${bsv2Symbol(f.name||'')}</span>`;

  const hpPct=Math.max(0,Math.min(100,hp/max*100));
  const mpPct=mmax?Math.max(0,Math.min(100,mp/mmax*100)):0;

  return `<div class="bsv2-card ${cls} ${hp<=0?'dead':''}">
    ${bsv2OrbHtml(f,enemy)}
    <div class="bsv2-art">${art}</div>

    <div class="bsv2-info">
      <div class="bsv2-name">${f.name||''}</div>
    </div>

    <div class="bsv21-bottom-bars">
      <div class="bsv21-line">
        <span>氣血</span>
        <div class="bsv21-bar"><i style="width:${hpPct}%"></i></div>
        <span class="bsv21-num">${hp}/${max}</span>
      </div>
      <div class="bsv21-line">
        <span>靈力</span>
        <div class="bsv21-bar mp"><i style="width:${mpPct}%"></i></div>
        <span class="bsv21-num">${mp}/${mmax}</span>
      </div>
    </div>

    <div class="bsv2-row-out">${row}</div>
  </div>`;
};
</script>

<script id="monster-four-layer-v1">
'use strict';

const MONSTER_FOUR_LAYER_ART_8 = {
  '青木狼': 'assets/img_081_b788c1f5c9825c8f.png',
  '青靈蛇': 'assets/img_082_e29d7daa04aae565.png',
  '青翠蝶': 'assets/img_083_af7d15855d209d29.png',
  '青臭蟲': 'assets/img_084_ee5da711736459c4.png',
  '朝東鳥': 'assets/img_085_be3972d8bc6bd1e7.png',
  '朝陽狐': 'assets/img_086_93936430552e9ff1.png',
  '重翅蝶': 'assets/img_087_6f3bb821f856d91b.png',
  '小圓蛛': 'assets/img_088_09beb9bda2728975.png'
};

function monsterFourLayerName(f){
  return String(f?.name || '').replace(/^【[^】]+】/,'').trim();
}

const _bsv2CardBeforeMonsterFourLayer = bsv2Card;

bsv2Card = function(f,row,enemy,cls){
  if(!f) return _bsv2CardBeforeMonsterFourLayer(f,row,enemy,cls);

  const n = monsterFourLayerName(f);
  const img = enemy ? MONSTER_FOUR_LAYER_ART_8[n] : '';

  // 非指定八隻妖物：完整沿用目前定案版
  if(!img) return _bsv2CardBeforeMonsterFourLayer(f,row,enemy,cls);

  const hp = Math.max(0,Number(f.hp||0));
  const max = Math.max(1,Number(f.maxhp||f.hp||1));
  const mp = Math.max(0,Number(f.mp||0));
  const mmax = Math.max(0,Number(f.maxmp||f.mp||0));

  const hpPct = Math.max(0,Math.min(100,hp/max*100));
  const mpPct = mmax ? Math.max(0,Math.min(100,mp/mmax*100)) : 0;

  return `<div class="bsv2-card monster-4layer-card ${cls} ${hp<=0?'dead':''}" data-monster="${n}">
    <div class="monster-4layer-clip">
      <div class="monster-layer monster-layer-bg"></div>
      <div class="monster-layer monster-layer-fx"></div>
      <div class="monster-layer monster-layer-art">
        <img src="${img}" alt="${n}妖物立繪">
      </div>
      <div class="monster-layer monster-layer-info">
        ${bsv2OrbHtml(f,true)}
        <div class="bsv2-name">${n}</div>
        <div class="bsv21-bottom-bars">
          <div class="bsv21-line">
            <span>氣血</span>
            <div class="bsv21-bar"><i style="width:${hpPct}%"></i></div>
            <span class="bsv21-num">${hp}/${max}</span>
          </div>
          <div class="bsv21-line">
            <span>靈力</span>
            <div class="bsv21-bar mp"><i style="width:${mpPct}%"></i></div>
            <span class="bsv21-num">${mp}/${mmax}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="bsv2-row-out">${row}</div>
  </div>`;
};
</script>

<script id="monster-four-layer-global-v2-script">
'use strict';

/* =========================================================
   全面套用普通妖物四層戰位框。
   BOSS 類完全不處理，繼續走原本 BOSS 系統。
   ========================================================= */

const _bsv2CardBeforeFourLayerGlobalV2 = bsv2Card;

const MONSTER_FX_SPECIFIC_V2 = new Set([
  '青木狼','青靈蛇','青翠蝶','青臭蟲',
  '朝東鳥','朝陽狐','重翅蝶','小圓蛛',
  '雷角鹿','轟轟鯰','噴水蟲','冥雷蛟','鳴雀',
  '潮汐龜','水蛇','水刃狼','風粉蝶','千針蜂','自爆毒蛛',
  '精晶礦靈'
]);

function monsterV2CleanName(f){
  return String(f?.name||'').replace(/^【[^】]+】/,'').trim();
}

function monsterV2IsBoss(f){
  const s = String(f?.tier||'') + String(f?.name||'');
  return /妖王|神獸|災獸|長老級|道祖級|長右/.test(s);
}

function monsterV2PrimaryElement(f){
  try{
    const a = bsv2MonsterElements(f);
    if(Array.isArray(a) && a.length) return String(a[0]||'');
  }catch(e){}
  return String(f?.element||f?.attr||f?.root||'');
}

function monsterV2Image(f){
  const n = monsterV2CleanName(f);

  /* 已定案 8 隻：沿用目前四層定案版正式資產 */
  if(typeof MONSTER_FOUR_LAYER_ART_8 !== 'undefined' && MONSTER_FOUR_LAYER_ART_8[n]){
    return MONSTER_FOUR_LAYER_ART_8[n];
  }

  /* 若未來妖物正式立繪已有既存解析器，直接使用；沒有就顯示既有妖物符號 */
  try{
    const x = bsv2Image(f,true);
    if(x) return x;
  }catch(e){}

  return '';
}

bsv2Card = function(f,row,enemy,cls){
  if(!f) return _bsv2CardBeforeFourLayerGlobalV2(f,row,enemy,cls);

  /* NPC / 夥伴 / 玩家：沿用目前玩家 V3.1 定案卡，只加統一標記，不改排版 */
  if(!enemy){
    const old = _bsv2CardBeforeFourLayerGlobalV2(f,row,enemy,cls);
    return old.replace('class="bsv2-card ', 'class="bsv2-card bsv2-ally-unified ');
  }

  /* BOSS 不處理 */
  if(monsterV2IsBoss(f)){
    return _bsv2CardBeforeFourLayerGlobalV2(f,row,enemy,cls);
  }

  const n = monsterV2CleanName(f);
  const img = monsterV2Image(f);
  const ele = monsterV2PrimaryElement(f);

  const hp = Math.max(0,Number(f.hp||0));
  const max = Math.max(1,Number(f.maxhp||f.hp||1));
  const mp = Math.max(0,Number(f.mp||0));
  const mmax = Math.max(0,Number(f.maxmp||f.mp||0));
  const hpPct = Math.max(0,Math.min(100,hp/max*100));
  const mpPct = mmax ? Math.max(0,Math.min(100,mp/mmax*100)) : 0;

  const art = img
    ? `<img src="${img}" alt="${n}妖物立繪">`
    : `<div class="monster-layer-symbol">${bsv2Symbol(n)}</div>`;

  const specific = MONSTER_FX_SPECIFIC_V2.has(n) ? '1' : '0';

  return `<div class="bsv2-card monster-4layer-card ${cls} ${hp<=0?'dead':''}"
      data-monster="${n}"
      data-element="${ele}"
      data-fx-specific="${specific}">
    <div class="monster-4layer-clip">
      <div class="monster-layer monster-layer-bg"></div>
      <div class="monster-layer monster-layer-fx"></div>
      <div class="monster-layer monster-layer-art">${art}</div>

      <div class="monster-layer monster-layer-info">
        ${bsv2OrbHtml(f,true)}
        <div class="bsv2-name">${n}</div>
        <div class="bsv21-bottom-bars">
          <div class="bsv21-line">
            <span>氣血</span>
            <div class="bsv21-bar"><i style="width:${hpPct}%"></i></div>
            <span class="bsv21-num">${hp}/${max}</span>
          </div>
          <div class="bsv21-line">
            <span>靈力</span>
            <div class="bsv21-bar mp"><i style="width:${mpPct}%"></i></div>
            <span class="bsv21-num">${mp}/${mmax}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="bsv2-row-out">${row}</div>
  </div>`;
};
</script>

<script id="thunder-marsh-open-v1">
'use strict';

/* =========================================================
   雷鳴沼 / 長右條件正式分離
   - 雷鳴沼：完成前期自由移動條件後正常可前往
   - 長右：只有接取主線［第一封印－長右］才在雷鳴沼冒險介面出現
   - firstSeal 不再用來鎖整張雷鳴沼地圖
   ========================================================= */

const RSEAL_CHANGYOU_FINAL = {
  name:'災獸長右',
  area:'雷鳴沼',
  species:'災獸種',
  realm:'築基圓滿100%',
  battleType:'災獸戰鬥',
  role:'高攻擊',
  phase1:{
    attr:'水',
    skills:[
      {name:'洪水',effect:'全體範圍'},
      {name:'巨海渦流',effect:'全體附帶遲緩'},
      {name:'浪潮',effect:'全體連續三次傷害'}
    ]
  },
  phase2:{
    attr:'水／雷',
    skills:[
      {name:'轟雷',effect:'全體範圍'},
      {name:'雷針',effect:'附帶麻痺'}
    ]
  },
  drops:['［特殊］長右之心','［特殊］災獸之魂']
};

function rsealChangyouQuestAccepted(){
  const qs = Array.isArray(S?.quests) ? S.quests : [];
  return qs.some(q=>{
    const title = String(q?.title || q?.name || q?.id || '');
    const type = String(q?.type || '');
    const matched = title.includes('第一封印') && title.includes('長右');
    const main = !type || type.includes('主線');
    return matched && main && !q?.claimed;
  });
}

/* ---------- 雷鳴沼道路：完成確認修為後常駐開放 ---------- */
const _rsealNearbyBase = nearby;
nearby = function(){
  if(regionOf(S.place)!=='東州') return [];

  /* 前期主線未解鎖自由路線時，完整沿用目前定案限制 */
  if(typeof r57ConfirmDone==='function' && !r57ConfirmDone()){
    return (typeof r57PreConfirmRoads==='function' ? (r57PreConfirmRoads()[S.place]||[]) : _rsealNearbyBase());
  }

  let a = [...(R58_EAST_ROADS?.[S.place] || [])];

  /* 正式修正：碧潮鎮 <-> 雷鳴沼是正常道路，不再看 firstSeal */
  if(S.place==='碧潮鎮' && !a.includes('雷鳴沼')) a.push('雷鳴沼');
  if(S.place==='雷鳴沼' && !a.includes('碧潮鎮')) a.push('碧潮鎮');

  /* 既有傳送塔規則維持不變 */
  if(S.place==='東州傳送塔') a=['天海港'];
  if(['潮汐秘境','晶礦秘境'].includes(S.place)) a=['東州傳送塔'];

  return [...new Set(a)];
};

/* ---------- 移動：移除雷鳴沼 firstSeal 阻擋 ---------- */
moveTo = function(p){
  if(['潮汐秘境','晶礦秘境'].includes(p) && S.place==='東州傳送塔'){
    return r58TowerTransfer();
  }

  if(!nearby().includes(p)) return;

  const from=S.place;
  const mins=r57TravelMinutes(from,p);
  if(mins>0) r4AdvanceMinutes(mins,{effective:['野外','秘境'].includes(placeType(p))});

  S.place=p;
  r57MarkTravelEnd();
  r4RecoverGather();

  log(`🧭 ${from} → ${p}${mins?`，耗時 ${mins} 分鐘。`:'，重複連續移動，不計耗時。'}`);

  const rc=S.quests.find(x=>x.id==='returnCity'&&!x.claimed);
  if(rc&&p==='朝御城'){
    rc.done=true;
    if(typeof r56SyncQuestArchive==='function') r56SyncQuestArchive(rc);
  }

  if(typeof r58AdvanceFirstBattleOnArrival==='function') r58AdvanceFirstBattleOnArrival();
  render();
};

/* ---------- 地圖：雷鳴沼節點不再顯示主線鎖 ---------- */
if(typeof v070EastMap === 'function'){
  v070EastMap = function(){
    let roads=[];
    for(const [a,bs] of Object.entries(V070_EAST_ROADS)){
      for(const b of bs){
        if(Object.keys(V070_EAST_POS).indexOf(a)<Object.keys(V070_EAST_POS).indexOf(b)) roads.push([a,b]);
      }
    }
    /* 舊 V070 道路資料若漏了這條，補上視覺道路 */
    if(!roads.some(([a,b])=>[a,b].includes('碧潮鎮')&&[a,b].includes('雷鳴沼'))){
      roads.push(['碧潮鎮','雷鳴沼']);
    }

    let h=roads.map(x=>v070MapRoad(...x)).join('');
    for(const [n,p] of Object.entries(V070_EAST_POS)){
      const current=S.place===n;
      h+=`<button class="r512-region ${current?'current':''}" style="left:${p[0]}%;top:${p[1]}%" onclick="moveTo('${n}')">${current?'📍 ':''}${n}</button>`;
    }
    return `<div class="r512-map-mobile"><div class="r512-map">${h}</div></div>`;
  };
}

if(typeof v070FinalEastMap === 'function'){
  v070FinalEastMap = function(){
    const edges=[
      ['朝御城','青陽鎮'],['青陽鎮','青陽山'],
      ['朝御城','碧潮鎮'],['碧潮鎮','雷鳴沼'],
      ['朝御城','東嶺鎮'],['東嶺鎮','落星谷'],
      ['朝御城','天海港'],['天海港','東州傳送塔'],
      ['東州傳送塔','潮汐秘境'],['東州傳送塔','晶礦秘境']
    ];

    let h=`<div class="v070-map-title">東州</div>
      <div class="v070-map-sub">大御王朝・已確認道路</div>
      <div class="v070-map-water"></div>
      <div class="v070-map-mountain" style="left:4%;top:6%">⛰</div>
      <div class="v070-map-mountain" style="left:88%;top:5%">⛰</div>
      <div class="v070-map-mountain" style="left:4%;top:62%">⛰</div>`;

    h+=edges.map(e=>v070FinalRoad(...e)).join('');

    for(const [n,p] of Object.entries(V070_MAP_POS2)){
      const cur=S.place===n;
      const kind=V070_MAP_KIND[n]||'town';
      h+=`<button class="v070-node ${kind} ${cur?'current':''}" style="left:${p[0]}%;top:${p[1]}%" onclick="moveTo('${n}')">${cur?'📍 ':''}${n}</button>`;
    }

    return `<div class="v070-map-scroll"><div class="v070-map-shell">${h}</div></div>`;
  };
}

/* ---------- 長右：只在主線接取後於雷鳴沼冒險介面出現 ---------- */
function rsealChangyouAdventureHTML(){
  if(S.place!=='雷鳴沼' || !rsealChangyouQuestAccepted()) return '';
  const d=RSEAL_CHANGYOU_FINAL;
  return `<h3>⚠️ 主線災獸</h3>
    <div class="card rseal-changyou-card">
      <b>${d.name}</b>　${d.species}<br>
      <span class="muted">${d.realm}・${d.battleType}・${d.role}</span><br>
      <span class="tiny">第一階段：${d.phase1.attr}　／　第二階段：${d.phase2.attr}</span><br>
      <button onclick="rsealChangyouEncounter()">⚔️ 挑戰${d.name}</button>
    </div>`;
}

function rsealChangyouEncounter(){
  /* 長右兩階段災獸戰尚未進入目前 BOSS 測試範圍，先只鎖出現條件，不擅自做錯誤戰鬥。 */
  alert('［災獸長右］已依主線條件出現在雷鳴沼。兩階段災獸戰鬥將在主線戰鬥流程實裝時接入。');
}

const _rsealRenderAdventureBase = renderAdventure;
renderAdventure = function(){
  const base = _rsealRenderAdventureBase();
  return base + rsealChangyouAdventureHTML();
};
</script>

<script id="first-eight-visible-fx-v21-script">
'use strict';

const _bsv2CardBeforeFirstEightVisibleFxV21 = bsv2Card;

function firstEightVisibleFxMarkupV21(name){
  if(['青木狼','青靈蛇','青翠蝶','朝東鳥','朝陽狐','重翅蝶'].includes(name)){
    return `<div class="monster-layer monster-layer-fx mfx-explicit">
      <span class="mfx-leaf l1"></span>
      <span class="mfx-leaf l2"></span>
      <span class="mfx-leaf l3"></span>
      <span class="mfx-leaf l4"></span>
      <span class="mfx-leaf l5"></span>
      <span class="mfx-leaf l6"></span>
    </div>`;
  }

  if(name==='青臭蟲'){
    return `<div class="monster-layer monster-layer-fx mfx-explicit">
      <span class="mfx-smoke s1"></span>
      <span class="mfx-smoke s2"></span>
      <span class="mfx-smoke s3"></span>
      <span class="mfx-smoke s4"></span>
      <span class="mfx-mushroom m1"></span>
      <span class="mfx-mushroom m2"></span>
      <span class="mfx-mushroom m3"></span>
    </div>`;
  }

  if(name==='小圓蛛'){
    return `<div class="monster-layer monster-layer-fx mfx-explicit">
      <div class="mfx-web">
        <div class="mfx-web-rings"></div>
        <span class="ray r1"></span>
        <span class="ray r2"></span>
        <span class="ray r3"></span>
        <span class="ray r4"></span>
        <span class="ray r5"></span>
      </div>
      <span class="mfx-dew d1"></span>
      <span class="mfx-dew d2"></span>
      <span class="mfx-dew d3"></span>
    </div>`;
  }

  return '';
}

bsv2Card = function(f,row,enemy,cls){
  const card = _bsv2CardBeforeFirstEightVisibleFxV21(f,row,enemy,cls);
  if(!f || !enemy) return card;

  const n = String(f?.name||'').replace(/^【[^】]+】/,'').trim();
  const fx = firstEightVisibleFxMarkupV21(n);
  if(!fx) return card;

  return card.replace(
    '<div class="monster-layer monster-layer-fx"></div>',
    fx
  );
};
</script>

<script id="battle-detail-and-dual-orb-v1-script">
'use strict';
(function(){
  function bsv2DetailName(x){
    return String(x?.name||'未命名').replace(/^【[^】]+】/,'').trim() || '未命名';
  }
  function bsv2DetailNum(v){
    const n=Number(v);
    return Number.isFinite(n)?Math.round(n):0;
  }
  function bsv2DetailRealm(x){
    return String(x?.realm||x?.levelName||x?.境界||'未知');
  }
  function bsv2DetailPower(x){
    const preset=Number(x?.combatPower ?? x?.battlePower ?? x?.戰鬥力);
    if(Number.isFinite(preset) && preset>0) return Math.round(preset);
    /* 僅用於詳情顯示，不改實際傷害計算。 */
    const hp=bsv2DetailNum(x?.maxhp||x?.hp), mp=bsv2DetailNum(x?.maxmp||x?.mp);
    const atk=bsv2DetailNum(x?.atk), def=bsv2DetailNum(x?.def), agi=bsv2DetailNum(x?.agi), hit=bsv2DetailNum(x?.hit);
    return Math.max(1,Math.round(hp*.25 + mp*.2 + atk*5 + def*4 + agi*3 + hit*3));
  }
  function bsv2DetailEnemyType(x){
    const s=String(x?.tier||x?.species||x?.type||x?.category||'');
    if(/災獸/.test(s)) return '災獸';
    if(/神獸/.test(s)) return '神獸';
    if(/妖王/.test(s)) return '妖王';
    if(/高危/.test(s)) return '高危';
    if(/特殊/.test(s)) return '特殊';
    if(/精英/.test(s)) return '精英';
    if(/稀有/.test(s)) return '稀有';
    return '一般';
  }
  function bsv2DetailSkills(x){
    const raw=x?.skills||x?.techniques||x?.skill||[];
    if(Array.isArray(raw)) return raw.map(v=>typeof v==='string'?v:(v?.name||v?.title||'')).filter(Boolean);
    if(typeof raw==='string') return raw.split(/[、,，/]/).map(s=>s.trim()).filter(Boolean);
    return [];
  }
  function bsv2DetailCard(x,enemy){
    if(!x) return '';
    const name=bsv2DetailName(x);
    const skills=enemy?bsv2DetailSkills(x):[];
    return `<div class="bsv2-detail-unit ${enemy?'enemy':'ally'}">
      <div class="bsv2-detail-name"><span>${name}</span>${enemy?`<span class="bsv2-detail-tag">${bsv2DetailEnemyType(x)}</span>`:''}</div>
      <div class="bsv2-detail-grid">
        <span>攻　<b>${bsv2DetailNum(x.atk)}</b></span>
        <span>防　<b>${bsv2DetailNum(x.def)}</b></span>
        <span>身　<b>${bsv2DetailNum(x.agi)}</b></span>
        <span>命　<b>${bsv2DetailNum(x.hit)}</b></span>
        <span>境界　<b>${bsv2DetailRealm(x)}</b></span>
        <span>戰鬥力　<b>${bsv2DetailPower(x)}</b></span>
      </div>
      ${enemy?`<div class="bsv2-detail-skills"><b>技能：</b>${skills.length?skills.join('、'):'無／未知'}</div>`:''}
    </div>`;
  }
  function bsv2UniqueUnits(list){
    const out=[];
    (list||[]).forEach(x=>{if(x && !out.includes(x)) out.push(x);});
    return out;
  }
  function bsv2BattleDetailPanel(b){
    const allies=bsv2UniqueUnits(b?.playerTeam||[]);
    const enemies=bsv2UniqueUnits(b?.enemyTeam||[]);
    return `<aside class="bsv2-detail-panel">
