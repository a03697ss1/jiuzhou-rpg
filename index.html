// V0.6.4 corresponding-shop resale system.
function shopBasePriceV064(name,shop){let arr=V061_SHOPS[shop]||[],hit=arr.find(x=>x[0]===name||normalizedTechNameV064(x[0])===normalizedTechNameV064(name));if(hit)return hit[1];if(isEquipmentName(name)){let m=name.match(/(?:攻|防|身法)\+(\d+)/);return 300+(m?Number(m[1])*90:400)}if(name.includes('藥')||name.includes('丹'))return 250;if(name.includes('晶石')||name.includes('玄鐵'))return 160;if(name.includes('靈草')||['梨草','精草','靈露','楊木','靈石'].includes(name))return 60;return 100;}
function sellBagAtShopV064(idx,shop){let b=s.bag[idx];if(!b||b[1]<=0)return;let price=Math.max(10,Math.floor(shopBasePriceV064(b[0],shop)*.4));b[1]--;s.coins+=price;log(`💰 在【${shop}】販售【${b[0]}】×1，獲得 ${price} 靈幣。`);render();}
function sellMaterialAtShopV064(name,shop){if((s.materials[name]||0)<=0)return;let price=Math.max(5,Math.floor(shopBasePriceV064(name,shop)*.4));s.materials[name]--;s.coins+=price;log(`💰 在【${shop}】販售【${name}】×1，獲得 ${price} 靈幣。`);render();}
function shopSellSectionV064(shop){let rows=[];(s.bag||[]).forEach((b,idx)=>{if(b[1]<=0)return;let n=b[0],ok=shop==='💊 藥類商店'&&(n.includes('藥')||n.includes('丹'))||shop==='⚒️ 裝備鐵匠鋪'&&isEquipmentName(n)||shop==='🐾 寵物商店'&&isPetFoodName(n);if(ok){let p=Math.max(10,Math.floor(shopBasePriceV064(n,shop)*.4));rows.push(`<div class="card"><b>${n}</b> ×${b[1]}<br>收購價：${p} 靈幣/件<br><button onclick="sellBagAtShopV064(${idx},'${shop}')">販售1件</button></div>`)}});if(shop==='🧺 雜物商店')Object.entries(s.materials||{}).forEach(([n,q])=>{if(q<=0)return;let p=Math.max(5,Math.floor(shopBasePriceV064(n,shop)*.4));rows.push(`<div class="card"><b>${n}</b> ×${q}<br>收購價：${p} 靈幣/件<br><button onclick="sellMaterialAtShopV064('${n}','${shop}')">販售1件</button></div>`)});if(shop==='📖 功法商店'){let unique=[...new Set(s.techInventory||[])];unique.forEach(n=>{let count=s.techInventory.filter(x=>x===n).length,dup=s.techs.includes(n)||s.skills.includes(n)||count>1;if(!dup)return;rows.push(`<div class="card"><b>${n}</b> ×${count}<br>重複功法收購價：${techSellPriceV064(n)} 靈幣<br><button onclick="sellOwnedTechV064('${n}')">販售1本</button></div>`)})}return rows.length?`<details><summary>💰 販售持有物</summary><div class="cards">${rows.join('')}</div></details>`:`<div class="tiny sub">目前沒有此商店可收購的持有物。</div>`;}
function shopMarkup(name){let rec=s.shopRobbery[name]||{count:0,last:-9999},mul=1+Math.min(3,rec.count)*.2;return `<h3>${name}</h3><div class="cards">${V061_SHOPS[name].map(([n,p])=>{let price=Math.floor(p*mul),d=medicineDescV062(n)||itemInfoV063?.(n)||techDefV064(n)?.desc||'';return `<div class="card"><b>${n}</b><br>${d?`<span class="sub">${d}</span><br>`:''}<b>${price} 靈幣</b><br><button onclick="buyV061('${n}',${price})">購買</button></div>`}).join('')}</div>${shopSellSectionV064(name)}<button class="redbtn" onclick="robShopV061('${name}')">🗡️ 搶劫此商店</button><span class="tiny sub"> 每48遊戲小時可搶一次；永久漲價 ${Math.min(60,rec.count*20)}%</span>`;}

function parseEquipBonusV065(name){

function defenseMultiplierV065(atk,def){return atk/Math.max(1,atk+def*.8)}
function calcDamageV065(base,atk,def,canCrit=true){let float=.95+Math.random()*.10,crit=canCrit&&Math.random()<.05,after=Math.floor(base*defenseMultiplierV065(atk,def)*float*(crit?1.5:1)),min=Math.max(1,Math.floor(base*.10));return {damage:Math.max(min,after),crit};}

function repairHongChenV065(forceFull=false){

 // Initial easter-egg realm only; do not push a progressed save backwards.
 let st=realmStageFixedV065(s.realm);
 if(!s.hongChenEasterEgg || st.major<3){

 }
 // Three affinities at 100, all others 1 if not already correctly initialized.
 if(!s.hongChenRootFixedV065){
   let keys=[...ROOT_KEYS],hundreds=keys.filter(k=>Number(s.rootAffinities?.[k])===100);
   if(hundreds.length!==3){
     let chosen=[...keys].sort(()=>Math.random()-.5).slice(0,3);

 }
 // Realm-scaled base stats through YuanYing 9: 38 minor breakthroughs from Qi 1.
 let steps=38;
 s.baseAtk=Math.max(s.baseAtk||0,10+steps*2);
 s.baseDef=Math.max(s.baseDef||0,8+steps*2);
 s.baseAgi=Math.max(s.baseAgi||0,8+steps);
 s.baseHit=Math.max(s.baseHit||0,10+steps);

 s.baseMaxmpV065=Math.max(s.baseMaxmpV065||0,50+steps*6);
 // Equipment must occupy its correct slot.
 for(let k of Object.keys(s.equip)){if(k!=='戒指' && String(s.equip[k]).includes('與伊的未來'))s.equip[k]='無'}
 s.equip.武器=weapon;s.equip.衣=clothes;s.equip.鞋=shoes;s.equip.戒指=ring;

function refreshRemainTextV065(nextAt){
 let remain=Math.max(0,Math.ceil(nextAt-gameHours()));
 let d=Math.floor(remain/24),h=remain%24;
 if(d>0)return `${d}日 ${h}小時`;
 return `${h}小時`;
}
function shuffleV065(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

function ensureTimedRefreshV065(){
 if(!s)return;
 s.shopRefreshV065=s.shopRefreshV065||{};
 s.tavernRefreshV065=s.tavernRefreshV065||{};
 let now=gameHours();

 for(let shop of Object.keys(V061_SHOPS||{})){
   let key=`${s.place}|${shop}`,rec=s.shopRefreshV065[key];
   if(!rec||now>=rec.nextAt){
     let base=V061_SHOPS[shop]||[],minCount=Math.min(base.length,shop==='📖 功法商店'?Math.min(10,base.length):Math.max(2,Math.ceil(base.length*.65)));
     let count=Math.max(minCount,Math.min(base.length,rint(minCount,base.length)));
     let chosen=shuffleV065(base).slice(0,count).map(([n,p])=>[n,Math.max(1,Math.floor(p*(.94+Math.random()*.13)))]);
     s.shopRefreshV065[key]={items:chosen,nextAt:now+72};
     if(rec)log(`🛒 【${s.place}・${shop}】商品已完成3日刷新。`);
   }
 }

 if(isMainCityV063?.()){
   let key=s.place,rec=s.tavernRefreshV065[key];
   if(!rec||now>=rec.nextAt){
     let ids=shuffleV065((s.npcs||[]).filter(n=>n.alive&&!s.partners.includes(n.id))).slice(0,5).map(n=>n.id);
     s.tavernRefreshV065[key]={ids,nextAt:now+72};
     if(rec)log(`🍺 【${s.place}酒館】可招募夥伴名單已完成3日刷新。`);
   }
 }
}

// Canonical equipment bonus parser.
function equipBonusFinalV065(name){
  let o={atk:0,def:0,agi:0,hp:0,mp:0,hit:0};
  name=String(name||'');
  const rules=[
    ['atk',/攻(?:擊)?\+(\d+)/g],
    ['def',/防(?:禦)?\+(\d+)/g],
    ['agi',/身法\+(\d+)/g],
    ['hp',/(?:氣血|HP)\+(\d+)/gi],
    ['mp',/靈力\+(\d+)/g],
    ['hit',/命中\+(\d+)/g]
  ];
  for(const [k,re] of rules){for(const m of name.matchAll(re))o[k]+=Number(m[1]||0)}
  return o;
}
function totalEquipFinalV065(){
  let o={atk:0,def:0,agi:0,hp:0,mp:0,hit:0};
  Object.values(s?.equip||{}).forEach(n=>{
    let b=equipBonusFinalV065(n);
    Object.keys(o).forEach(k=>o[k]+=b[k]||0);
  });
  return o;
}

// Establish gear-free base stats once. Later UI renders must never overwrite them.
function ensureFinalBaseV065(){
  if(!s)return;
  let b=totalEquipFinalV065();
  if(s.baseAtkFinalV065==null)s.baseAtkFinalV065=Math.max(1,(s.baseAtk!=null?s.baseAtk:(s.atk||1)-b.atk));
  if(s.baseDefFinalV065==null)s.baseDefFinalV065=Math.max(0,(s.baseDef!=null?s.baseDef:(s.def||0)-b.def));
  if(s.baseAgiFinalV065==null)s.baseAgiFinalV065=Math.max(0,(s.baseAgi!=null?s.baseAgi:(s.agi||0)-b.agi));
  if(s.baseHitFinalV065==null)s.baseHitFinalV065=Math.max(0,(s.baseHit!=null?s.baseHit:(s.hit||10)-b.hit));
  if(s.baseMaxHpFinalV065==null)s.baseMaxHpFinalV065=Math.max(1,(s.baseMaxhpV065!=null?s.baseMaxhpV065:(s.maxhp||1)-b.hp));
  if(s.baseMaxMpFinalV065==null)s.baseMaxMpFinalV065=Math.max(0,(s.baseMaxmpV065!=null?s.baseMaxmpV065:(s.maxmp||0)-b.mp));
}
function recalcFinalEquipV065(adjustCurrent=false){
  if(!s)return;
  ensureFinalBaseV065();
  let oldHpMax=s.maxhp||1, oldMpMax=s.maxmp||0, b=totalEquipFinalV065();
  s.atk=s.baseAtkFinalV065+b.atk;
  s.def=s.baseDefFinalV065+b.def;
  s.agi=s.baseAgiFinalV065+b.agi;
  s.hit=s.baseHitFinalV065+b.hit;
  s.maxhp=Math.max(1,s.baseMaxHpFinalV065+b.hp);
  s.maxmp=Math.max(0,s.baseMaxMpFinalV065+b.mp);
  if(adjustCurrent){
    // Equipping max-stat gear grants the same amount immediately;
    // unequipping removes the same amount and clamps to the new maximum.
    s.hp=Math.max(1,Math.min(s.maxhp,(s.hp||1)+(s.maxhp-oldHpMax)));
    s.mp=Math.max(0,Math.min(s.maxmp,(s.mp||0)+(s.maxmp-oldMpMax)));
  }else{
    s.hp=Math.max(1,Math.min(s.maxhp,s.hp==null?s.maxhp:s.hp));
    s.mp=Math.max(0,Math.min(s.maxmp,s.mp==null?s.maxmp:s.mp));
  }
}

// Make all legacy calls point to the same canonical calculation.
recalcEquipmentStatsV065=recalcFinalEquipV065;

// Correct equip / unequip with current/max value changes.
equipFromBag=function(i){
  let b=s.bag?.[i];if(!b||b[1]<=0||!isEquipmentName(b[0]))return;
  recalcFinalEquipV065(false);
  let item=b[0],slot=equipSlot(item),old=s.equip?.[slot]||'無';
  b[1]--;
  if(old!=='無')_v062_addBag(old,1,'卸下的裝備');
  s.equip[slot]=item;
  recalcFinalEquipV065(true);
  log(`🧥 已${old==='無'?'裝備':'更換'}${slot}：【${item}】。裝備能力已立即套用。`);
  render();
};
unequipSlot=function(slot){
  let old=s.equip?.[slot];if(!old||old==='無')return;
  recalcFinalEquipV065(false);
  _v062_addBag(old,1,'卸下的裝備');
  s.equip[slot]='無';
  recalcFinalEquipV065(true);
  log(`🧥 已卸下${slot}：【${old}】，能力加成已移除並回到背包。`);
  render();
};

// Combat power is based on the same persistent equipped totals, regardless of active tab.
const _combatPowerBeforeFinalV065=combatPower;
combatPower=function(obj){
  if(!obj){
    recalcFinalEquipV065(false);
    // Stable weighted player combat-power model.
    return Math.max(1,Math.floor(
      (s.atk||0)*5+
      (s.def||0)*4+
      (s.agi||0)*3+
      (s.hit||0)*2+
      (s.maxhp||0)*0.45+
      (s.maxmp||0)*0.65+
      realmPower(s.realm)*18
    ));
  }
  return _combatPowerBeforeFinalV065(obj);
};

equipSlot = function(name){
  name = String(name||'');

  if(name.includes('鐵鍋鏟')) return '武器';
  if(name.includes('早餐店圍裙')) return '衣';

function removeAllCopiesV065(name){
  if(!s?.bag)return;
  let total=0;
  for(const x of s.bag){if(x[0]===name)total+=x[1]||0}
  s.bag=s.bag.filter(x=>x[0]!==name);
  return total;
}
function addExactBagV065(name,desc){
  let b=s.bag.find(x=>x[0]===name);

function dominantRootNameV066(a){
 let list=V066_ROOTS.filter(k=>(a?.[k]||0)>0);
 if(!list.length)return '未覺醒';
 let k=list.reduce((b,x)=>(a[x]||0)>(a[b]||0)?x:b,list[0]);
 return `${V066_ROOT_ICONS[k]}${k}`;
}

function initRootsV066(isEaster=false){
 let vals={火:1,水:1,木:1,風:1,雷:1,土:1,光:0,暗:0};
 if(isEaster){
   let chosen=[...V066_NORMAL_ROOTS].sort(()=>Math.random()-.5).slice(0,3);
   V066_NORMAL_ROOTS.forEach(k=>vals[k]=chosen.includes(k)?100:1);
   s.primaryRoot=chosen[0];s.secondaryRoot=chosen[1];
 }else{
   let p=pick(V066_NORMAL_ROOTS),sub=pick(V066_NORMAL_ROOTS.filter(x=>x!==p));
   vals[p]=rint(95,100);vals[sub]=rint(45,50);
   s.primaryRoot=p;s.secondaryRoot=sub;
 }
 s.rootAffinities=vals;
 s.root=dominantRootNameV066(vals);
}

function ensureV066State(){
 if(!s)return;
 s.versionLabel=V066_LABEL;
 s.rootTrials=s.rootTrials||{};
 V066_ROOTS.forEach(k=>s.rootTrials[k]=Object.assign({lordAccepted:false,lordDefeated:false,lordBroken:false,godAccepted:false,godDefeated:false,godBroken:false},s.rootTrials[k]||{}));
 s.rootAffinities=s.rootAffinities||{};
 V066_ROOTS.forEach(k=>{
   if(s.rootAffinities[k]==null)s.rootAffinities[k]=(k==='光'||k==='暗')?0:1;
 });
 delete s.rootAffinities.冰;
 delete s.materials?.冰晶石;

 // 虛空石正式改為四階材料，舊存檔數量無損遷移。
 s.materials=s.materials||{};
 let oldVoid=(s.materials['［仙階］虛空石']||0)+(s.materials['［四階］虛空石']||0);
 if(oldVoid){s.materials.虛空石=(s.materials.虛空石||0)+oldVoid}
 delete s.materials['［仙階］虛空石'];delete s.materials['［四階］虛空石'];
 ['光晶石','暗晶石',...V066_SPECIAL_MATS].forEach(k=>{if(s.materials[k]==null)s.materials[k]=0});

 // Existing saves: keep the strongest legal normal roots; remove ice from primary references.
 if(!V066_ROOTS.includes(s.primaryRoot))s.primaryRoot=V066_NORMAL_ROOTS.reduce((b,k)=>(s.rootAffinities[k]||0)>(s.rootAffinities[b]||0)?k:b,'火');
 if(!V066_ROOTS.includes(s.secondaryRoot)||s.secondaryRoot===s.primaryRoot){
   s.secondaryRoot=V066_NORMAL_ROOTS.filter(k=>k!==s.primaryRoot).sort((a,b)=>(s.rootAffinities[b]||0)-(s.rootAffinities[a]||0))[0];
 }
 s.root=dominantRootNameV066(s.rootAffinities);
}

function currentRootCapV066(k){
 let t=V066_TRIALS[k],st=s.rootTrials[k];
 if(!t)return 0;
 if(!st.lordBroken)return t.cap1;
 if(!st.godBroken)return t.cap2;
 return t.max;
}
function rootStatusV066(k){
 let t=V066_TRIALS[k],v=s.rootAffinities[k]||0,st=s.rootTrials[k],cap=currentRootCapV066(k);
 if((k==='光'||k==='暗')&&v===0)return '尚未開啟';
 if(v>=t.max)return '已達最終上限';
 if(v>=t.cap2&&!st.godBroken)return `封頂 ${t.cap2}・需完成神祇試煉並使用神髓丹`;
 if(v>=t.cap1&&!st.lordBroken)return `封頂 ${t.cap1}・需完成元素領主試煉並使用屬性丹`;
 return `目前可提升至 ${cap}`;
}
function alertRootCapV066(k,stage){

 if(stage==='lord')showModal(`<h2>${V066_ROOT_ICONS[k]} ${k}靈根已達目前上限</h2><div class="card">目前${k}靈根已達 <b>${t.cap1}</b>。<br><br>請前往${k==='光'||k==='暗'?'中央州主城':'各州主城'}接取擊殺【${t.lord}】任務。首次擊敗會取得【${t.soul}】，可合成突破用丹藥。</div><button onclick="closeModal()">確認</button>`);
 else showModal(`<h2>${V066_ROOT_ICONS[k]} ${k}靈根已達目前上限</h2><div class="card">目前${k}靈根已達 <b>${t.cap2}</b>。<br><br>請前往中央州主城【太初帝都】接取擊殺【${t.god}】任務。首次擊敗會取得【${t.tear}】，可合成神髓丹突破上限。</div><button onclick="closeModal()">確認</button>`);
}
function increaseRootV066(k,amount){
 ensureV066State();
 if(!V066_ROOTS.includes(k))return 0;
 if((k==='光'||k==='暗')&&(s.rootAffinities[k]||0)<=0){alert(`${k}靈根尚未開啟。`);return 0}
 let before=s.rootAffinities[k]||0,cap=currentRootCapV066(k),after=Math.min(before+amount,cap,V066_TRIALS[k].max);
 s.rootAffinities[k]=after;s.root=dominantRootNameV066(s.rootAffinities);
 let gained=after-before;
 if(after===V066_TRIALS[k].cap1&&!s.rootTrials[k].lordBroken&&before<after)alertRootCapV066(k,'lord');
 else if(after===V066_TRIALS[k].cap2&&!s.rootTrials[k].godBroken&&before<after)alertRootCapV066(k,'god');
 return gained;
}

function useBreakPillV066(i,k,stage){

 if(n==='［高階］［靈根精華丹］'){rootChoiceModalV066(i,V066_NORMAL_ROOTS,30,30,n);return true}
 if(n==='［高階］［陰陽丹］'){rootChoiceModalV066(i,['光','暗'].filter(k=>(s.rootAffinities[k]||0)>0),10,15,n);return true}

 if(n==='［高階］［開暗丹］'){useUnlockRootV066(i,'暗');return true}
 for(const k of V066_ROOTS){
   if(n===`［中階］［${k}之丹］`){useBreakPillV066(i,k,'lord');return true}
 }
 const godPills={火:'火神靈髓丹',水:'水神靈髓丹',木:'森神靈髓丹',風:'風神靈髓丹',雷:'雷神靈髓丹',土:'土神靈髓丹',光:'光神靈髓丹',暗:'暗神靈髓丹'};

 return false;
}

seedAuction=function(){
 if(!s)return;s.auction=[];
 let pool=[
  ['［中階］玄霜劍（攻+15）','水寒屬性法器',4800],
  ['［高階］雷火丹','突破與戰鬥皆可用',3200],
  ['天衍殘篇','特殊功法，學習另有條件',9000],
  ['神秘妖獸蛋','可能孵化特殊種，極低機率高危種',2200],
  ['［四階］虛空石','四階空間材料',24000]
 ];
 for(let i=0;i<4;i++){let x=pick(pool);s.auction.push({name:x[0],desc:x[1],price:Math.floor(x[2]*(.9+Math.random()*.4))})}

giveAuctionItemV063=function(a){
 let n=a.name;
 if(n.includes('×2')){let base=rawMaterialNameV065(n.replace('×2',''));s.materials[base]=(s.materials[base]||0)+2}
 else if(n==='［四階］虛空石')s.materials.虛空石=(s.materials.虛空石||0)+1;
 else if(n==='完整藏寶圖')s.treasureMaps=(s.treasureMaps||0)+1;
 else if(isEggName(n))addBag(n,1,a.desc);
 else if(n.includes('訣')||n.includes('篇')){s.techInventory=s.techInventory||[];s.techInventory.push(n)}
 else _v062_addBag(n,1,a.desc);
};

function syncInitialRootRecordV066(){

 // 清除舊版在 V0.6.6 抽選前寫入的錯誤靈根紀錄。
 s.log=(s.log||[]).filter(x=>!String(x).includes('靈根覺醒'));
 if(!s.v066RootLogFixed){
   log(`🌿 靈根覺醒：主靈根【${p}靈根 ${pv}】・副靈根【${sub}靈根 ${sv}】。`);
   s.v066RootLogFixed=true;
 }
 s.root=dominantRootNameV066(s.rootAffinities);
}
