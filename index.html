<script id="rWantedLaw-v7">
'use strict';
(function(){
  /* 測試分支 V7：
     只補上已定案的「通緝值 → NPC反應／通報 → 執法戰 → 判刑進監牢」中斷鏈。
     不修改母檔版本號；未經使用者定案不得升正式母檔。
  */

  const RW_COIN_BASE={練氣:175,築基:500,金丹:1350,元嬰:3750,化神:10500,煉虛:30000,合體:90000,大乘:265000};

  function rwEnsure(){
    S.wanted=Number(S.wanted||0);
    S.evil=Number(S.evil||0);
    S.lawState=S.lawState||{
      reportedLock:null,
      posterShown500:false,
      merchantRoll:{},
      region:'東州'
    };
    S.prison=S.prison||{
      active:false,
      sentenceDays:0,
      originalSentenceDays:0,
      reason:'',
      pendingPoorPrisonerDays:0
    };
  }

  function rwNpc(name){
    try{
      return (typeof V070_NPC!=='undefined'&&V070_NPC?.[name])
        ||(typeof R511_NPC!=='undefined'&&R511_NPC?.[name])
        ||(typeof R58_NPCS!=='undefined'&&R58_NPCS?.[name])
        ||{};
    }catch(e){return {}}
  }
  function rwIdentity(p){return String(p?.identity||p?.role||'')}
  function rwPersonality(p){return String(p?.personality||'')}
  function rwIsMerchant(p){return /商人/.test(rwIdentity(p)) || !!p?.trade}
  function rwIsGuard(p){return /道衛總隊長|道衛隊長|道衛隊員|道衛/.test(rwIdentity(p))}
  function rwIsRighteous(p){return /正直|正值/.test(rwPersonality(p))}
  function rwIsCautious(p){return /謹慎/.test(rwPersonality(p))}
  function rwIsAggressive(p){return /好戰/.test(rwPersonality(p))}
  function rwWanted(){rwEnsure();return Math.max(0,Math.min(1000,Number(S.wanted||0)))}

  function rwPlayerFighter(){
    const c=typeof r4Core==='function'?r4Core():{};
    return {
      type:'player',name:S.name,
      hp:S.hp,maxhp:c.maxhp,mp:S.mp,maxmp:c.maxmp,
      atk:c.atk,dao:c.dao,def:c.def,daoDef:c.daoDef,
      agi:c.agi,hit:c.hit,
      effectHit:c.effectHit??S.effectHit??100,
      effectResist:c.effectResist??S.effectResist??100,
      critRate:c.critRate??S.critRate??5,
      critDamage:c.critDamage??S.critDamage??150,
      status:[]
    };
  }

  function rwNpcFighter(name){
    if(typeof r519HostileNpcFighter==='function'){
      const f=r519HostileNpcFighter(name,1);
      const p=rwNpc(name);
      f.realm=f.realm||p.realm||'未知';
      f.quality=f.quality||p.quality||'';
      return f;
    }
    return null;
  }
  function rwEnforcer(name){
    return typeof r546MakeEnforcementFighter==='function'?r546MakeEnforcementFighter(name):null;
  }

  function rwStartBattle(enemyTeam,lawCase){
    const enemies=(enemyTeam||[]).filter(Boolean);
    if(!enemies.length)return alert('執法人員戰鬥資料不存在，無法開始追捕戰。');
    const c=rwPlayerFighter();
    battle={
      round:1,auto:false,noRun:false,
      lawCase:{...lawCase},
      playerTeam:[c],
      enemyTeam:enemies,
      logs:[lawCase?.message||`⚠️ 執法人員攔下了${S.name}！`]
    };
    closeModal();
    showBattle();
  }

  function rwReport(name){
    rwEnsure();
    S.lawState.reportedLock={place:S.place,reporter:name,active:true};
    closeModal();
    log(`🚨 ${name}已將${S.name}通報給執法人員。所在地暫時封鎖。`);
    showModal('🚨 已遭通報',`<div class="rw-law-card"><b>${name}已將${S.name}通報給執法人員。</b><br>所在地所有設備與可前往地點暫時關閉。<br>請從冒險頁面的［遭遇捕快］進入追捕戰。</div>`);
    render();
  }

  window.rwEncounterCopper=function(){
    rwEnsure();
    const lock=S.lawState.reportedLock;
    if(!lock?.active||lock.place!==S.place)return alert('目前此地沒有正在追捕你的捕快。');
    rwStartBattle([rwEnforcer('銅牌捕快')],{
      tier:'100-249',sentence:1,reported:true,
      message:'🚨 銅牌捕快奉通報前來追捕！'
    });
  };

  function rwDirectNpcBattle(name,tier){
    const npc=rwNpcFighter(name);
    if(!npc)return alert('找不到此NPC的正式戰鬥資料。');
    if(tier==='250-499'){
      rwStartBattle([npc],{tier,sentence:3,npc:name,message:`⚠️ ${name}直接對${S.name}發起拘捕戰！`});
      return;
    }
    const medal=tier==='500-749'?'銀牌捕快':'金牌捕快';
    const extras=[rwEnforcer(medal),rwEnforcer(medal),rwEnforcer(medal)].filter(Boolean);
    /* 正式規則：互動NPC固定隨機後排1/後排2，其餘捕快補滿剩餘位置。
       現行四格陣列順序以 0..3 對應四格，因此插入索引 2 或 3。 */
    const slot=Math.random()<.5?2:3;
    const team=[...extras];
    team.splice(slot,0,npc);
    rwStartBattle(team.slice(0,4),{
      tier,
      sentence:tier==='500-749'?4:5,
      npc:name,
      message:`🚨 ${name}與${medal}×3展開追捕戰！`
    });
  }

  function rwStart1000Battle(){
    const team=[
      rwEnforcer('東州州府統領'),
      rwEnforcer('金牌捕快'),
      rwEnforcer('金牌捕快'),
      rwEnforcer('金牌捕快')
    ].filter(Boolean);
    rwStartBattle(team,{tier:'1000',sentence:7,message:'🚨 九州重犯追捕：東州州府統領＋金牌捕快×3！'});
  }

  function rwRealmCoin(realm){
    const s=String(realm||'');
    const k=Object.keys(RW_COIN_BASE).find(x=>s.includes(x));
    return k?RW_COIN_BASE[k]:0;
  }
  function rwBattleReward(enemies,fixed20=false){
    let total=0;
    for(const e of (enemies||[])){
      const base=rwRealmCoin(e?.realm);
      const rate=fixed20?.20:(.10+Math.random()*.20);
      total+=Math.floor(base*rate);
    }
    return total;
  }

  function rwAddItem(name,count){
    S.items=S.items||{};
    S.items[name]=(S.items[name]||0)+count;
  }
  function rwAwardChongLing(){
    const pieces=['［中階］忡靈頭盔','［中階］忡靈戰甲','［中階］忡靈鎖褲','［中階］忡靈戰靴'];
    S.gearInventory=S.gearInventory||{};
    const missing=pieces.filter(n=>!(S.gearInventory[n]>0)&&!Object.values(S.equipment||{}).includes(n));
    if(!missing.length)return '';
    const got=missing[0];
    S.gearInventory[got]=(S.gearInventory[got]||0)+1;
    return got;
  }

  function rwLawVictory(b){
    const law=b.lawCase||{},tier=law.tier,enemies=b.enemyTeam||[];
    const p=b.playerTeam?.[0];
    if(p){S.hp=Math.max(1,p.hp);S.mp=Math.max(0,p.mp)}
    let reward=0,extra='';

    if(tier==='100-249'){
      S.wanted=Math.min(1000,rwWanted()+40);
      reward=rwBattleReward(enemies,false);
      if(S.lawState?.reportedLock)S.lawState.reportedLock.active=false;
    }else if(tier==='250-499'){
      S.wanted=Math.min(1000,rwWanted()+80);
      reward=rwBattleReward(enemies,false);
    }else if(tier==='500-749'){
      S.wanted=Math.min(1000,rwWanted()+160);
      S.evil+=5;
      reward=rwBattleReward(enemies,false);
    }else if(tier==='750-999'){
      S.wanted=1000;
      S.evil+=30;
      reward=rwBattleReward(enemies,false);
    }else if(tier==='1000'){
      S.wanted=1;
      reward=rwBattleReward(enemies,true);
      rwAddItem('靈根精華丹',5);
      rwAddItem('陰陽丹',10);
      const piece=rwAwardChongLing();
      extra=`<br>靈根精華丹×5、陰陽丹×10${piece?`、${piece}×1`:''}`;
    }

    S.coins=Number(S.coins||0)+reward;
    battle=null;closeModal();
    log(`⚔️ 追捕戰勝利：靈幣 +${reward}；目前通緝 ${S.wanted}。`);
    render();
    showModal('⚔️ 追捕戰勝利',`<div class="rw-law-card"><b>成功擊退追捕者。</b><br>本戰不獲得修為、歷練或一般擊殺獎勵。<br>靈幣 +${reward}<br>目前通緝：${S.wanted}${extra}</div>`);
  }

  function rwSendToPrison(law){
    rwEnsure();
    let days=Math.min(7,Math.max(1,Number(law?.sentence||1)));
    let feeText='';

    if(law?.tier==='750-999'){
      if(Number(S.coins||0)>=3500){
        S.coins-=3500;feeText='強制收取3500靈幣。';
      }else{
        const take=Math.floor(Number(S.coins||0)*.5);
        S.coins=Math.max(0,Number(S.coins||0)-take);
        days=Math.min(7,days+1);
        feeText=`靈幣不足3500，扣除目前持有靈幣50%（${take}），刑期額外+1日。`;
      }
    }else if(law?.tier==='1000'){
      const had=Number(S.coins||0);
      if(had>=7000){
        S.coins=had-7000;feeText='強制收取7000靈幣。';
      }else{
        S.coins=0;
        S.prison.pendingPoorPrisonerDays=Math.max(S.prison.pendingPoorPrisonerDays||0,3);
        feeText=`無法支付7000靈幣，現有靈幣已交付；出獄後獲得［窮囚犯］3個遊戲日。`;
      }
    }

    S.prison.active=true;
    S.prison.sentenceDays=days;
    S.prison.originalSentenceDays=days;
    S.prison.reason=`通緝追捕戰敗（${law?.tier||'未知級距'}）`;
    if(S.lawState?.reportedLock)S.lawState.reportedLock.active=false;
    S.hp=1;
    const c=typeof r4Core==='function'?r4Core():{};
    S.mp=Math.max(0,Math.min(Number(S.mp||0),Number(c.maxmp||S.maxmp||0)));

    log(`⛓️ 被捕入獄：刑期${days}日。${feeText}`);
    render();
    rwOpenPrison();
  }

  function rwOpenPrison(){
    rwEnsure();
    if(!S.prison.active){
      return showModal('⛓️ 監牢','<div class="card">只有實際觸發犯罪／判刑流程時才會進入。</div>');
    }
    showModal('⛓️ 監牢・服刑中',`
      <div class="rw-prison-box">
        <b>目前刑期：${S.prison.sentenceDays}日</b><br>
        本次判刑原始刑期：${S.prison.originalSentenceDays}日<br>
        原因：${S.prison.reason||'—'}<br>
        <span class="muted">最高刑期7日。正式勞役小遊戲、越獄與出獄後狀態沿用母檔規則；本次測試分支先把「通緝→追捕→判刑→真正進入監牢狀態」接通。</span>
      </div>`);
  }
  window.rwOpenPrison=rwOpenPrison;
  window.rwSendToPrison=rwSendToPrison;
  window.rwLawVictory=rwLawVictory;

  /* 監牢設施：判刑後顯示實際刑期，不再永遠只有佔位文字。 */
  const prevFacility=facilityClick;
  facilityClick=function(x){
    rwEnsure();
    if(S.prison.active){
      if(x==='監牢')return rwOpenPrison();
      return alert('目前正在服刑，無法使用其他設施。');
    }
    const w=rwWanted();
    const lock=S.lawState?.reportedLock;
    if(lock?.active&&lock.place===S.place){
      return alert(`你／妳已被${lock.reporter}通報，禁止亂跑。`);
    }
    if(w>=750){
      if(x==='布告欄'&&w>=1000)return showModal('📜 九州通緝令',`<div class="rw-law-card"><b>${S.name}</b>已列為［九州重犯］，九州布告欄皆張貼通緝令。</div>`);
      return alert('目前通緝級距下，所有設備皆已關閉。');
    }
    if(x==='布告欄'&&w>=500){
      return showModal('📜 布告欄・通緝令',`<div class="rw-law-card"><b>${S.name}通緝令</b><br>目前通緝：${w}<br>玩家不可接取自己的通緝令。</div>`);
    }
    return prevFacility(x);
  };

  /* 通報後封鎖道路；服刑中禁止移動。 */
  const prevMoveTo=moveTo;
  moveTo=function(p){
    rwEnsure();
    if(S.prison.active)return alert('目前正在服刑，無法離開監牢。');
    const lock=S.lawState?.reportedLock;
    if(lock?.active&&lock.place===S.place)return alert(`你／妳已被${lock.reporter}通報，禁止亂跑。`);
    return prevMoveTo(p);
  };

  /* 冒險頁顯示「遭遇捕快」。 */
  const prevAdventure=renderAdventure;
  renderAdventure=function(){
    rwEnsure();
    if(S.prison.active){
      return pageHead('⛓️ 監牢','目前正在服刑。')+
        `<div class="rw-prison-box"><b>剩餘刑期：${S.prison.sentenceDays}日</b><br>${S.prison.reason||''}<br><button onclick="rwOpenPrison()">查看監牢狀態</button></div>`;
    }
    let base=prevAdventure();
    const lock=S.lawState?.reportedLock;
    if(lock?.active&&lock.place===S.place){
      base+=`<div class="rw-law-card"><b>🚨 所在地已遭封鎖</b><br>${lock.reporter}已通報執法人員。<br><button class="danger" onclick="rwEncounterCopper()">⚔️ 遭遇捕快</button></div>`;
    }
    return base;
  };

  /* 1～99 可疑：謹慎型NPC的對話改成紅框可疑對話。 */
  const prevTalk=r4NormalTalk;
  r4NormalTalk=function(name){
    const p=rwNpc(name),w=rwWanted();
    if(w>=1&&w<=99&&rwIsCautious(p)){
      const line=Math.random()<.5?'你／妳看起來有點可疑。':'你／妳是不是做了什麼事？';
      return showModal(`💬 ${name}`,`<div class="rw-law-card"><b>${name}</b><br>${line}</div><button onclick="r58NpcInteraction('${name}')">返回</button>`);
    }
    return prevTalk(name);
  };

  function rwRestrictButtons(allowed,redTalk=false){
    const root=document.getElementById('modalBody')||document.querySelector('.modal-body');
    if(!root)return;
    [...root.querySelectorAll('button')].forEach(btn=>{
      const txt=(btn.textContent||'').trim();
      if(txt.includes('返回')||txt.includes('詳細介紹'))return;
      const keep=allowed.some(k=>txt.includes(k));
      if(!keep)btn.style.display='none';
      if(redTalk&&txt.includes('對話'))btn.classList.add('rw-wanted-talk');
    });
  }
  function rwMerchantRefusal(name,p,w){
    if(!rwIsMerchant(p))return false;
    let chance=0;if(w>=500)chance=1;else if(w>=250)chance=.5;else if(w>=100)chance=.3;
    if(!chance)return false;
    const refused=Math.random()<chance;
    if(!refused)return false;
    setTimeout(()=>{
      const root=document.getElementById('modalBody')||document.querySelector('.modal-body');
      if(!root)return;
      [...root.querySelectorAll('button')].forEach(btn=>{
        const txt=(btn.textContent||'').trim();
        if(/交易|商店|購買|販賣/.test(txt)){
          btn.disabled=true;
          btn.textContent='拒絕交易';
          btn.title='商人因目前通緝狀態拒絕交易';
        }
      });
      const note=document.createElement('div');
      note.className='rw-law-card';
      note.innerHTML='<b>商人拒絕交易。</b><br>本次正式進入互動介面已完成一次拒絕判定；離開後重新進入才會再次判定。';
      root.prepend(note);
    },0);
    return true;
  }

  /* 最後包住現行 NPC 互動，保留最新張榕真等既有覆寫。 */
  const prevNpcInteraction=r58NpcInteraction;
  r58NpcInteraction=function(name){
    rwEnsure();
    if(S.prison.active)return rwOpenPrison();
    const p=rwNpc(name),w=rwWanted();

    if(w>=1000){
      /* 任務／委託永遠保留。現行資料只要此NPC具有任務入口，就只保留任務；否則直接州府追捕。 */
      const acts=Array.isArray(p.actions)?p.actions:[];
      const hasQuestEntry=acts.includes('任務／委託')||!!p.quest;
      if(!hasQuestEntry)return rwStart1000Battle();
      prevNpcInteraction(name);
      setTimeout(()=>rwRestrictButtons(['任務／委託']),0);
      return;
    }

    if(w>=750){
      if(rwIsGuard(p))return rwDirectNpcBattle(name,'750-999');
      prevNpcInteraction(name);
      setTimeout(()=>rwRestrictButtons(['任務／委託']),0);
      return;
    }

    if(w>=500){
      if(rwIsGuard(p))return rwDirectNpcBattle(name,'500-749');
      prevNpcInteraction(name);
      setTimeout(()=>{
        rwRestrictButtons(['任務／委託','偷襲','搶奪','搶劫']);
        rwMerchantRefusal(name,p,w);
      },0);
      return;
    }

    if(w>=250){
      if(rwIsGuard(p)||rwIsAggressive(p))return rwDirectNpcBattle(name,'250-499');
      prevNpcInteraction(name);
      rwMerchantRefusal(name,p,w);
      return;
    }

    if(w>=100){
      if(rwIsRighteous(p))return rwReport(name);
      prevNpcInteraction(name);
      rwMerchantRefusal(name,p,w);
      return;
    }

    prevNpcInteraction(name);
    if(w>=1&&rwIsCautious(p)){
      setTimeout(()=>rwRestrictButtons(['對話','任務／委託','偷襲','搶奪','搶劫'],true),0);
    }
  };

  /* 首次進入500+通緝級距：只提示一次；降回499以下後重置。 */
  function rwThresholdNotice(){
    rwEnsure();
    const w=rwWanted();
    if(w>=500&&!S.lawState.posterShown500){
      S.lawState.posterShown500=true;
      log(`📜 ${S.name}通緝令已被張貼布告欄。`);
      setTimeout(()=>alert(`${S.name}通緝令已被張貼布告欄。`),0);
    }else if(w<500){
      S.lawState.posterShown500=false;
    }
  }
  const prevRender=render;
  render=function(){
    rwThresholdNotice();
    return prevRender();
  };

  /* 追捕戰勝利：覆寫一般 battleWin，禁止套妖物修為/歷練/一般掉落。 */
  const prevBattleWin=battleWin;
  battleWin=function(){
    if(battle?.lawCase)return rwLawVictory(battle);
    return prevBattleWin();
  };
  window.battleWin=battleWin;

  /* 追捕戰敗：現行 enemyTurn 會先把 battle 清掉，因此先保存 lawCase，回傳後再判刑。 */
  const prevEnemyTurn=enemyTurn;
  enemyTurn=function(){
    const law=battle?.lawCase?{...battle.lawCase}:null;
    const before=battle;
    const r=prevEnemyTurn();
    if(law&&before&&!battle&&Number(S.hp||0)<=1){
      setTimeout(()=>rwSendToPrison(law),0);
    }
    return r;
  };
  window.enemyTurn=enemyTurn;

  /* 測試捷徑：只供本地驗收通緝級距，不改正常流程。 */
  window.rwTestWanted=function(v){
    rwEnsure();S.wanted=Math.max(0,Math.min(1000,Number(v)||0));
    if(S.wanted<500)S.lawState.posterShown500=false;
    log(`🧪 測試：通緝值設為 ${S.wanted}。`);render();
  };

  window.RW_WANTED_LAW_V7=true;
})();
</script>

<script id="r559-wanted-decay-v9">
'use strict';
(function(){
  /* V9 測試分支：通緝自然衰減
     新規則：
     - 連續3個遊戲日沒有再次犯罪後進入衰減期。
     - 之後每完整經過1個遊戲日，通緝值 -20。
     - 3日內若再次犯罪，3日無犯罪計時重新開始。
     - 通緝最低降至0。
     - 只接現行單州 S.wanted；未擅自擴造多州通緝資料結構。
  */

  const R559_GRACE_MINUTES = 3 * 24 * 60;
  const R559_DECAY_STEP_MINUTES = 24 * 60;
  const R559_DECAY_AMOUNT = 20;

  function r559Now(){
    try{
      return typeof r4GameMinutes==='function' ? Number(r4GameMinutes()||0) : 0;
    }catch(e){ return 0; }
  }

  function r559EnsureWantedDecay(){
    if(typeof S==='undefined' || !S)return null;
    S.wantedDecay = S.wantedDecay || {};
    const d=S.wantedDecay;
    if(!Number.isFinite(d.lastCrimeAt)) d.lastCrimeAt = r559Now();
    if(!Number.isFinite(d.lastDecayAt)) d.lastDecayAt = d.lastCrimeAt + R559_GRACE_MINUTES;
    if(!Number.isFinite(d.lastSeenWanted)) d.lastSeenWanted = Number(S.wanted||0);
    return d;
  }

  function r559ResetCrimeTimer(reason='犯罪'){
    const d=r559EnsureWantedDecay();
    if(!d)return;
    const now=r559Now();
    d.lastCrimeAt=now;
    /* 先完整等待3日；第3日結束後才開始計算「每經過1日 -20」 */
    d.lastDecayAt=now + R559_GRACE_MINUTES;
    d.lastSeenWanted=Number(S.wanted||0);
    d.lastCrimeReason=reason;
    d.lastCrimeResetAt=now;
  }
  window.r559ResetCrimeTimer=r559ResetCrimeTimer;

  function r559ProcessWantedDecay(){
    const d=r559EnsureWantedDecay();
    if(!d)return;
    let wanted=Math.max(0,Number(S.wanted||0));
    const now=r559Now();

    if(wanted<=0){
      S.wanted=0;
      d.lastSeenWanted=0;
      return;
    }

    const graceEnd=Number(d.lastCrimeAt||0)+R559_GRACE_MINUTES;
    if(now<=graceEnd){
      d.lastSeenWanted=wanted;
      return;
    }

    /* lastDecayAt = 無犯罪3日的終點。
       只有再完整經過1日才扣第一次20，所以第一扣發生在第4個完整無犯罪遊戲日。 */
    const base=Math.max(graceEnd,Number(d.lastDecayAt||graceEnd));
    const elapsed=now-base;
    if(elapsed < R559_DECAY_STEP_MINUTES){
      d.lastSeenWanted=wanted;
      return;
    }

    const steps=Math.floor(elapsed/R559_DECAY_STEP_MINUTES);
    if(steps<=0)return;

    const before=wanted;
    wanted=Math.max(0,wanted - steps*R559_DECAY_AMOUNT);
    S.wanted=wanted;
    d.lastDecayAt=base + steps*R559_DECAY_STEP_MINUTES;
    d.lastSeenWanted=wanted;

    const reduced=before-wanted;
    if(reduced>0){
      try{ log(`📉 已連續3個遊戲日未再次犯罪；通緝自然衰減 ${before} → ${wanted}（-${reduced}）。`); }catch(e){}
    }
  }
  window.r559ProcessWantedDecay=r559ProcessWantedDecay;

  /* 所有正常遊戲時間推進後檢查衰減。 */
  const r559PrevAdvance = r4AdvanceMinutes;
  r4AdvanceMinutes=function(mins,opt={}){
    const r=r559PrevAdvance(mins,opt);
    try{r559ProcessWantedDecay()}catch(e){console.error(e)}
    return r;
  };

  /* 偷襲：確認發動即屬犯罪，重置3日計時。 */
  if(typeof r519ConfirmAmbush==='function'){
    const prev=r519ConfirmAmbush;
    r519ConfirmAmbush=function(name){
      const before=Number(S?.wanted||0);
      const r=prev(name);
      const after=Number(S?.wanted||0);
      if(after>before)r559ResetCrimeTimer('偷襲');
      return r;
    };
    window.r519ConfirmAmbush=r519ConfirmAmbush;
  }

  /* 搶奪：依現行規則只有成功後才增加通緝，因此成功增加通緝時重置。 */
  if(typeof r519ConfirmSteal==='function'){
    const prev=r519ConfirmSteal;
    r519ConfirmSteal=function(name){
      const before=Number(S?.wanted||0);
      const r=prev(name);
      const after=Number(S?.wanted||0);
      if(after>before)r559ResetCrimeTimer('搶奪');
      return r;
    };
    window.r519ConfirmSteal=r519ConfirmSteal;
  }

  /* 搶劫：現行正式覆寫入口是 window.r519ConfirmRobbery。 */
  if(typeof window.r519ConfirmRobbery==='function'){
    const prev=window.r519ConfirmRobbery;
    window.r519ConfirmRobbery=function(name){
      const before=Number(S?.wanted||0);
      const r=prev(name);
      const after=Number(S?.wanted||0);
      if(after>before)r559ResetCrimeTimer('搶劫');
      return r;
    };
    try{r519ConfirmRobbery=window.r519ConfirmRobbery}catch(e){}
  }

  /* 追捕戰勝利若使通緝上升，也視為再次犯罪/抗拒執法，重新計時。
     1000級勝利會把通緝降為1，不視為「再次犯罪增加通緝」。 */
  if(typeof battleWin==='function'){
    const prev=battleWin;
    battleWin=function(){
      const before=Number(S?.wanted||0);
      const wasLaw=!!battle?.lawCase;
      const r=prev();
      const after=Number(S?.wanted||0);
      if(wasLaw && after>before)r559ResetCrimeTimer('抗拒執法');
      return r;
    };
    window.battleWin=battleWin;
  }

  /* 測試999直接切通緝值時，從該刻開始計算3日，
     避免測試值被舊計時器立刻衰減。 */
  if(typeof window.r558SetWanted==='function'){
    const prev=window.r558SetWanted;
    window.r558SetWanted=function(v){
      const r=prev(v);
      r559ResetCrimeTimer('測試999設定通緝值');
      return r;
    };
  }

  /* 清除測試時同步清理衰減狀態。 */
  if(typeof window.r558ClearLawTest==='function'){
    const prev=window.r558ClearLawTest;
    window.r558ClearLawTest=function(){
      const r=prev();
      if(S)S.wantedDecay={
        lastCrimeAt:r559Now(),
        lastDecayAt:r559Now()+R559_GRACE_MINUTES,
        lastSeenWanted:0
      };
      return r;
    };
  }

  /* 額外提供測試999「時間快進」方便驗收，不影響一般流程。 */
  window.r559DebugAdvanceDays=function(days){
    days=Math.max(1,Math.floor(Number(days)||1));
    if(typeof S==='undefined'||!S)return;
    r4AdvanceMinutes(days*1440,{effective:false});
    try{render()}catch(e){}
    const d=r559EnsureWantedDecay();
    const now=r559Now();
    const since=Math.max(0,now-Number(d.lastCrimeAt||now));
    alert(`已快進 ${days} 個遊戲日。\n目前通緝：${Number(S.wanted||0)}\n距最近犯罪：${Math.floor(since/1440)}日 ${Math.floor((since%1440)/60)}小時`);
  };

  /* 擴充現有測試999視窗：加入通緝衰減測試區。 */
  if(typeof window.r548OpenDebug999==='function'){
    const prev=window.r548OpenDebug999;
    window.r548OpenDebug999=function(){
      prev();
      setTimeout(()=>{
        const body=document.getElementById('modalBody');
        if(!body || body.querySelector('.r559-decay-debug'))return;
        const box=document.createElement('div');
        box.className='card r559-decay-debug';
        box.innerHTML=`
          <b>📉 通緝自然衰減測試</b>
          <div class="small muted" style="margin:6px 0 8px">
            連續3個遊戲日無再次犯罪後，之後每完整1個遊戲日通緝-20；再次犯罪會重新計算3日。
          </div>
          <div class="actions">
            <button onclick="r559DebugAdvanceDays(1)">快進1日</button>
            <button onclick="r559DebugAdvanceDays(3)">快進3日</button>
            <button onclick="r559DebugAdvanceDays(4)">快進4日</button>
            <button onclick="r559DebugAdvanceDays(7)">快進7日</button>
          </div>`;
        body.appendChild(box);
      },0);
    };
  }

  /* 讀舊存檔／進遊戲時補初始值。 */
  try{r559EnsureWantedDecay();r559ProcessWantedDecay()}catch(e){}

  window.R559_WANTED_DECAY_V9=true;
})();
</script>
