<script id="battle-detail-v2-fix-script">
'use strict';
(function(){
  function cleanName(x){
    return String(x?.name||'未命名').replace(/^【[^】]+】/,'').trim()||'未命名';
  }
  function num(v){
    const n=Number(v);return Number.isFinite(n)?Math.round(n):0;
  }
  function isPlayerUnit(x){
    const n=cleanName(x);
    return x?.type==='player'||n===String(S?.name||'').trim();
  }
  function realmOf(x,enemy){
    if(!enemy && isPlayerUnit(x)) return String(S?.realm||'未知');
    if(!enemy){
      const n=cleanName(x);
      const npc=(typeof R511_NPC!=='undefined'&&R511_NPC)?(R511_NPC[n]||{}):{};
      return String(x?.realm||npc?.realm||x?.levelName||x?.境界||'未知');
    }
    return String(x?.realm||x?.levelName||x?.境界||'未知');
  }
  function powerOf(x){
    const preset=Number(x?.combatPower ?? x?.battlePower ?? x?.戰鬥力);
    if(Number.isFinite(preset)&&preset>0)return Math.round(preset);
    const hp=num(x?.maxhp||x?.hp),mp=num(x?.maxmp||x?.mp);
    return Math.max(1,Math.round(hp*.25+mp*.2+num(x?.atk)*5+num(x?.def)*4+num(x?.agi)*3+num(x?.hit)*3));
  }
  function enemyType(x){
    const s=String(x?.tier||x?.species||x?.type||x?.category||'');
    if(/災獸/.test(s))return '災獸';
    if(/神獸/.test(s))return '神獸';
    if(/妖王/.test(s))return '妖王';
    if(/高危/.test(s))return '高危';
    if(/高位/.test(s))return '高位';
    if(/特殊/.test(s))return '特殊';
    if(/精英/.test(s))return '精英';
    if(/稀有/.test(s))return '稀有';
    return '一般';
  }
  function allyMainRoot(x){
    if(isPlayerUnit(x)) return String(S?.mainRoot||'無');
    const n=cleanName(x);
    const npc=(typeof R511_NPC!=='undefined'&&R511_NPC)?(R511_NPC[n]||{}):{};
    const raw=String(x?.mainRoot||x?.root||x?.roots||npc?.roots||'無');
    const m=raw.match(/主\s*([^／/、\s]+)|^([^／/、\s]+)$/);
    return (m?.[1]||m?.[2]||raw||'無').replace(/靈根$/,'');
  }
  function enemyAttr(x){
    try{
      if(typeof bsv2MonsterElements==='function'){
        const a=bsv2MonsterElements(x);
        if(Array.isArray(a)&&a.length)return a.join('／');
      }
    }catch(e){}
    const raw=x?.attr||x?.element||x?.root||x?.roots||'無屬性';
    if(Array.isArray(raw))return raw.join('／');
    return String(raw).replaceAll('/','／');
  }
  function esc(s){
    return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));
  }
  function skillRows(x){
    let raw=x?.skills||x?.techniques||x?.skill||[];
    if(!Array.isArray(raw)) raw=typeof raw==='string'?raw.split(/[、,，/]/).map(s=>s.trim()).filter(Boolean):[];
    return raw.map(v=>{
      if(typeof v==='string'){
        const maps=x?.skillDescriptions||x?.skillDesc||x?.skillDetails||{};
        const d=(maps&&typeof maps==='object')?maps[v]:'';
        return {name:v,desc:d||'此技能目前妖物資料只記錄了技能名稱，傷害倍率、異常狀態機率等數值尚未設定。'};
      }
      const name=v?.name||v?.title||'未命名技能';
      const parts=[];
      const text=v?.desc||v?.description||v?.effect||v?.text||v?.detail;
      if(text)parts.push(String(text));
      const mult=Number(v?.multiplier??v?.damageMultiplier??v?.damageRate);
      if(Number.isFinite(mult)&&mult>0)parts.push(`造成攻擊力 ${Math.round(mult*100)}% 的傷害`);
      const pct=Number(v?.damagePercent??v?.damagePct);
      if(Number.isFinite(pct)&&pct>0)parts.push(`造成 ${Math.round(pct)}% 傷害`);
      const status=v?.status||v?.ailment||v?.debuff;
      const chance=Number(v?.chance??v?.statusChance);
      if(status){
        parts.push(Number.isFinite(chance)&&chance>0?`${Math.round(chance)}% 機率造成「${status}」`:`附帶「${status}」效果`);
      }
      return {name,desc:parts.length?parts.join('；'):'此技能目前尚未提供技能敘述與數值。'};
    });
  }
  function card(x,enemy){
    if(!x)return '';
    const skills=enemy?skillRows(x):[];
    const skillHtml=enemy?`<div class="bsv2-detail-skills"><b>技能</b><div class="bsv2-skill-list">${skills.length?skills.map((s,i)=>`<button class="bsv2-skill-btn" onclick="bsv2ToggleSkillDetail(this)">${esc(s.name)}</button><div class="bsv2-skill-desc"><b>${esc(s.name)}</b><br>${esc(s.desc)}</div>`).join(''):'<span>無／未知</span>'}</div></div>`:'';
    return `<div class="bsv2-detail-unit ${enemy?'enemy':'ally'}">
      <div class="bsv2-detail-name"><span>${esc(cleanName(x))}</span>${enemy?`<span class="bsv2-detail-tag">${esc(enemyType(x))}</span>`:''}</div>
      <div class="bsv2-detail-grid">
        <span>攻　<b>${num(x.atk)}</b></span>
        <span>防　<b>${num(x.def)}</b></span>
        <span>身　<b>${num(x.agi)}</b></span>
        <span>命　<b>${num(x.hit)}</b></span>
        <span>境界　<b>${esc(realmOf(x,enemy))}</b></span>
        <span>戰鬥力　<b>${powerOf(x)}</b></span>
        <span class="bsv2-detail-extra">${enemy?'屬性':'主靈根'}　<b>${esc(enemy?enemyAttr(x):allyMainRoot(x))}</b></span>
      </div>
      ${skillHtml}
    </div>`;
  }
  function unique(list){const out=[];(list||[]).forEach(x=>{if(x&&!out.includes(x))out.push(x)});return out;}
  function panel(b){
    const allies=unique(b?.playerTeam||[]),enemies=unique(b?.enemyTeam||[]);
    return `<aside class="bsv2-detail-panel">
      <div class="bsv2-detail-head"><span>戰鬥詳情</span><small>即時數值</small></div>
      <div class="bsv2-detail-scroll">
        <section class="bsv2-detail-section ally"><div class="bsv2-detail-section-title">我方</div>${allies.length?allies.map(x=>card(x,false)).join(''):'<div class="bsv2-detail-empty">目前沒有我方角色資料</div>'}</section>
        <section class="bsv2-detail-section enemy"><div class="bsv2-detail-section-title">敵方</div>${enemies.length?enemies.map(x=>card(x,true)).join(''):'<div class="bsv2-detail-empty">目前沒有敵方資料</div>'}</section>
      </div>
    </aside>`;
  }
  window.bsv2ToggleSkillDetail=function(btn){
    const wrap=btn?.closest('.bsv2-skill-list'); if(!wrap)return;
    const desc=btn.nextElementSibling; if(!desc)return;
    const was=desc.classList.contains('open');
    wrap.querySelectorAll('.bsv2-skill-desc.open').forEach(x=>x.classList.remove('open'));
    if(!was)desc.classList.add('open');
  };

  /* 再包一層目前已存在的 bmv1UI，僅替換左側詳情面板。 */
  if(typeof window.bmv1UI==='function'){
    const prev=window.bmv1UI;
    window.bmv1UI=function(b){
      let out=prev(b);
      if(!out)return out;
      out=out.replace(/<aside class="bsv2-detail-panel">[\s\S]*?<\/aside>/,panel(b));
      return out;
    };
  }
})();
</script>

<script id="battle-r526-system-upgrade-script">
'use strict';
(function(){
  /* ---------- 共用 ---------- */
  function esc526(s){
    return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));
  }
  function ensureCfg526(){
    if(typeof r58Ensure==='function') r58Ensure();
    S.autoBattleConfig=S.autoBattleConfig||{};
    if(typeof S.autoBattleConfig.enterAuto!=='boolean'){
      S.autoBattleConfig.enterAuto=false;
    }
    S.settings=S.settings||{};
  }
  function normalizeEnemy526(x){
    if(!x)return x;
    const y=JSON.parse(JSON.stringify(x));
    const hp=Number(y.hp||0),mp=Number(y.mp||0);
    if(!(Number(y.maxhp)>0))y.maxhp=Math.max(1,hp);
    if(!(Number(y.maxmp)>=0))y.maxmp=Math.max(0,mp);
    y.hp=Math.min(y.maxhp,Math.max(0,hp));
    y.mp=Math.min(y.maxmp,Math.max(0,mp));
    return y;
  }
  function normalizeBattle526(){
    if(!battle)return;
    (battle.enemyTeam||[]).forEach(x=>{
      if(!(Number(x.maxhp)>0))x.maxhp=Math.max(1,Number(x.hp||1));
      if(!(Number(x.maxmp)>=0))x.maxmp=Math.max(0,Number(x.mp||0));
      x.hp=Math.max(0,Math.min(x.maxhp,Number(x.hp||0)));
      x.mp=Math.max(0,Math.min(x.maxmp,Number(x.mp||0)));
    });
    (battle.playerTeam||[]).forEach(x=>{
      if(!(Number(x.maxhp)>0))x.maxhp=Math.max(1,Number(x.hp||1));
      if(!(Number(x.maxmp)>=0))x.maxmp=Math.max(0,Number(x.mp||0));
      x.hp=Math.max(0,Math.min(x.maxhp,Number(x.hp||0)));
      x.mp=Math.max(0,Math.min(x.maxmp,Number(x.mp||0)));
    });
  }

  /* ---------- 1. 進場自動 / 手動，真的影響 startBattle ---------- */
  const prevStartBattle526 = window.startBattle;
  window.startBattle=function(mon){
    ensureCfg526();
    const prepared=Array.isArray(mon)?mon.map(normalizeEnemy526):normalizeEnemy526(mon);
    const oldAuto=S.settings.autoBattle;
    S.settings.autoBattle=!!S.autoBattleConfig.enterAuto;
    try{
      return prevStartBattle526(prepared);
    }finally{
      S.settings.autoBattle=oldAuto;
    }
  };

  /* 設定介面：保留原自動戰鬥細項，再加進場模式 */
  function openSettings526(){
    ensureCfg526();
    const c=S.autoBattleConfig, learned=S.techniques||[];
    showModal('⚙️ 設定－自動戰鬥',`
      <div class="settings-section">
        <b>進入戰鬥時的初始模式</b><br>
        <label style="display:inline-flex;align-items:center;gap:5px;margin-right:14px">
          <input type="radio" name="r526EnterAuto" ${c.enterAuto?'':'checked'}
            onchange="S.autoBattleConfig.enterAuto=false"> 進場手動
        </label>
        <label style="display:inline-flex;align-items:center;gap:5px">
          <input type="radio" name="r526EnterAuto" ${c.enterAuto?'checked':''}
            onchange="S.autoBattleConfig.enterAuto=true"> 進場自動
        </label>
        <div class="small muted">只決定「剛進戰鬥」要不要立刻自動行動；戰鬥中仍可用下方按鈕隨時切換。</div>
      </div>

      <div class="settings-section">
        <b>自動使用功法</b><br>
        <label><input type="checkbox" ${c.useTech?'checked':''} onchange="S.autoBattleConfig.useTech=this.checked"> 開啟</label>
        <div class="small muted">依設定順位施放，靈力不足時跳過；最多10招。</div>
        <div>${(c.techOrder||[]).map((n,i)=>`
          <div class="tech-order-row">
            <span>${i+1}. ${esc526(n)}</span>
            <button onclick="r58TechMove(${i},-1)">↑</button>
            <button onclick="r58TechMove(${i},1)">↓</button>
            <button onclick="r58TechRemove(${i})">移除</button>
          </div>`).join('')||'<div class="muted">尚未設定功法順位。</div>'}</div>
        <select id="r58TechAdd">
          <option value="">選擇已學功法</option>
          ${learned.filter(n=>!(c.techOrder||[]).includes(n)).map(n=>`<option>${esc526(n)}</option>`).join('')}
        </select>
        <button onclick="r58TechAdd()">加入順位</button>
      </div>

      <div class="settings-section">
        <b>自動使用恢復類丹藥</b><br>
        <label><input type="checkbox" ${c.useRestorePill?'checked':''} onchange="S.autoBattleConfig.useRestorePill=this.checked"> 開啟</label>
      </div>

      <div class="settings-section">
        <b>自動使用藥水</b><br>
        <label><input type="checkbox" ${c.usePotion?'checked':''} onchange="S.autoBattleConfig.usePotion=this.checked"> 開啟</label><br>
        氣血低於 <input type="number" min="1" max="99" value="${c.hpThreshold??50}"
          onchange="S.autoBattleConfig.hpThreshold=clamp(+this.value,1,99)" style="width:70px"> %<br>
        靈力低於 <input type="number" min="1" max="99" value="${c.mpThreshold??50}"
          onchange="S.autoBattleConfig.mpThreshold=clamp(+this.value,1,99)" style="width:70px"> %<br>
        <label><input type="checkbox" ${c.preferDual?'checked':''}
          onchange="S.autoBattleConfig.preferDual=this.checked"> 同時缺血／靈時優先雙補</label>
      </div>

      <div class="settings-section">
        <b>自動戰鬥速度</b><br>
        <select onchange="S.autoBattleConfig.speed=this.value">

        </select>
      </div>
    `);
  }
  window.r526OpenAutoBattleSettings=openSettings526;
  window.r58OpenSettings=openSettings526;
  window.r592OpenSettings=openSettings526;

  setTimeout(()=>{
    try{
      if(typeof r592RebindButton==='function'){
        r592RebindButton('settingsBtn',openSettings526);
      }else{
        const old=document.getElementById('settingsBtn');
        if(old){
          const fresh=old.cloneNode(true);
          old.replaceWith(fresh);
          fresh.addEventListener('click',openSettings526);
        }
      }
    }catch(e){}
  },0);

  /* ---------- 3. 功法四分頁 ---------- */
  function techCategory526(d){
    const t=String(d?.type||d?.category||'攻擊');
    if(/治療|恢復|回復|療癒/.test(t))return '治療';
    if(/防禦|護盾|格擋|防守/.test(t))return '防禦';
    if(/輔助|增益|減益|控制|狀態/.test(t))return '輔助';
    return '攻擊';
  }
  function closeBattlePop526(){
    document.querySelectorAll('.r526-battle-pop').forEach(x=>x.remove());
  }
  window.r526CloseBattlePop=closeBattlePop526;

  window.r526OpenTechniqueTab=function(tab){
    if(!battle)return;
    closeBattlePop526();
    const learned=S.techniques||[];
    const cats=['攻擊','防禦','輔助','治療'];
    const rows=learned.filter(n=>techCategory526(TECH_DB?.[n])===tab);
    const canvas=document.querySelector('.bmv1-canvas');if(!canvas)return;
    const panel=document.createElement('div');
    panel.className='r526-battle-pop';
    panel.innerHTML=`<div class="r526-battle-pop-head"><span>📖 功法選擇</span><button onclick="r526CloseBattlePop()">✕</button></div>
      <div class="r526-battle-pop-body">
        <div class="r526-tech-tabs">${cats.map(c=>`<button class="${c===tab?'active':''}" onclick="r526OpenTechniqueTab('${c}')">${c}</button>`).join('')}</div>
        ${rows.length?rows.map(n=>{
          const d=TECH_DB[n]||{},cost=Number(d.cost||0);
          return `<div class="r526-tech-entry"><div><b>${esc526(n)}</b>
            <div class="r526-tech-meta">${esc526(d.attr||'無屬性')}・${esc526(d.type||tab)}・靈力 ${cost}<br>${esc526(d.desc||'尚未設定敘述')}</div>
            </div><button ${battle.playerTeam[0].mp<cost?'disabled':''} onclick="r526UseTechnique('${String(n).replaceAll("'","\\'")}')">使用</button></div>`;
        }).join(''):'<div class="r526-empty">目前沒有這個分類的已學功法。</div>'}
      </div>`;
    canvas.appendChild(panel);
  };

  window.battleTechnique=function(){
    if(!battle)return;
    if(!(S.techniques||[]).length){
      battle.logs.push('目前尚未學會可使用的正式功法。');
      showBattle();return;
    }
    r526OpenTechniqueTab('攻擊');
  };

  window.r526UseTechnique=function(name){
    if(!battle)return;
    const p=battle.playerTeam[0],d=TECH_DB?.[name];
    if(!p||!d)return;
    const cost=Math.max(0,Number(d.cost||0));
    if(p.mp<cost){
      battle.logs.push(`${p.name}想施展${name}，但靈力不足。`);
      closeBattlePop526();showBattle();return;
    }
    p.mp-=cost;
    const cat=techCategory526(d);
    if(cat==='攻擊'){
      const e=battle.enemyTeam.find(x=>x.hp>0);
      if(!e){closeBattlePop526();return;}
      const dmg=(typeof r55TechniqueDamage==='function')
        ?Math.max(1,Math.floor(r55TechniqueDamage(p.atk,e.def)*(Number(d.power||1))))
        :Math.max(1,Math.floor(calcDamage(p,e,Number(d.power||1))));
      const before=e.hp;
      e.hp=Math.max(0,e.hp-dmg);
      battle.logs.push(`${p.name}施展${name}（消耗${cost}靈力），對${e.name}造成${dmg}傷害；${e.name}氣血 ${before} → ${e.hp}。`);
      if(e.hp<=0){
        closeBattlePop526();
        battleWin();
        return;
      }
    }else if(cat==='治療'){
      const heal=Math.max(1,Math.floor(Number(d.heal||d.healFlat||p.atk)));
      const before=p.hp;
      p.hp=Math.min(p.maxhp,p.hp+heal);
      battle.logs.push(`${p.name}施展${name}（消耗${cost}靈力），氣血 ${before} → ${p.hp}。`);
    }else if(cat==='防禦'){
      p._r526Guard=true;
      battle.logs.push(`${p.name}施展${name}（消耗${cost}靈力），進入功法防禦狀態。`);
    }else{
      battle.logs.push(`${p.name}施展${name}（消耗${cost}靈力）。${d.desc?` ${d.desc}`:''}`);
    }
    closeBattlePop526();
    enemyTurn();
    if(battle){
      battle.round=(battle.round||1)+1;
      showBattle();
    }
  };

  /* ---------- 4. 戰鬥背包改成小面板 ---------- */
  window.r58BattleBag=function(){
    if(!battle)return;
    closeBattlePop526();
    const hp=S.items?.['［初階］氣血藥水']||0;
    const mp=S.items?.['［初階］靈力藥水']||0;
    const canvas=document.querySelector('.bmv1-canvas');if(!canvas)return;
    const panel=document.createElement('div');
    panel.className='r526-battle-pop small';
    panel.innerHTML=`<div class="r526-battle-pop-head"><span>🎒 戰鬥背包</span><button onclick="r526CloseBattlePop()">✕</button></div>
      <div class="r526-battle-pop-body">
        <div class="r526-bag-grid">
          <div class="r526-bag-item"><b>［初階］氣血藥水</b><br>持有 ${hp}<br><button ${hp?'':'disabled'} onclick="r58UseBattlePotion('hp')">使用</button></div>
          <div class="r526-bag-item"><b>［初階］靈力藥水</b><br>持有 ${mp}<br><button ${mp?'':'disabled'} onclick="r58UseBattlePotion('mp')">使用</button></div>
        </div>
      </div>`;
    canvas.appendChild(panel);
  };

  const oldUsePotion526=window.r58UseBattlePotion;
  window.r58UseBattlePotion=function(type){
    closeBattlePop526();
    return oldUsePotion526(type);
  };

  /* ---------- 6. 妖物技能 ---------- */
  function skillInfo526(e,s){
    if(s&&typeof s==='object'){
      return {
        name:s.name||s.title||'妖物技能',
        cost:Math.max(0,Number(s.cost??s.mpCost??8)),
        power:Number(s.power??s.multiplier??1.15),
        heal:Number(s.heal??s.healFlat??0),
        status:s.status||s.ailment||s.debuff||'',
        chance:Number(s.chance??s.statusChance??0)
      };
    }
    const name=String(s||'妖物技能');
    let cost=8,power=1.15,heal=0,status='',chance=0;
    /* 僅作現有字串技能的戰鬥執行預設；正式技能資料若提供數值會優先覆蓋。 */
    if(/飲水|治療|恢復|回復/.test(name)){cost=10;power=0;heal=Math.max(12,Math.floor((e.maxhp||e.hp||1)*.12));}
    if(/雷擊|雷牙|雷喙/.test(name)){cost=10;power=1.2;status='麻痺';chance=25;}
    if(/纏繞|蛛絲/.test(name)){cost=9;power=.9;status='束縛';chance=30;}
    if(/翠粉|靈粉/.test(name)){cost=9;power=.9;status='失明';chance=25;}
    if(/角擊|轟泥|用力|噴水|青木擊|蛇咬|撞擊|風羽|火息/.test(name)){cost=8;power=1.15;}
    const map=e?.skillDetails||e?.skillData||e?.skillDescriptions||{};
    const spec=(map&&typeof map==='object')?map[name]:null;
    if(spec&&typeof spec==='object'){
      cost=Math.max(0,Number(spec.cost??spec.mpCost??cost));
      power=Number(spec.power??spec.multiplier??power);
      heal=Number(spec.heal??spec.healFlat??heal);
      status=spec.status||spec.ailment||status;
      chance=Number(spec.chance??spec.statusChance??chance);
    }
    return {name,cost,power,heal,status,chance};
  }

  function chooseEnemySkill526(e){
    let raw=e?.skills||e?.techniques||[];
    if(!Array.isArray(raw))raw=typeof raw==='string'?raw.split(/[、,，/]/).map(s=>s.trim()).filter(Boolean):[];
    const usable=raw.map(s=>skillInfo526(e,s)).filter(s=>e.mp>=s.cost);
    if(!usable.length)return null;
    if(Math.random()>=.62)return null;
    return usable[Math.floor(Math.random()*usable.length)];
  }

  window.enemyTurn=function(){
    const b=battle;if(!b)return;
    const p=b.playerTeam.find(x=>x.hp>0);
    const e=b.enemyTeam.find(x=>x.hp>0);
    if(!p||!e)return;

    const sk=chooseEnemySkill526(e);
    if(sk){
      const mpBefore=e.mp;
      e.mp=Math.max(0,e.mp-sk.cost);
      if(sk.heal>0){
        const before=e.hp;
        e.hp=Math.min(e.maxhp||e.hp,e.hp+sk.heal);
        b.logs.push(`${e.name}使用技能【${sk.name}】，消耗${sk.cost}靈力（${mpBefore} → ${e.mp}），回復${e.hp-before}氣血；氣血 ${before} → ${e.hp}。`);
      }else{
        let dmg=Math.max(1,Math.floor(calcDamage(e,p,Number.isFinite(sk.power)?sk.power:1.15)));
        if(p._r526Guard){dmg=Math.max(1,Math.floor(dmg*.5));p._r526Guard=false;}
        const before=p.hp;
        p.hp=Math.max(0,p.hp-dmg);
        let extra='';
        if(sk.status&&sk.chance>0&&Math.random()*100<sk.chance){
          p.status=p.status||[];
          if(!p.status.includes(sk.status))p.status.push(sk.status);
          extra=`，並造成「${sk.status}」`;
        }
        b.logs.push(`${e.name}使用技能【${sk.name}】，消耗${sk.cost}靈力（${mpBefore} → ${e.mp}），對${p.name}造成${dmg}傷害${extra}；${p.name}氣血 ${before} → ${p.hp}。`);
      }
    }else{
      let dmg=calcDamage(e,p,.95);
      if(p._r526Guard){dmg=Math.max(1,Math.floor(dmg*.5));p._r526Guard=false;}
      const before=p.hp;
      p.hp=Math.max(0,p.hp-dmg);
      b.logs.push(`${e.name}普通攻擊，對${p.name}造成${dmg}傷害；${p.name}氣血 ${before} → ${p.hp}。`);
    }

    if(p.hp<=0){
      S.hp=1;
      S.mp=b.playerTeam[0]?.mp||0;
      battle=null;
      closeModal();
      log('💀 戰敗，戰鬥結束後回到1氣血。');
      render();
    }
  };

  /* 防禦也改走新版 enemyTurn，確保妖物可以用技能 */
  window.r519BattleDefend=function(){
    const b=battle;if(!b)return;
    const p=b.playerTeam[0];if(!p)return;
    p._r526Guard=true;
    b.logs.push(`${p.name}進入防禦姿態，下一次受到的直接傷害減半。`);
    enemyTurn();
    if(battle){
      b.round=(b.round||1)+1;
      showBattle();
    }
  };

  /* ---------- 2 + 7. 即時血條 / 即時紀錄 ---------- */
  const prevAttack526=window.battleAttack;
  window.battleAttack=function(){
    if(!battle)return;
    normalizeBattle526();
    return prevAttack526();
  };

  /* 自動功法也要完整寫入日誌並刷新 */
  window.r58UseTechniqueName=function(name){
    if(!battle)return false;
    const p=battle.playerTeam[0],e=battle.enemyTeam.find(x=>x.hp>0),d=TECH_DB?.[name];
    if(!e||!d)return false;
    const cost=Math.max(0,Number(d.cost||5));
    if(p.mp<cost)return false;
    p.mp-=cost;
    const dmg=(typeof r55TechniqueDamage==='function')
      ?Math.max(1,Math.floor(r55TechniqueDamage(p.atk,e.def)*(Number(d.power||1))))
      :Math.max(1,Math.floor(calcDamage(p,e,Number(d.power||1))));
    const before=e.hp;
    e.hp=Math.max(0,e.hp-dmg);
    battle.logs.push(`${p.name}自動施展${name}（消耗${cost}靈力），對${e.name}造成${dmg}傷害；${e.name}氣血 ${before} → ${e.hp}。`);
    if(e.hp<=0){battleWin();return true;}
    enemyTurn();
    if(battle)battle.round=(battle.round||1)+1;
    return true;
  };

  /* 最後覆寫 showBattle：每次渲染前校正 maxhp/maxmp，確保血條寬度真的改 */
  window.showBattle=function(){
    const b=battle;if(!b)return;
    normalizeBattle526();
    closeBattlePop526();
    showModal('⚔️ 戰鬥',bmv1UI(b));
    const back=document.getElementById('modalBack');
    if(back)back.classList.add('bmv1-active','battle-locked');
    requestAnimationFrame(()=>{
      if(typeof bmv1Scale==='function')bmv1Scale();
      const logBody=document.querySelector('.bmv1-log-body');
      if(logBody)logBody.scrollTop=logBody.scrollHeight;
    });

    if(b.auto){
      setTimeout(()=>{
        if(battle&&battle.auto){
          (typeof r58AutoStep==='function'?r58AutoStep():battleAttack());
        }
      },S.autoBattleConfig?.speed==='fast'?220:450);
    }
  };

  /* 戰鬥中手動切換，不改「下次進場」設定 */
  window.toggleAutoBattle=function(){
    if(!battle)return;
    battle.auto=!battle.auto;
    battle.logs.push(battle.auto?'已切換為自動戰鬥。':'已切換為手動戰鬥。');
    showBattle();
  };

  window.R526_BATTLE_SYSTEM_UPGRADE=true;
})();
</script>

<script id="r526-fix15-script">
'use strict';
(function(){

/* =========================================================
   A. 妖物正式資料修正
   只改使用者已明確指定的屬性 / 技能名稱。
   不自行新增未定案倍率、機率、MP成本。
   ========================================================= */
function r526FindMonster(name){
  for(const arr of Object.values(EAST_MONSTERS||{})){
    const m=(arr||[]).find(x=>x.name===name);
    if(m)return m;
  }
  return null;
}
const R526_MONSTER_CANON={
  '青木狼':{attr:'木',skill:'揮擊'},
  '青靈蛇':{attr:'木',skill:'咬咬'},
  '青翠蝶':{attr:'木',skill:'翅擊'},
  '青臭蟲':{attr:'木',skill:'放屁',note:'有機率中毒'},
  '朝東鳥':{attr:'風',skill:'鳥啄'},
  '重翅蝶':{attr:'土',skill:'撲粉',note:'有機率睡眠'},
  '朝陽狐':{attr:'土',skill:'尾擊'}
};
for(const [name,d] of Object.entries(R526_MONSTER_CANON)){
  const m=r526FindMonster(name);

  m.attr=d.attr;
  m.skills=[d.skill];
  m.skillDescriptions=m.skillDescriptions||{};
  if(d.note)m.skillDescriptions[d.skill]=d.note+'（實際機率沿用正式資料，未在此自行補造數值）';
}

/* =========================================================
   B. 設定－自動戰鬥：補回明確關閉按鈕
   ========================================================= */
const _r526PrevOpenAutoSettings = window.r526OpenAutoBattleSettings || window.r58OpenSettings || window.r592OpenSettings;
function r526OpenAutoSettingsFixed(){
  if(typeof _r526PrevOpenAutoSettings==='function')_r526PrevOpenAutoSettings();
  setTimeout(()=>{
    const body=document.getElementById('modalBody');
    if(!body)return;
    if(!body.querySelector('[data-r526-settings-close]')){
      const wrap=document.createElement('div');
      wrap.style.cssText='display:flex;justify-content:flex-end;margin-top:12px';
      wrap.innerHTML='<button data-r526-settings-close class="primary" onclick="closeModal()">關閉</button>';
      body.appendChild(wrap);
    }
  },0);
}
window.r526OpenAutoBattleSettings=r526OpenAutoSettingsFixed;
window.r58OpenSettings=r526OpenAutoSettingsFixed;
window.r592OpenSettings=r526OpenAutoSettingsFixed;
setTimeout(()=>{
  const old=document.getElementById('settingsBtn');
  if(old){
    const fresh=old.cloneNode(true);
    old.replaceWith(fresh);
    fresh.addEventListener('click',r526OpenAutoSettingsFixed);
  }
},0);

/* =========================================================
   C. 逃跑成功：保留戰鬥中已損失的 HP / MP
   ========================================================= */
window.battleRun=function(){
  if(!battle)return;
  if(battle.noRun)return alert('此戰鬥不可逃跑。');
  const e=battle.enemyTeam.find(x=>x.hp>0)||battle.enemyTeam[0];
  const p=battle.playerTeam[0];
  const chance=clamp(50+((p?.agi??S.agi??0)-(e?.agi??0))*2,5,95);
  if(Math.random()*100<chance){
    if(p){
      S.hp=Math.max(1,Number(p.hp||0));
      S.mp=Math.max(0,Number(p.mp||0));
    }
    battle=null;
    closeModal();
    log(`🏃 成功逃離戰鬥。當前氣血 ${S.hp}、靈力 ${S.mp}。`);
    render();
  }else{
    battle.logs.push('逃跑失敗！');
    enemyTurn();
    if(battle)showBattle();
  }
};

/* =========================================================
   D. 戰鬥勝利：小視窗顯示獎勵，冒險紀錄照常保留
   ========================================================= */
function r526RewardPopup(enemyName,exp,coins){
  document.querySelectorAll('.r526-reward-toast-back').forEach(x=>x.remove());
  const back=document.createElement('div');
  back.className='r526-reward-toast-back';
  back.innerHTML=`<div class="r526-reward-toast">
    <h3>⚔️ 戰鬥勝利</h3>
    <div class="reward-line">擊敗 ${String(enemyName||'妖物')}</div>
    <div class="reward-line">修為 +${Number(exp||0)}　靈幣 +${Number(coins||0)}</div>
    <div class="hint">點擊任意處關閉</div>
  </div>`;
  back.addEventListener('click',()=>back.remove(),{once:true});
  document.body.appendChild(back);
}
window.r526RewardPopup=r526RewardPopup;

window.battleWin=function(){
  const b=battle;if(!b)return;
  /* 敵對 NPC 戰鬥沿用既有特殊邏輯，不在這裡套一般妖物獎勵 */
  if(b.hostile && typeof window._r526HostileBattleWinFallback==='function'){
    return window._r526HostileBattleWinFallback();
  }

  const e=b.enemyTeam[0],r=v070BattleReward(e);
  const p=b.playerTeam[0];
  S.hp=Math.max(1,p.hp);S.mp=Math.max(0,p.mp);
  v070AddCultivation(r.exp);S.coins+=r.coins;
  v070EnsureExperience();
  const c=S.experienceCounters.monster;
  if(r.kind==='妖王種')v070AddExperience(1,'擊殺妖王種');
  else if(['神獸種','災獸種'].includes(r.kind))v070AddExperience(5,`擊殺${r.kind}`);
  else if(!(r.diff<0&&['一般種','特殊種'].includes(r.kind))){
    const need={'一般種':30,'特殊種':20,'高位種':10,'高危種（特）':5}[r.kind];
    if(need){
      c[r.kind]=(c[r.kind]||0)+1;
      if(c[r.kind]>=need){c[r.kind]-=need;v070AddExperience(1,`累積擊殺${need}隻${r.kind}`)}
    }
  }
  if(typeof r4AdvanceMinutes==='function'){
    r4AdvanceMinutes(typeof r4ActionMinutes==='function'?r4ActionMinutes('battle'):15,{effective:true});
  }
  battle=null;closeModal();
  log(`⚔️ 擊敗 ${e.name}：修為 +${r.exp}、靈幣 +${r.coins}。`);
  render();
  setTimeout(()=>r526RewardPopup(e.name,r.exp,r.coins),0);
};

/* =========================================================
   E. 妖物 AI
   - 每次行動：50% 普攻 / 50% 技能
   - 沒有可消耗靈力的技能 → 普攻
   - 技能分支時，HP <=60% 且有可用補血技能 → 優先補血
   - 其餘可用技能隨機
   ========================================================= */
function r526EnemySkillRaw(e){
  let raw=e?.skills||e?.techniques||[];
  if(!Array.isArray(raw))raw=String(raw||'').split(/[、,，/]/).map(s=>s.trim()).filter(Boolean);
  return raw;
}
function r526EnemySkillInfo(e,s){
  if(s&&typeof s==='object'){
    return {
      name:s.name||s.title||'妖物技能',
      cost:Math.max(0,Number(s.cost??s.mpCost??8)),
      power:Number(s.power??s.multiplier??1.15),
      heal:Number(s.heal??s.healFlat??0),
      type:String(s.type||s.category||''),
      status:s.status||s.ailment||s.debuff||'',
      chance:Number.isFinite(Number(s.chance??s.statusChance))?Number(s.chance??s.statusChance):null
    };
  }
  const name=String(s||'妖物技能');
  const data=(e?.skillData||e?.skillDetails||{})[name]||{};
  let type=String(data.type||data.category||'');
  let heal=Number(data.heal??data.healFlat??0);
  if(/飲水|治療|恢復|回復|療癒/.test(name)){type='治療';if(!heal)heal=Math.max(1,Math.floor((e.maxhp||e.hp||1)*.12));}
  return {
    name,
    cost:Math.max(0,Number(data.cost??data.mpCost??8)),
    power:Number(data.power??data.multiplier??1.15),
    heal,
    type,
    status:data.status||data.ailment||data.debuff||'',
    chance:Number.isFinite(Number(data.chance??data.statusChance))?Number(data.chance??data.statusChance):null
  };
}
function r526EnemyNormalAttack(e,p){
  let dmg=calcDamage(e,p,.95);
  if(p._r526Guard){dmg=Math.max(1,Math.floor(dmg*.5));p._r526Guard=false;}
  const before=p.hp;
  p.hp=Math.max(0,p.hp-dmg);
  battle.logs.push(`${e.name}普通攻擊，對${p.name}造成${dmg}傷害；${p.name}氣血 ${before} → ${p.hp}。`);
}
window.enemyTurn=function(){
  const b=battle;if(!b)return;
  const p=b.playerTeam.find(x=>x.hp>0);
  const e=b.enemyTeam.find(x=>x.hp>0);
  if(!p||!e)return;

  const skills=r526EnemySkillRaw(e).map(s=>r526EnemySkillInfo(e,s));
  const usable=skills.filter(s=>Number(e.mp||0)>=s.cost);
  const chooseSkill = usable.length>0 && Math.random()<0.5;

  if(!chooseSkill){
    r526EnemyNormalAttack(e,p);
  }else{
    const hpPct=(Number(e.hp||0)/Math.max(1,Number(e.maxhp||e.hp||1)))*100;
    const healing=usable.filter(s=>s.heal>0||/治療|恢復|回復|療癒/.test(s.type)||/飲水|治療|恢復|回復|療癒/.test(s.name));
    let pool=usable;
    if(hpPct<=60 && healing.length)pool=healing;
    const sk=pool[Math.floor(Math.random()*pool.length)];

    const mpBefore=e.mp;
    e.mp=Math.max(0,e.mp-sk.cost);

    if(sk.heal>0){
      const before=e.hp;
      e.hp=Math.min(e.maxhp||e.hp,e.hp+sk.heal);
      b.logs.push(`${e.name}使用技能【${sk.name}】，消耗${sk.cost}靈力（${mpBefore} → ${e.mp}），回復${e.hp-before}氣血；氣血 ${before} → ${e.hp}。`);
    }else{
      let dmg=Math.max(1,Math.floor(calcDamage(e,p,Number.isFinite(sk.power)?sk.power:1.15)));
      if(p._r526Guard){dmg=Math.max(1,Math.floor(dmg*.5));p._r526Guard=false;}
      const before=p.hp;
      p.hp=Math.max(0,p.hp-dmg);
      let extra='';
      /* 狀態機率若正式資料未給數值，不自行亂設百分比 */
      if(sk.status && sk.chance!==null && sk.chance>0 && Math.random()*100<sk.chance){
        p.status=p.status||[];
        if(!p.status.includes(sk.status))p.status.push(sk.status);
        extra=`，並造成「${sk.status}」`;
      }
      b.logs.push(`${e.name}使用技能【${sk.name}】，消耗${sk.cost}靈力（${mpBefore} → ${e.mp}），對${p.name}造成${dmg}傷害${extra}；${p.name}氣血 ${before} → ${p.hp}。`);
    }
  }

  if(p.hp<=0){
    S.hp=1;S.mp=b.playerTeam[0]?.mp||0;
    battle=null;closeModal();
    log('💀 戰敗，戰鬥結束後回到1氣血。');
    render();
  }
};

function r541RealmInfo(realm){

  const s=String(realm||'練氣一層');
  const major=order.find(x=>s.includes(x))||'練氣';
  const cn={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const m=s.match(/([一二三四五六七八九])層/);

function r541RobberyMeta(name){

function r541HasHostile(name,type){
  const d=r541NpcData(name);

  if(Array.isArray(raw))return raw.includes(type);
  return String(raw||'').split(/[、,，/]/).map(x=>x.trim()).includes(type);
}
function r541MajorMinorDelta(name){
  const p=r541PlayerRealmInfo();
  const n=r541RealmInfo(r541NpcData(name).realm||'練氣一層');
  return {major:p.major-n.major,minor:(p.minor||1)-(n.minor||1)};
}
function r541RobberyChance(name){
  const d=r541MajorMinorDelta(name);
  let chance=40;
  if(d.major>=2)chance+=35;
  else if(d.major===1)chance+=20;
  else if(d.major===-1)chance-=25;
  else if(d.major<=-2)chance-=40;
  else{
    const minorStep=Math.min(3,Math.floor(Math.abs(d.minor)/3));
    chance+=(d.minor<0?-1:1)*minorStep*5;
  }
  const shop=r541ShopState(name);
  const wallet=Math.max(0,shop.wallet);
  const ratio=wallet<=0?999:Number(S.coins||0)/wallet;
  if(ratio>=3)chance+=20;
  else if(ratio>=2)chance+=15;
  else if(ratio>=1.25)chance+=10;
  else if(ratio>=.75)chance+=0;
  else if(ratio>=.50)chance-=10;
  else if(ratio>=.25)chance-=15;
  else chance-=20;
  return Math.max(5,Math.min(95,chance));

window.r519ConfirmRobbery=function(name){
  r541Ensure();
  const m=r541RobberyMeta(name);
  if(m.count>=3){
    alert(`${name}已經沒什麼可搶的了，手下留情吧！`);
    return;
  }
  const remain=r541RobberyCooldownRemaining(name);
  if(remain>0){
    alert(`目前還不能再次搶劫${name}，需等待${Math.ceil(remain/60)}遊戲小時。`);
    return;
  }
  const chance=r541RobberyChance(name);
  if(Math.random()*100>=chance){
    r541AdjustAffinity(name,-1);
    closeModal();
    log(`❌ 搶劫${name}判定失敗（成功率${chance}%），未進入戰鬥；好感度 -1 心。`);
    render();
    return;
  }

  const npc=(typeof r519HostileNpcFighter==='function')
    ?r519HostileNpcFighter(name,1)
    :null;
  if(!npc){
    closeModal();
    alert('目前無法建立此商人的戰鬥資料。');
    return;
  }

  if(Number(npc.maxhp)>0)npc.hp=npc.maxhp;
  if(Number(npc.maxmp)>=0)npc.mp=npc.maxmp;
  const slots=['前排1','前排2','後排1','後排2'];
  npc.position=slots[Math.floor(Math.random()*slots.length)];
  npc.slot=npc.position;

  r541AdjustAffinity(name,-2);
  r541AddEvilWanted(10,30);
  r541RecordRobberyBattle(name);

  if(typeof startBattle==='function'){
    startBattle([npc]);
    if(battle){
      battle.hostile={name,type:'搶劫',robbery:true};
      battle.robberyMerchant=name;
      battle.logs=battle.logs||[];
      battle.logs.push(`搶劫${name}判定成功，進入戰鬥。${name}以滿氣血／滿靈力開戰。`);
      if(typeof showBattle==='function')showBattle();
    }
  }
};

/* ---------------------------------------------------------
   Robbery victory loot
   --------------------------------------------------------- */
function r541GrantKnownItem(item){
  if(!item)return null;
  const name=typeof item==='string'?item:(item.name||item.item);
  const qty=Math.max(1,Number(typeof item==='object'?(item.qty||item.count||1):1));
  if(!name)return null;
  const cat=typeof item==='object'?String(item.category||item.bag||item.type||''):'';
  if(/素材|material/i.test(cat)){
    S.materials=S.materials||{};S.materials[name]=(S.materials[name]||0)+qty;
  }else if(/特殊|special/i.test(cat)||name.startsWith('［特殊］')||/妖物蛋/.test(name)){
    S.special=S.special||{};S.special[name]=(S.special[name]||0)+qty;
  }else if(/功法|tech/i.test(cat)){
    S.techInventory=S.techInventory||{};S.techInventory[name]=(S.techInventory[name]||0)+qty;
  }else{
    /* Unknown shop item category: preserve exact stolen goods without guessing bag category. */
    S.robberyStolenGoods=S.robberyStolenGoods||{};
    S.robberyStolenGoods[name]=(S.robberyStolenGoods[name]||0)+qty;
  }
  return `${name}×${qty}`;
}
function r541ShopStock(name){
  const raw=
    S.shopStock?.[name] ??
    S.merchantShop?.[name]?.stock ??
    S.shopInventory?.[name] ??
    null;
  if(Array.isArray(raw))return raw;
  if(raw&&typeof raw==='object')return Object.entries(raw).filter(([,q])=>Number(q)>0).map(([n,q])=>({name:n,qty:1,available:q}));
  return [];
}
function r541StealShopItems(name){
  const stock=r541ShopStock(name);
  if(!stock.length)return [];
  const pool=[...stock],n=Math.min(pool.length,1+Math.floor(Math.random()*3)),got=[];
  for(let i=0;i<n;i++){
    const idx=Math.floor(Math.random()*pool.length);
    const item=pool.splice(idx,1)[0];
    const label=r541GrantKnownItem(item);
    if(label)got.push(label);
  }
  return got;
}
function r541GrantExtraRobbery(name){
  if(Math.random()>=.60)return null;
  const e=R541_EXTRA_ROBBERY_LOOT[name];
  if(!e)return null;
  const bag=e.bag==='materials'?'materials':'special';
  S[bag]=S[bag]||{};
  S[bag][e.name]=(S[bag][e.name]||0)+e.qty;
  return `${e.name}×${e.qty}`;
}
function r541RobberyVictory(name){
  const st=r541ShopState(name);
  const base=typeof r520MerchantBaseCoinRoll==='function'
    ?r520MerchantBaseCoinRoll(name)
    :0;
  const share=Math.floor(st.wallet*.30);
  S.hostileState.shopCoins[name]=Math.max(0,st.wallet-share);
  const coins=base+share;
  S.coins=Number(S.coins||0)+coins;
  const goods=r541StealShopItems(name);
  const extra=r541GrantExtraRobbery(name);

  const parts=[`靈幣 +${coins}`];
  if(goods.length)parts.push(`商品：${goods.join('、')}`);
  else parts.push('商品：目前商店尚無正式販售清單資料，因此未生成虛構商品');
  if(extra)parts.push(`額外物品：${extra}`);

  log(`💰 搶劫${name}成功：${parts.join('；')}。`);
  return parts;
}

function r541WardAdmit(name,type,reason){
  r541Ensure();
  const now=r541Now(),until=now+1440;
  const found=S.clinicWard.find(x=>x.name===name&&x.type===type&&Number(x.until||0)>now);
  if(found){found.until=Math.max(found.until,until);found.reason=reason||found.reason;return}
  S.clinicWard.push({name,type:type||'npc',reason:reason||'受傷',admittedAt:now,until});
}
window.r541WardAdmit=r541WardAdmit;

function r541WardRemaining(x){return Math.max(0,Number(x.until||0)-r541Now())}
function r541WardCleanup(){
  r541Ensure();
  /* NPC may leave automatically when time is up; partner/pet stays listed until player retrieves. */
  S.clinicWard=S.clinicWard.filter(x=>x.type!=='npc'||r541WardRemaining(x)>0);
}
window.r541WardDischarge=function(i){
  r541WardCleanup();
  const x=S.clinicWard[i];if(!x)return;
  if(r541WardRemaining(x)>0)return alert('尚未休養滿1個完整遊戲日。');
  if(x.type==='partner'){
    const p=(S.partners||[]).find(v=>(v.name||v.id)===x.name);
    if(p){p.hospitalized=false;p.deployed=false;p.hp=p.maxhp||p.hp||1;p.mp=p.maxmp||p.mp||0}
  }else if(x.type==='pet'){
    const p=(S.pets||[]).find(v=>(v.name||v.id)===x.name);
    if(p){p.hospitalized=false;p.deployed=false;p.hp=p.maxhp||p.hp||1;p.mp=p.maxmp||p.mp||0}
  }
  S.clinicWard.splice(i,1);
  openClinic();
  render();
};

function r541RescueCost(battleSnapshot){
  const p=battleSnapshot?.playerTeam?.[0];
  const c=typeof r4Core==='function'?r4Core():{};
  const maxhp=Number(p?.maxhp||c.maxhp||S.maxhp||S.hp||1);
  const maxmp=Number(p?.maxmp||c.maxmp||S.maxmp||S.mp||0);
  const hp=Number(p?.hp||0),mp=Number(p?.mp||0);
  const general=Math.ceil(Math.max(0,maxhp-hp)/10)+Math.ceil(Math.max(0,maxmp-mp)/5);
  const realm=r541PlayerRealmInfo().name;
  return {general,fixed:R541_RESCUE_FIXED[realm]||50,total:general+(R541_RESCUE_FIXED[realm]||50),maxhp,maxmp};
}
function r541MainCity(){
  /* Current playable region is East State; use its established main city. */
  return '朝御城';
}
function r541ShowRescue(cost,paid){
  document.querySelectorAll('.r541-rescue-back').forEach(x=>x.remove());
  const back=document.createElement('div');
  back.className='r541-rescue-back';
  back.innerHTML=`<div class="r541-rescue-card">
    <h3>🏥 醫館救治</h3>
    <div>［某人將你／妳抬進了醫館］</div>
    <div style="margin-top:8px">救治後已恢復滿氣血／滿靈力。</div>
    <div>應付救治費：${cost} 靈幣　實付：${paid} 靈幣</div>
    <div class="hint">點擊任意處關閉</div>
  </div>`;
  back.addEventListener('click',()=>back.remove(),{once:true});
  document.body.appendChild(back);
}
function r541RescuePlayer(b){
  const cost=r541RescueCost(b);
  const paid=Math.min(Number(S.coins||0),cost.total);
  S.coins=Math.max(0,Number(S.coins||0)-paid);
  S.hp=cost.maxhp;S.mp=cost.maxmp;
  S.place=r541MainCity();

  (b?.playerTeam||[]).slice(1).forEach(u=>{
    if(Number(u.hp||0)>0)return;
    const type=u.type==='pet'?'pet':'partner';
    u.hospitalized=true;u.deployed=false;
    r541WardAdmit(u.name||u.id||'同行者',type,'戰鬥倒地');
  });

  battle=null;
  try{closeModal()}catch(e){}
  log(`🏥 ［某人將你／妳抬進了醫館］救治費 ${cost.total} 靈幣，實付 ${paid} 靈幣。`);
  render();
  setTimeout(()=>r541ShowRescue(cost.total,paid),0);
}
window.r541RescuePlayer=r541RescuePlayer;

/* ---------------------------------------------------------
   Enemy AI kept at 50% normal / 50% skill, but defeat now uses rescue.
   --------------------------------------------------------- */
function r541EnemySkillRaw(e){
  let raw=e?.skills||e?.techniques||[];
  if(!Array.isArray(raw))raw=String(raw||'').split(/[、,，/]/).map(s=>s.trim()).filter(Boolean);
  return raw;
}
function r541EnemySkillInfo(e,s){
  if(s&&typeof s==='object'){
    return {
      name:s.name||s.title||'妖物技能',
      cost:Math.max(0,Number(s.cost??s.mpCost??8)),
      power:Number(s.power??s.multiplier??1.15),
      heal:Number(s.heal??s.healFlat??0),
      type:String(s.type||s.category||''),
      status:s.status||s.ailment||s.debuff||'',
      chance:Number.isFinite(Number(s.chance??s.statusChance))?Number(s.chance??s.statusChance):null
    };
  }
  const name=String(s||'妖物技能');
  const data=(e?.skillData||e?.skillDetails||{})[name]||{};
  let type=String(data.type||data.category||'');
  let heal=Number(data.heal??data.healFlat??0);
  if(/飲水|治療|恢復|回復|療癒/.test(name)){type='治療';if(!heal)heal=Math.max(1,Math.floor((e.maxhp||e.hp||1)*.12))}
  return {
    name,cost:Math.max(0,Number(data.cost??data.mpCost??8)),
    power:Number(data.power??data.multiplier??1.15),heal,type,
    status:data.status||data.ailment||data.debuff||'',
    chance:Number.isFinite(Number(data.chance??data.statusChance))?Number(data.chance??data.statusChance):null
  };
}
function r541EnemyNormal(e,p){
  let dmg=calcDamage(e,p,.95);
  if(p._r526Guard){dmg=Math.max(1,Math.floor(dmg*.5));p._r526Guard=false}
  const before=p.hp;p.hp=Math.max(0,p.hp-dmg);
  battle.logs.push(`${e.name}普通攻擊，對${p.name}造成${dmg}傷害；${p.name}氣血 ${before} → ${p.hp}。`);
}
window.enemyTurn=function(){
  const b=battle;if(!b)return;
  const p=b.playerTeam.find(x=>x.hp>0);
  const e=b.enemyTeam.find(x=>x.hp>0);
  if(!p||!e)return;

  const usable=r541EnemySkillRaw(e).map(s=>r541EnemySkillInfo(e,s)).filter(s=>Number(e.mp||0)>=s.cost);
  const useSkill=usable.length>0&&Math.random()<.5;

  if(!useSkill){
    r541EnemyNormal(e,p);
  }else{
    const hpPct=Number(e.hp||0)/Math.max(1,Number(e.maxhp||e.hp||1))*100;
    const healers=usable.filter(s=>s.heal>0||/治療|恢復|回復|療癒/.test(s.type)||/飲水|治療|恢復|回復|療癒/.test(s.name));
    const pool=(hpPct<=60&&healers.length)?healers:usable;
    const sk=pool[Math.floor(Math.random()*pool.length)];
    const mpBefore=e.mp;e.mp=Math.max(0,e.mp-sk.cost);

    if(sk.heal>0){
      const before=e.hp;e.hp=Math.min(e.maxhp||e.hp,e.hp+sk.heal);
      b.logs.push(`${e.name}使用技能【${sk.name}】，消耗${sk.cost}靈力（${mpBefore} → ${e.mp}），回復${e.hp-before}氣血；氣血 ${before} → ${e.hp}。`);
    }else{
      let dmg=Math.max(1,Math.floor(calcDamage(e,p,Number.isFinite(sk.power)?sk.power:1.15)));
      if(p._r526Guard){dmg=Math.max(1,Math.floor(dmg*.5));p._r526Guard=false}
      const before=p.hp;p.hp=Math.max(0,p.hp-dmg);
      let extra='';
      if(sk.status&&sk.chance!==null&&sk.chance>0&&Math.random()*100<sk.chance){
        p.status=p.status||[];
        if(!p.status.includes(sk.status))p.status.push(sk.status);
        extra=`，並造成「${sk.status}」`;
      }
      b.logs.push(`${e.name}使用技能【${sk.name}】，消耗${sk.cost}靈力（${mpBefore} → ${e.mp}），對${p.name}造成${dmg}傷害${extra}；${p.name}氣血 ${before} → ${p.hp}。`);
    }
  }

  if(Number(p.hp||0)<=0){
    if(p.type==='pet'||p.type==='partner'){
      p.hospitalized=true;p.deployed=false;
      r541WardAdmit(p.name||p.id||'同行者',p.type,'戰鬥倒地');
    }
    const alive=b.playerTeam.some(x=>Number(x.hp||0)>0);
    if(!alive){
      r541RescuePlayer(b);return;
    }
  }
};

const _r541Core=window.r4Core;

  window.r4Core=function(){
    const c=_r541Core.apply(this,arguments);
    const ids=(S.outsideStatus||[]).map(x=>x.id||x.name||'');
    const mult=ids.some(x=>String(x).includes('meridian_trauma')||String(x).includes('經脈重創'))?.90:
               ids.some(x=>String(x).includes('meridian_disorder')||String(x).includes('經脈紊亂'))?.95:1;
    if(mult===1)return c;
    return Object.assign({},c,{
      atk:Math.max(0,Math.floor(Number(c.atk||0)*mult)),
      def:Math.max(0,Math.floor(Number(c.def||0)*mult)),
      agi:Math.max(0,Math.floor(Number(c.agi||c.spd||0)*mult)),
      hit:Math.max(0,Math.floor(Number(c.hit||c.acc||0)*mult))
    });
  };
}

<script id="motherfile-v042-battle-lock-script">
'use strict';
(function(){

function r542Clamp(v,min,max){
  v=Number(v||0);
  return Math.max(min,Math.min(max,v));
}

/* ---------- 六按鈕正式排列 ---------- */
function r542Actions(b){
  return `<div class="r519-actions">
    <button onclick="battleAttack()">普攻</button>
    <button onclick="battleTechnique()">功法</button>
    <button onclick="r58BattleBag()">背包</button>
    <button onclick="r519BattleDefend()">防禦</button>
    <button onclick="battleRun()">逃跑</button>
    <button onclick="toggleAutoBattle()">${b.auto?'停止自動戰鬥':'自動戰鬥'}</button>
  </div>`;
}

/* 若既有 UI 被舊覆寫污染，只替換底部操作列，不碰戰位座標/卡面 */
if(typeof window.bmv1UI==='function'){
  const r542PrevUI=window.bmv1UI;
  window.bmv1UI=function(b){
    let out=r542PrevUI(b);
    if(typeof out!=='string')return out;
    out=out.replace(
      /<section class="bmv1-bottom">[\s\S]*?<\/section>/,
      `<section class="bmv1-bottom">${r542Actions(b)}</section>`
    );
    return out;
  };
}

/* ---------- 防禦：直接行動；下一次直接傷害減半 ---------- */
window.r519BattleDefend=function(){
  const b=battle;if(!b)return;
  const p=b.playerTeam?.find(x=>Number(x.hp||0)>0);
  if(!p)return;
  p._r526Guard=true;
  b.logs=b.logs||[];
  b.logs.push(`${p.name}進入防禦姿態，下一次受到的直接傷害減半。`);
  enemyTurn();
  if(battle){
    b.round=(b.round||1)+1;
    showBattle();
  }
};

/* ---------- 逃跑：50% + (玩家身 - 主要敵方身) × 2，5~95% ---------- */
window.battleRun=function(){
  const b=battle;if(!b)return;
  if(b.noRun)return alert('此戰鬥不可逃跑。');

  const p=b.playerTeam?.find(x=>Number(x.hp||0)>0)||b.playerTeam?.[0];
  const e=b.enemyTeam?.find(x=>Number(x.hp||0)>0)||b.enemyTeam?.[0];
  if(!p||!e)return;

  const playerAgi=Number(p.agi??p.spd??S.agi??0);
  const enemyAgi=Number(e.agi??e.spd??0);
  const chance=r542Clamp(50+(playerAgi-enemyAgi)*2,5,95);

  b.logs=b.logs||[];
  if(Math.random()*100<chance){
    S.hp=Math.max(1,Number(p.hp||0));
    S.mp=Math.max(0,Number(p.mp||0));
    const hp=S.hp,mp=S.mp;
    battle=null;
    closeModal();
    log(`🏃 成功逃離戰鬥。當前氣血 ${hp}、靈力 ${mp}。`);
    render();
  }else{
    b.logs.push(`逃跑失敗！（本次成功率 ${chance}%）`);
    enemyTurn();
    if(battle)showBattle();
  }
};

/* ---------- 自動戰鬥設定完整硬鎖 ---------- */
function r542EnsureAuto(){
  if(typeof r58Ensure==='function')r58Ensure();
  S.autoBattleConfig=S.autoBattleConfig||{};
  const c=S.autoBattleConfig;
  if(typeof c.enterAuto!=='boolean')c.enterAuto=false;
  if(typeof c.useTech!=='boolean')c.useTech=false;
  if(!Array.isArray(c.techOrder))c.techOrder=[];
  if(typeof c.usePotion!=='boolean')c.usePotion=false;
  if(typeof c.useRestorePill!=='boolean')c.useRestorePill=false;
  if(!Number.isFinite(Number(c.hpThreshold)))c.hpThreshold=50;
  if(!Number.isFinite(Number(c.mpThreshold)))c.mpThreshold=50;
  if(typeof c.preferDual!=='boolean')c.preferDual=true;
  if(!['normal','fast'].includes(c.speed))c.speed='normal';
  S.settings=S.settings||{};
}
function r542OpenAutoSettings(){
  r542EnsureAuto();
  const c=S.autoBattleConfig,learned=S.techniques||[];
  showModal('⚙️ 設定－自動戰鬥',`
    <div class="settings-section">
      <b>進入戰鬥時的初始模式</b><br>
      <label><input type="radio" name="r542EnterAuto" ${c.enterAuto?'':'checked'}
        onchange="S.autoBattleConfig.enterAuto=false"> 進場手動</label>
      <label style="margin-left:12px"><input type="radio" name="r542EnterAuto" ${c.enterAuto?'checked':''}
        onchange="S.autoBattleConfig.enterAuto=true"> 進場自動</label>
      <div class="small muted">只控制進場初始模式；戰鬥中可隨時手動切換。</div>
    </div>

    <div class="settings-section">
      <b>自動使用功法</b><br>
      <label><input type="checkbox" ${c.useTech?'checked':''}
        onchange="S.autoBattleConfig.useTech=this.checked"> 開啟</label>
      <div class="small muted">最多10招；依順位嘗試，靈力不足自動跳過。</div>
      <div>${c.techOrder.map((n,i)=>`
        <div class="tech-order-row">
          <span>${i+1}. ${String(n)}</span>
          <button onclick="r58TechMove(${i},-1)">↑</button>
          <button onclick="r58TechMove(${i},1)">↓</button>
          <button onclick="r58TechRemove(${i})">移除</button>
        </div>`).join('')||'<div class="muted">尚未設定功法順位。</div>'}</div>
      <select id="r58TechAdd">
        <option value="">選擇已學功法</option>
        ${learned.filter(n=>!c.techOrder.includes(n)).map(n=>`<option>${String(n)}</option>`).join('')}
      </select>
      <button onclick="r58TechAdd()">加入順位</button>
    </div>

    <div class="settings-section">
      <b>自動使用恢復類丹藥</b><br>
      <label><input type="checkbox" ${c.useRestorePill?'checked':''}
        onchange="S.autoBattleConfig.useRestorePill=this.checked"> 開啟</label>
      <div class="small muted">只允許恢復類；增強、效果、免疫類丹藥不會自動使用。</div>
    </div>

    <div class="settings-section">
      <b>自動使用藥水</b><br>
      <label><input type="checkbox" ${c.usePotion?'checked':''}
        onchange="S.autoBattleConfig.usePotion=this.checked"> 開啟</label><br>
      氣血低於 <input type="number" min="1" max="99" value="${c.hpThreshold}"
        onchange="S.autoBattleConfig.hpThreshold=r542Clamp(+this.value,1,99)" style="width:70px"> %<br>
      靈力低於 <input type="number" min="1" max="99" value="${c.mpThreshold}"
        onchange="S.autoBattleConfig.mpThreshold=r542Clamp(+this.value,1,99)" style="width:70px"> %<br>
      <label><input type="checkbox" ${c.preferDual?'checked':''}
        onchange="S.autoBattleConfig.preferDual=this.checked"> 同時缺血／缺靈時優先雙補</label>
    </div>

    <div class="settings-section">
      <b>自動戰鬥速度</b><br>
      <select onchange="S.autoBattleConfig.speed=this.value">
        <option value="normal" ${c.speed==='normal'?'selected':''}>正常</option>
        <option value="fast" ${c.speed==='fast'?'selected':''}>快速</option>
      </select>
      <div class="small muted">自動戰鬥目前不包含自動防禦。</div>
    </div>

    <div class="actions" style="justify-content:flex-end">
      <button class="primary" onclick="closeModal()">關閉</button>
    </div>
  `);
}
window.r542Clamp=r542Clamp;
window.r526OpenAutoBattleSettings=r542OpenAutoSettings;
window.r58OpenSettings=r542OpenAutoSettings;
window.r592OpenSettings=r542OpenAutoSettings;

/* ---------- 進場手動/自動真正生效 ---------- */
const r542PrevStart=window.startBattle;
window.startBattle=function(mon){
  r542EnsureAuto();
  const old=S.settings?.autoBattle;
  S.settings=S.settings||{};
  S.settings.autoBattle=!!S.autoBattleConfig.enterAuto;
  try{
    return r542PrevStart(mon);
  }finally{
    S.settings.autoBattle=old;
  }
};

/* ---------- 戰鬥中切換自動/手動 ---------- */
window.toggleAutoBattle=function(){
  if(!battle)return;
  battle.auto=!battle.auto;
  battle.logs=battle.logs||[];
  battle.logs.push(battle.auto?'已切換為自動戰鬥。':'已切換為手動戰鬥。');
  showBattle();
};

/* ---------- 最終 showBattle：固定使用正式 bmv1 UI ---------- */
window.showBattle=function(){
  const b=battle;if(!b)return;
  if(typeof r526CloseBattlePop==='function')r526CloseBattlePop();
  showModal('⚔️ 戰鬥',bmv1UI(b));

      if(battle&&battle.auto){
        (typeof r58AutoStep==='function'?r58AutoStep():battleAttack());
      }
    },S.autoBattleConfig?.speed==='fast'?220:450);
  }
};

window.MOTHERFILE_V042_BATTLE_IMPLEMENTED=true;
})();
</script>


<script id="r542-fatigue-outside-status-sync">
'use strict';
(function(){

function r542EnsureOutsideStatus(){
  if(!window.S)return;
  S.outsideStatus=S.outsideStatus||[];
}

/* 正式同步規則：
   疲勞 >= 100 → 必定存在［勞累］
   疲勞 <= 99  → 必定移除［勞累］
*/
function r542SyncFatigueStatus(){
  if(!window.S)return;
  r542EnsureOutsideStatus();

  const fatigue=Math.max(0,Number(S.fatigue||0));
  const idx=S.outsideStatus.findIndex(x =>
    x && (
      x.id==='fatigue_exhausted' ||
      x.name==='勞累' ||
      x.name==='［勞累］'
    )
  );

  if(fatigue>=100){
    const data={
      id:'fatigue_exhausted',
      name:'勞累',
      desc:'疲勞達100；身 -10%，無法修練。疲勞降至99以下時自動解除。',
      curableByClinic:false,
      source:'fatigue'
    };
    if(idx<0){
      S.outsideStatus.push(data);
    }else{
      S.outsideStatus[idx]=Object.assign({},S.outsideStatus[idx],data);
    }
    S.fatigueStatus=true;
  }else{
    S.outsideStatus=S.outsideStatus.filter(x =>
      !(x && (
        x.id==='fatigue_exhausted' ||
        x.name==='勞累' ||
        x.name==='［勞累］'
      ))
    );
    S.fatigueStatus=false;
  }
}
window.r542SyncFatigueStatus=r542SyncFatigueStatus;

/* 六核：［勞累］實際讓「身」-10%，只套一次 */
const r542PrevCoreFatigue=window.r4Core;
if(typeof r542PrevCoreFatigue==='function'){
  window.r4Core=function(){
    const c=r542PrevCoreFatigue.apply(this,arguments);
    if(!window.S)return c;
    r542SyncFatigueStatus();
    const exhausted=(S.outsideStatus||[]).some(x=>x?.id==='fatigue_exhausted');
    if(!exhausted)return c;
    return Object.assign({},c,{
      agi:Math.max(0,Math.floor(Number(c.agi||0)*0.90))
    });
  };
}

/* 修練入口硬鎖：［勞累］時不得修練 */
function r542IsExhausted(){
  r542SyncFatigueStatus();
  return (S.outsideStatus||[]).some(x=>x?.id==='fatigue_exhausted');
}

const r542PrevTraining=window.useTrainingGround;
if(typeof r542PrevTraining==='function'){
  window.useTrainingGround=function(){
    if(r542IsExhausted())return alert('目前處於［勞累］，疲勞需降至99以下才能修練。');
    return r542PrevTraining.apply(this,arguments);
  };
}

const r542PrevMeditation=window.useMeditationRoom;
if(typeof r542PrevMeditation==='function'){
  window.useMeditationRoom=function(){
    if(r542IsExhausted())return alert('目前處於［勞累］，疲勞需降至99以下才能修練。');
    return r542PrevMeditation.apply(this,arguments);
  };
}

/* 兼容既有疲勞處理函式：每次疲勞變動後立即同步 */
if(typeof window.r58ApplyFatigue==='function'){
  const r542PrevApplyFatigue=window.r58ApplyFatigue;
  window.r58ApplyFatigue=function(){
    const result=r542PrevApplyFatigue.apply(this,arguments);
    r542SyncFatigueStatus();
    try{if(typeof renderPlayer==='function')renderPlayer()}catch(e){}
    return result;
  };
}

/* render 前同步，確保一般操作、讀檔後都不會出現狀態不同步 */
if(typeof window.render==='function'){
  const r542PrevRender=window.render;
  window.render=function(){
    r542SyncFatigueStatus();
    return r542PrevRender.apply(this,arguments);
  };
}

/* 左側角色卡重繪前同步 */
if(typeof window.renderPlayer==='function'){
  const r542PrevRenderPlayer=window.renderPlayer;
  window.renderPlayer=function(){
    r542SyncFatigueStatus();
    return r542PrevRenderPlayer.apply(this,arguments);
  };
}

/* 讀檔後重新檢查 */
if(typeof window.r4LoadSave==='function'){
  const r542PrevLoadSave=window.r4LoadSave;
  window.r4LoadSave=function(){
    const result=r542PrevLoadSave.apply(this,arguments);
    setTimeout(()=>{
      try{
        r542SyncFatigueStatus();
        if(typeof render==='function')render();
      }catch(e){}
    },0);
    return result;
  };
}

if(typeof window.r541LoadSaveSlot==='function'){
  const r542PrevLoad541=window.r541LoadSaveSlot;
  window.r541LoadSaveSlot=function(){
    const result=r542PrevLoad541.apply(this,arguments);
    setTimeout(()=>{
      try{
        r542SyncFatigueStatus();
        if(typeof render==='function')render();
      }catch(e){}
    },0);
    return result;
  };
}

/* 啟動時校正一次 */
try{r542SyncFatigueStatus()}catch(e){}

window.R542_FATIGUE_OUTSIDE_STATUS_SYNC=true;
})();
</script>

<script id="test-v1-jingmine-encounter-fix">
'use strict';
(function(){
  const PLACE='晶礦秘境';
  const MAX=3;
  const RECOVER_MINUTES=120;

  function ensureMineEncounterState(){
    S.gatherState=S.gatherState||{};
    const st=S.gatherState[PLACE]||(S.gatherState[PLACE]={});
    if(!Number.isFinite(Number(st.monsterCharges))) st.monsterCharges=MAX;
    st.monsterCharges=Math.max(0,Math.min(MAX,Number(st.monsterCharges)));
    if(!('monsterRecoverAt' in st)) st.monsterRecoverAt=null;
    return st;
  }

  function recoverMineEncounter(){
    const st=ensureMineEncounterState();
    const now=Number(S.effectiveMinutes||0);

    // 在晶礦秘境內絕不恢復；回到秘境也立即停止當前恢復週期。
    if(S.place===PLACE){
      if(st.monsterCharges>0) st.monsterRecoverAt=null;
      return st;
    }

    // 只有「已歸0而且已離開」才能啟動恢復。
    if(st.monsterCharges<=0 && st.monsterRecoverAt==null){
      st.monsterRecoverAt=now;
      return st;
    }

    if(st.monsterRecoverAt!=null && st.monsterCharges<MAX){
      const elapsed=Math.max(0,now-Number(st.monsterRecoverAt));
      const add=Math.floor(elapsed/RECOVER_MINUTES);
      if(add>0){
        st.monsterCharges=Math.min(MAX,st.monsterCharges+add);
        st.monsterRecoverAt+=add*RECOVER_MINUTES;
        if(st.monsterCharges>=MAX) st.monsterRecoverAt=null;
      }
    }
    return st;
  }

  function makeCrystalSpirit(){
    // 已有設定：精晶礦靈／一般種／無屬性／練氣一層100%。
    // 「六圍與預設戰力 AI設定」：依目前正式練氣一層八核基線建立，不另造倍率。
    return {
      name:'精晶礦靈', type:'一般種', tier:'一般種', realm:'練氣一層', attr:'無', element:'無',
      hp:100, maxhp:100, mp:40, maxmp:40,
      atk:10, dao:10, def:7, daoDef:7, agi:8, hit:10,
      status:[], skills:['小拳拳（弱攻擊）']
    };
  }

  const previousEncounter=encounterMonster;
  encounterMonster=function(){
    if(S.place===PLACE){
      if(!S.flags?.freeRoam) return alert('目前只能進行主線指定戰鬥。');
      const st=recoverMineEncounter();
      if(st.monsterCharges<=0){
        return alert('晶礦秘境遭遇次數已用完。只有在次數歸0並離開此區域後才開始恢復；每2遊戲小時+1。');
      }
      st.monsterCharges--;
      // 歸0時仍在區域內，所以此刻不開始計時；離開後由 recoverMineEncounter 設定起點。
      if(st.monsterCharges===0) st.monsterRecoverAt=null;
      const mon=makeCrystalSpirit();
      return startBattle(mon);
    }
    return previousEncounter.apply(this,arguments);
  };

  const previousAdventure=renderAdventure;
  renderAdventure=function(){
    const st=recoverMineEncounter();
    let html=previousAdventure.apply(this,arguments);
    if(S.place===PLACE){
      html=html.replace('👾 遭遇妖物</button>',`👾 遭遇妖物（${st.monsterCharges}/${MAX}）</button>`);
      const note=`<div class="gather-status"><b>妖物遭遇：</b>${st.monsterCharges}/${MAX}。只有在次數歸0並離開此區域後才開始恢復；每2遊戲小時+1次。</div>`;
      const marker='<div class="gather-status">採集只有在次數歸0並離開此區域後才開始恢復；每1.5遊戲小時+1次。</div>';
      if(html.includes(marker)) html=html.replace(marker,note+marker);
      else html+=note;
    }
    return html;
  };

  window.TEST_V1_JINGMINE_ENCOUNTER_FIXED=true;
})();
</script>

      .flatMap(v=>Array.isArray(v)?v:[v]).filter(Boolean).map(v=>String(v));

    const panel=document.createElement('div'); panel.className='r526-battle-pop';
    panel.innerHTML=`<div class="r526-battle-pop-head"><span>📖 功法選擇</span><button onclick="r526CloseBattlePop()">✕</button></div>
      <div class="r526-battle-pop-body">
        <div class="r526-tech-tabs">${V4_CATS.map(c=>`<button class="${c===tab?'active':''}" onclick="r526OpenTechniqueTab('${c}')">${c}</button>`).join('')}</div>
        ${rows.length?rows.map(n=>{
          const d=TECH_DB[n]||{},cost=Number(d.cost||0);
          return `<div class="r526-tech-entry"><div><b>${typeof esc526==='function'?esc526(n):n}</b>
            <div class="r526-tech-meta">${d.attr||'無屬性'}・${normTechCat(d)}・靈力 ${cost}<br>${d.desc||'尚未設定敘述'}</div>
            </div><button ${battle.playerTeam[0].mp<cost?'disabled':''} onclick="r526UseTechnique('${String(n).replaceAll("'","\'")}')">使用</button></div>`;
        }).join(''):'<div class="r526-empty">目前沒有這個分類的已學功法。</div>'}
      </div>`;
    canvas.appendChild(panel);
  };
  window.battleTechnique=function(){
    if(!battle)return;
    if(!(S.techniques||[]).length){battle.logs.push('目前尚未學會可使用的正式功法。');showBattle();return;}
    r526OpenTechniqueTab('攻擊');
  };

  const EFFECT_MAP={
    '［初階］氣血藥水':'恢復50氣血。',
    '［初階］靈力藥水':'恢復30靈力。',
    '［初階］清露藥水':'恢復35氣血＋10靈力。',
    '［初階］凝靈藥水':'恢復40靈力。',
    '［初階］百靈藥水':'恢復100氣血＋30靈力。',
    '［初階］寧息藥水':'睡眠抗性＋20%，持續3回合。',
    '［初階］治癒丹':'每回合恢復30氣血，持續3回合。',
    '［初階］靈癒丹':'每回合恢復10靈力，持續3回合。',
    '［初階］醒神丹':'戰鬥中立即解除睡眠。',
    '［初階］明目丹':'戰鬥中立即解除失明。',
    '［初階］靈息丹':'命＋8%，持續3回合。'
  };
  function kindOf(n){if(/藥水/.test(n))return '藥水';if(/丹/.test(n))return '丹藥';if(/藥/.test(n))return '藥品';return '道具';}
  function allKnownEffects(){
    const m=Object.assign({},EFFECT_MAP);
    try{(RECIPES?.['藥品']||[]).forEach(x=>{if(x?.[0]&&x?.[2])m[x[0]]=x[2]});(RECIPES?.['丹藥']||[]).forEach(x=>{if(x?.[0]&&x?.[2])m[x[0]]=x[2]});}catch(e){}
    return m;
  }
  function battleUsable(n,effect){return !!EFFECT_MAP[n] || /戰鬥中|恢復|回復|持續\d+回合|持續[一二三四五六七八九十]+回合/.test(String(effect||''));}

  window.rV4UseBattleItem=function(name){
    if(!battle)return;
    const p=battle.playerTeam?.[0]; if(!p)return;
    const inv=(S.items?.[name]>0)?S.items:(S.special?.[name]>0?S.special:null);
    if(!inv)return;
    const take=()=>{inv[name]--;if(inv[name]<=0)delete inv[name];};
    let used=true,msg='';
    if(name==='［初階］氣血藥水'){const b=p.hp;p.hp=Math.min(p.maxhp,p.hp+50);msg=`氣血 ${b} → ${p.hp}`;}
    else if(name==='［初階］靈力藥水'){const b=p.mp;p.mp=Math.min(p.maxmp,p.mp+30);msg=`靈力 ${b} → ${p.mp}`;}
    else if(name==='［初階］清露藥水'){const h=p.hp,m=p.mp;p.hp=Math.min(p.maxhp,p.hp+35);p.mp=Math.min(p.maxmp,p.mp+10);msg=`氣血 ${h} → ${p.hp}；靈力 ${m} → ${p.mp}`;}
    else if(name==='［初階］凝靈藥水'){const b=p.mp;p.mp=Math.min(p.maxmp,p.mp+40);msg=`靈力 ${b} → ${p.mp}`;}
    else if(name==='［初階］百靈藥水'){const h=p.hp,m=p.mp;p.hp=Math.min(p.maxhp,p.hp+100);p.mp=Math.min(p.maxmp,p.mp+30);msg=`氣血 ${h} → ${p.hp}；靈力 ${m} → ${p.mp}`;}
    else if(name==='［初階］醒神丹'){p.status=(p.status||[]).filter(x=>!String(x).includes('睡眠'));msg='解除睡眠。';}
    else if(name==='［初階］明目丹'){p.status=(p.status||[]).filter(x=>!String(x).includes('失明'));msg='解除失明。';}
    else {used=false;}
    if(!used)return alert(`「${name}」的戰鬥效果已顯示，但目前尚未接入正式效果執行器；不會消耗物品。`);
    take();
    battle.logs.push(`${S.name}使用${name}：${msg}（不消耗行動）。`);
    if(typeof r526CloseBattlePop==='function')r526CloseBattlePop();
    showBattle();
  };

  window.r58BattleBag=function(){
    if(!battle)return;
    if(typeof r526CloseBattlePop==='function')r526CloseBattlePop();
    const effects=allKnownEffects();
    const merged=new Map();
    for(const [n,c] of Object.entries(S.items||{}))if(c>0)merged.set(n,(merged.get(n)||0)+c);
    for(const [n,c] of Object.entries(S.special||{}))if(c>0)merged.set(n,(merged.get(n)||0)+c);
    const usable=[...merged.entries()].filter(([n])=>battleUsable(n,effects[n]));
    const canvas=document.querySelector('.bmv1-canvas');if(!canvas)return;
    const panel=document.createElement('div');panel.className='r526-battle-pop small';
    panel.innerHTML=`<div class="r526-battle-pop-head"><span>🎒 戰鬥背包</span><button onclick="r526CloseBattlePop()">✕</button></div>
      <div class="r526-battle-pop-body">
        ${usable.length?`<div class="r526-bag-grid">${usable.map(([n,c])=>`<div class="r526-bag-item"><span class="r526-bag-kind">${kindOf(n)}</span><br><b>${n}</b><br>持有 ${c}<div class="r526-item-effect"><b>作用：</b>${effects[n]||'尚未設定作用'}</div><button onclick="rV4UseBattleItem('${String(n).replaceAll("'","\'")}')">使用</button></div>`).join('')}</div>`:'<div class="r526-empty">目前沒有可在戰鬥中使用的藥水、藥品、丹藥或道具。</div>'}
      </div>`;
    canvas.appendChild(panel);
  };
  window.TEST_V4_TECH_SEVEN_TABS_AND_BAG_EFFECTS=true;
})();
</script>


<!-- =========================================================
     測試分支 V5
     1) 晶礦秘境遭遇次數只在戰鬥勝利後扣除
     2) 戰敗／逃跑皆不扣次數
     3) 戰鬥勝利小框加入「素材／材料」顯示
     ※ 未經定案，不更新正式母檔
     ========================================================= -->
<script id="test-v5-mine-win-charge-and-material-reward">
(function(){
  'use strict';

  const MINE_PLACE='晶礦秘境';
  const MINE_MAX=3;

  function v5MineState(){
    S.gatherState=S.gatherState||{};
    const st=S.gatherState[MINE_PLACE]||(S.gatherState[MINE_PLACE]={});
    if(!Number.isFinite(Number(st.monsterCharges)))st.monsterCharges=MINE_MAX;
    st.monsterCharges=Math.max(0,Math.min(MINE_MAX,Number(st.monsterCharges)));
    if(!('monsterRecoverAt' in st))st.monsterRecoverAt=null;
    return st;
  }

  /*
   * 舊測試分支會在「點遭遇」時立刻扣 1。
   * 本版不改原本怪物生成流程，而是在成功進戰後把那 1 次退回，
   * 並在該場戰鬥掛上 pending 標記。
   */
  const v5PrevEncounter=encounterMonster;
  encounterMonster=function(){
    if(S.place===MINE_PLACE){
      const st=v5MineState();
      const before=Number(st.monsterCharges||0);

      /* 0 次時仍交給既有流程顯示正式提示。 */
      const result=v5PrevEncounter.apply(this,arguments);

      if(battle && battle.enemyTeam?.[0]?.name==='精晶礦靈'){
        /* 把舊版進場時扣掉的次數退回。 */
        st.monsterCharges=before;
        st.monsterRecoverAt=null;

        battle._v5MineEncounterPending=true;
        battle._v5MineEncounterChargeCommitted=false;
      }
      return result;
    }
    return v5PrevEncounter.apply(this,arguments);
  };

  function v5SnapshotMaterials(){
    const src=S.materials||{};
    const snap={};
    for(const [k,v] of Object.entries(src))snap[k]=Number(v||0);
    return snap;
  }

  function v5MaterialDelta(before){
    const after=S.materials||{};
    const names=new Set([...Object.keys(before||{}),...Object.keys(after)]);
    const got=[];
    for(const name of names){
      const a=Number(after[name]||0);
      const b=Number(before?.[name]||0);
      const d=a-b;
      if(d>0)got.push({name,qty:d});
    }
    return got;
  }

  /*
   * 沒有正式掉落表時不自行創造素材。
   * 此處只顯示「這場戰鬥實際增加到 S.materials 的材料」。
   * 日後妖物正式掉落系統把材料寫進背包後，小框會自動列出。
   */
  window.__v5LastBattleMaterials=[];

  const v5PrevBattleWin=battleWin;
  battleWin=function(){
    const b=battle;
    if(!b)return;

    const materialBefore=v5SnapshotMaterials();

    /* 晶礦秘境：只有進到 battleWin 才正式消耗遭遇次數。 */
    if(b._v5MineEncounterPending && !b._v5MineEncounterChargeCommitted){
      const st=v5MineState();
      st.monsterCharges=Math.max(0,Number(st.monsterCharges||0)-1);
      /* 歸 0 時仍在晶礦秘境內，不啟動恢復計時。 */
      if(st.monsterCharges===0)st.monsterRecoverAt=null;
      b._v5MineEncounterChargeCommitted=true;
    }

    const result=v5PrevBattleWin.apply(this,arguments);

    /* 既有或未來掉落程式若在勝利流程增加材料，這裡抓實際差額。 */
    window.__v5LastBattleMaterials=v5MaterialDelta(materialBefore);

    return result;
  };

  /*
   * 覆寫現有勝利小框：
   * 保留「擊敗／修為／靈幣」，追加實際取得的素材材料。
   */
  r526RewardPopup=function(enemyName,exp,coins){
    document.querySelectorAll('.r526-reward-toast-back').forEach(x=>x.remove());

    const got=Array.isArray(window.__v5LastBattleMaterials)
      ?window.__v5LastBattleMaterials
      :[];

    const materialText=got.length
      ?got.map(x=>`${x.name} ×${x.qty}`).join('、')
      :'本場未取得素材';

    const back=document.createElement('div');
    back.className='r526-reward-toast-back';
    back.innerHTML=`<div class="r526-reward-toast">
      <h3>⚔️ 戰鬥勝利</h3>
      <div class="reward-line">擊敗 ${String(enemyName||'妖物')}</div>
      <div class="reward-line">修為 +${Number(exp||0)}　靈幣 +${Number(coins||0)}</div>
      <div class="reward-line">素材／材料：${materialText}</div>
      <div class="hint">點擊任意處關閉</div>
    </div>`;
    back.addEventListener('click',()=>back.remove(),{once:true});
    document.body.appendChild(back);
  };
  window.r526RewardPopup=r526RewardPopup;

  window.TEST_V5_MINE_WIN_ONLY_CHARGE=true;
  window.TEST_V5_REWARD_MATERIAL_LINE=true;
})();
</script>


<style id="rWantedLaw-v7-style">
