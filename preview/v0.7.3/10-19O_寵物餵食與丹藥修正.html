<!doctype html><meta charset="utf-8"><title>寵物每日餵食與丹藥說明</title><h1>改動</h1><p>每隻寵物每日最多吃3個飼料、1個餅乾；各自計算，遊戲時間00:00重置，讀檔及改名不重置次數。成功餵食才計次；超量不扣道具。</p><h2>BUG修復</h2><p>迅獸丹身+10%、獸戰丹攻與道各+8%、護獸丹防與道防各+10%，皆為寵物戰前使用、下一場持續3回合。補齊背包與萬獸檯兌換說明，原效果不變。</p><h2>測試</h2><p>6項功能驗收通過，含實際兌換與寵物使用、三回合增益、各寵物每日上限、午夜重置、存讀檔及不成功餵食不扣次數。</p>
