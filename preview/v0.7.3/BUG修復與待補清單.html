<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUG修復與待補清單</title><style>body{background:#081720;color:#d8e5eb;font:16px/1.9 "Microsoft JhengHei",sans-serif;margin:0}main{max-width:1400px;margin:auto;padding:28px}a{color:#f0d592}h1,h2,h3{color:#ead1a0}section{background:#102630;border:1px solid #365363;padding:20px;border-radius:12px;margin:18px 0}table{border-collapse:collapse;width:100%}th,td{border:1px solid #365363;padding:9px;text-align:left;vertical-align:top}img{max-width:100%}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.gallery figure{margin:0;text-align:center;background:#112b39;border:1px solid #365363;border-radius:9px;padding:8px}.gallery img{width:130px;height:130px;object-fit:contain}.people img{height:270px}.note{color:#a9c1cc}</style><main><p><a href="閱讀我_先看這裡.html">交付目錄</a> · <a href="index.html">開啟遊戲</a></p><h1>BUG修復與待補清單</h1><section><h2>本輪修復</h2><p>深窟位置與路線、A路線測試前置、圖鑑返回捲動、幫助底部裁切、製作成品圖、物品缺圖、丹藥百分比文字、初始寵物技能，以及長右戰的立繪、血條、狀態與階段演出。</p><h2>保留事項</h2><p>其餘七種特殊狀態依先前確認保留於遊戲，沒有新增施加功法。未登錄取得途徑的物品顯示來源未知，沒有新增掉落或商店。</p><p>素材原圖69張沿用；新增71類物品美術共用於對應物品，名稱與階級另外顯示。不是每件同類裝備各生成一張不同圖片。8張全身圖只用於長右戰，其他已驗收人物圖保留。</p><p>完整手動主線測試使用提高能力的隔離角色，以驗證流程，不代表長右數值平衡已由玩家驗收。</p></section></main></html>
