<div id="start" class="screen"><div class="panel start"><h1>九州修仙錄</h1><p class="sub">王朝213年・萬世沙盒版。九州會自行運轉，NPC會成長、結婚、生子、死亡；宗門與王朝也會興衰。</p><label>姓名</label><input id="name" placeholder="輸入你的名字"><label>年齡</label><input id="age" type="number" min="12" max="80" value="16"><label>性別</label><select id="gender"><option>少年</option><option>少女</option></select><button class="primary" id="startBtn" type="button">踏入修仙路</button> <button id="continueBtn" type="button" class="hidden">▶️ 繼續遊戲</button> <button id="startSaveBtn" type="button" onclick="openSaveManager(true)">💾 存檔管理</button><div id="startStatus" class="sub" style="margin-top:10px"></div></div></div>

<script>

const realmNames=['練氣','築基','金丹','元嬰','化神','煉虛','合體','大乘','渡劫','真仙','天仙','帝仙','神帝'];
const dynasties=[

['西州','玄嶽王朝','萬山古礦、劍修盛行','玄嶽城','萬劍山','黑石礦脈','斷天峽','金風谷','古獸原'],
['南州','南離王朝','炎域、火山與丹道','離火皇城','赤炎山','百藥谷','朱雀湖','熔岩古窟','南荒雨林'],
['北州','寒霄王朝','冰原、雪山與冰靈根勢力','寒霄城','雪魂嶺','萬年冰湖','北境長城','玄冰宮','極夜原'],
['東北州','滄瀾王朝','江河水網與水修','滄瀾城','千河澤','鏡月湖','潮生門','霧隱林','龍鯉江'],
['西北州','天衡王朝','高原天關、陣修與軍修','天衡關','星落高原','風骨城','黃沙古道','鎮魔堡','天梯山'],
['西南州','赤霄王朝','赤土荒漠、毒谷與獸修','赤霄城','萬毒谷','荒骨沙海','獸王坡','血月綠洲','古蟲窟'],
['東南州','扶桑王朝','群島海國、木修與海修','扶桑京','青木島','珊瑚海','萬潮港','日輪山','海皇礁'],
['中州','太初王朝','九州核心、頂尖宗門匯聚','太初帝都','天機城','道玄山','萬法湖','九州塔','中天平原']];
const placeInfo={};dynasties.forEach(d=>d.slice(3).forEach((p,i)=>placeInfo[p]={州:d[0],王朝:d[1],desc:d[2],danger:Math.min(8,1+i)}));
Object.assign(placeInfo,{'龍墟外海':{州:'碎海',王朝:'無',desc:'古龍沉眠之海，高境界妖獸頻出。',danger:8},'九天浮島群':{州:'天空',王朝:'無',desc:'雲海之上的浮島群，需要飛行或傳送。',danger:7},'幽冥地脈':{州:'地下',王朝:'無',desc:'九州地下交錯的陰靈地脈。',danger:6},'仙門天域':{州:'仙界',王朝:'無',desc:'渡劫飛升後才能踏足的仙界入口。',danger:10}});
const sectTemplates=[['青雲宗','劍修','大御王朝'],['萬法宗','法修','太初王朝'],['玄丹谷','丹修','南離王朝'],['天器門','器修','玄嶽王朝'],['寒月宮','冰法','寒霄王朝'],['潮生門','水法','滄瀾王朝'],['鎮魔殿','體修','天衡王朝'],['御獸山','獸修','赤霄王朝'],['扶桑仙庭','木法','扶桑王朝'],['無極劍宗','劍修','太初王朝'],['百草門','醫修','南離王朝'],['九霄雷宗','雷法','大御王朝']];
const surnames=['蘇','林','沈','白','葉','楚','顧','江','陸','秦','洛','蕭','唐','寧','柳','謝','慕容','司徒','夏','方','韓','季'];
const given=['璃','野','清宵','雨棠','星河','墨','玄','凌霜','若雪','雲舒','青禾','長風','念安','子衿','寒煙','景行','問天','月凝','昭寧','流螢','千嵐','無塵'];
const monsterBases=['青牙狼','赤羽鷹','石甲蜥','黑背熊','毒尾蠍','霧影狐','鐵角牛','噬靈鼠','碧眼蛇','火紋虎','潮牙妖魚','赤甲蟹妖','幽骨蛛','風刃螳螂','冰魄猿','裂地犀','赤焰鳥','陰魂','血蝠','木靈鹿','雷角獸','沙海蜈蚣','玄水龜','腐骨犬','鬼面猿','紫晶蟲','雲翼鶴','黑潮鯊','靈竹妖','山魈'];
const specialPrefixes=['月蝕','雷獄','玄冰','熔心','鏡影','腐星','龍血','幽冥','九目','天音','無相','金骨'];
const bossTitles=['王','皇','領主','古獸','災主','霸主','妖尊','異種母體'];
const techTree=[['吐納訣','輔助','修煉效率+10%',30],['青鋒劍訣','物理','劍類傷害+15%',55],['烈火術','靈力','火靈根法術',45],['水靈盾','輔助','戰鬥防禦提升',45],['回春術','治療','消耗靈力恢復HP',60],['御風步','輔助','提高逃跑與先手',65],['雷鳴訣','靈力','雷系高爆發',80],['冰魄封脈','靈力','冰系控制',85],['大地護體','輔助','大幅提高防禦',80],['萬木回生','治療','高級持續恢復',95]];
const recipes={pill:[['［初階］回元丹',{'普通靈草':2,'妖核碎片':1},'恢復HP 25'],['［中階］凝靈丹',{'靈露':2,'妖核碎片':2},'恢復靈力 35'],['［高階］破境丹',{'百年靈草':2,'高階妖核':1},'突破成功率提高'],['［仙階］九轉還天丹',{'仙靈草':3,'仙獸妖核':1},'解除重傷與渡劫虛弱']],gear:[['［初階］青鋒劍',{'玄鐵':3,'妖骨':1},'攻+8'],['［中階］玄甲衣',{'玄鐵':4,'妖皮':2},'防+14'],['［高階］雷紋槍',{'雷晶':3,'高階妖骨':2},'攻+28'],['［仙階］太虛仙衣',{'仙金':4,'仙獸皮':2},'防+60']]};
let s=null,tabNow='adventure',enemy=null;
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1))}function pick(a){return a[Math.floor(Math.random()*a.length)]}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function realmPower(realm){let i=realmNames.findIndex(x=>realm.startsWith(x));if(i<0)return 1;if(i===8)return 81;if(i>=9)return 100+(i-9)*45;let lv=parseInt(realm.match(/\d+/)?.[0]||1);return i*10+lv}
function phaseOf(realm){let n=parseInt(realm.match(/\d+/)?.[0]||0);if(!n)return '';return n<=3?'初期':n<=6?'中期':n<=9?'後期':'圓滿'}
function makeNPC(i){let sex=Math.random()<.5?'男':'女',age=rint(14,78),pow=rint(1,62),rn=realmNames[Math.floor((pow-1)/10)]||'練氣',lv=(pow-1)%10+1,realm=rn+lv+'層';let sect=Math.random()<.7?pick(sectTemplates)[0]:'散修';return{id:'n'+i,name:pick(surnames)+pick(given),gender:sex,age,realm,sect,aff:rint(-8,18),alive:true,married:false,partner:null,children:[],place:pick(Object.keys(placeInfo).filter(x=>placeInfo[x].danger<=6)),personality:pick(['冷淡','豪爽','溫柔','謹慎','傲氣','貪財','正直','陰沉','好戰']),talent:rint(1,100),wealth:rint(10,4000),role:sect==='散修'?'散修':pick(['外門弟子','內門弟子','真傳弟子','執事']),injured:false}}
function generateMonsterPool(){let a=[];for(let i=0;i<360;i++){let base=pick(monsterBases),tier=i<220?'一般種':i<320?'特殊種':'高危種',name=tier==='一般種'?base:tier==='特殊種'?pick(specialPrefixes)+base:pick(specialPrefixes)+base+pick(bossTitles);a.push({id:'m'+i,name,tier,base,danger:tier==='一般種'?rint(1,6):tier==='特殊種'?rint(2,8):rint(4,10),skill:tier==='一般種'?pick(['撕咬','猛撲','尾擊','毒牙']):tier==='特殊種'?pick(['鏡影分身','雷獄吐息','冰封脈絡','腐蝕靈霧','龍血狂化','月蝕隱匿']):pick(['領域威壓','災厄吐息','召喚族群','妖核爆發','天地異變']),look:tier==='一般種'?'常見妖獸外形':tier==='特殊種'?pick(['雙尾異瞳','晶化甲殼','漂浮骨翼','發光靈紋','多重瞳孔','半透明軀體']):pick(['山岳般巨軀','王冠骨角','環繞雷雲','黑日妖輪','九首異形'])})}return a}
function startGame(){document.getElementById('startStatus').textContent='正在生成九州世界與3,000名NPC…';setTimeout(()=>{try{let name=document.getElementById('name').value.trim()||'無名',age=+document.getElementById('age').value||16,gender=document.getElementById('gender').value;let npcs=[];for(let i=0;i<3000;i++)npcs.push(makeNPC(i));s={name,age,gender,year:213,day:1,hour:8,place:'青陽鎮',layer:'地面',root:pick(roots),realm:'練氣一層',hp:100,maxhp:100,mp:35,maxmp:35,atk:8,def:6,agi:7,stones:500,exp:0,expNeed:100,karma:0,insight:0,cultivationDays:0,breakPrep:0,techs:['基礎吐納'],skills:[],materials:{'普通靈草':2,'玄鐵':0,'妖骨':0,'妖皮':0,'妖核碎片':0,'靈露':0},bag:[['［初階］低級生命藥水',3,'❤️ HP +10'],['［初階］低級靈力藥水',3,'🔵 靈力 +10'],['母親的姻緣戒指',1,'💍 可送予戀愛對象觸發婚姻']],equip:{武器:'無',頭:'無',衣:'［初階］新手布衣（防+3）',褲:'［初階］新手布褲（防+2）',鞋:'［初階］新手布鞋（防+1）',項鍊:'無',戒指:'無',配飾:'無'},sect:null,sectRank:null,sectRep:0,spouse:null,children:[],npcs,monsterPool:generateMonsterPool(),sects:sectTemplates.map((x,i)=>({id:i,name:x[0],type:x[1],dyn:x[2],power:rint(45,95),treasury:rint(20000,300000),relations:{},war:null})),wars:[],worldEvents:[],auction:[],marketSeed:rint(1,999999),log:[],kills:{一般種:0,特殊種:0,高危種:0},tribulation:null,immortal:false};document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');log('📜 你背起行囊，告別父母。父親交給你500靈石，母親將姻緣戒指放入你的掌心。');log('🌿 靈根覺醒：'+s.root+'。青陽鎮外，九州萬象正在自行運轉。');seedAuction();tab('adventure');render()}catch(err){console.error(err);document.getElementById('startStatus').textContent='啟動失敗：'+err.message}},30)}
function log(x){s.log.unshift(x);if(s.log.length>150)s.log.pop()}
function advance(h=1){s.hour+=h;while(s.hour>=24){s.hour-=24;s.day++;if(s.tribulation&&s.maxhpBackup){s.tribulation.hours=(s.tribulation.hours||0)+24;if(s.tribulation.hours>=24){s.maxhp=s.maxhpBackup;delete s.maxhpBackup;s.hp=Math.min(s.maxhp,Math.max(s.hp,Math.floor(s.maxhp*.45)));s.tribulation=null;log('🌿 渡劫重傷經過24小時調養，最大氣血恢復正常。')}}if(s.day%5===0)npcTick();if(s.day%7===0)worldTick();if(s.day>360){s.day-=360;s.year++;generationTick()}}}
function npcTick(){for(let k=0;k<80;k++){let n=pick(s.npcs);if(!n.alive)continue;n.age+=(Math.random()<.03?1:0);if(Math.random()<.12&&realmPower(n.realm)<80){let p=realmPower(n.realm)+1,nr=realmNames[Math.floor((p-1)/10)]||'大乘',lv=(p-1)%10+1;n.realm=nr+lv+'層'}if(!n.married&&n.age>=18&&Math.random()<.015){let mate=pick(s.npcs);if(mate.alive&&!mate.married&&mate.gender!==n.gender&&mate.age>=18){n.married=mate.married=true;n.partner=mate.id;mate.partner=n.id}}if(n.married&&n.age<55&&Math.random()<.012){let child=makeNPC(s.npcs.length);child.age=0;child.realm='練氣一層';child.place=n.place;child.sect='無';s.npcs.push(child);n.children.push(child.id)}if(n.age>85&&Math.random()<.05)n.alive=false}}
function generationTick(){log('🕰️ 新的一年來臨。九州人口、宗門與勢力格局持續變化。');s.npcs.forEach(n=>{if(n.alive)n.age++});}
function worldTick(){if(Math.random()<.45)startWar();if(Math.random()<.55){let e=pick(['🌩️ 東州雷暴異變，雷屬性特殊種妖獸出沒。','🐉 碎海龍族遷徙，沿岸城池提高警戒。','🌠 中州降下星隕，隕星材料價格上漲。','🌫️ 幽冥地脈滲出陰氣，地下入口暫時活躍。','🌸 百年靈花盛開，各宗門派出弟子爭奪。']);s.worldEvents.unshift(e);log('🌏 世界大事件：'+e)}seedAuction()}
function startWar(){let a=pick(dynasties),b=pick(dynasties);if(a[1]===b[1])return;let key=[a[1],b[1]].sort().join('|');if(s.wars.some(w=>w.key===key&&w.active))return;s.wars.push({key,a:a[1],b:b[1],active:true,start:`${s.year}/${s.day}`,scoreA:0,scoreB:0});log(`⚔️ 世界戰爭：${a[1]} 與 ${b[1]} 正式開戰！邊境商路、物價與宗門任務都受到影響。`)}
function render(){document.getElementById('worldtime').textContent=`王朝${s.year}年・第${s.day}日・${String(s.hour).padStart(2,'0')}:00・${s.place}・${s.layer}`;let p=realmPower(s.realm);document.getElementById('char').innerHTML=`<b>${s.gender} ${s.name}</b><br><span class="gold">${s.realm} ${phaseOf(s.realm)}</span><br>🌿 靈根：${s.root}<div class="stat">❤️ HP <span>${s.hp}/${s.maxhp}</span></div><div class="bar"><i style="width:${100*s.hp/s.maxhp}%"></i></div><div class="stat">🔵 靈力 <span>${s.mp}/${s.maxmp}</span></div><div class="bar mp"><i style="width:${100*s.mp/s.maxmp}%"></i></div><div class="stat">✨ 修為 <span>${s.exp}/${s.expNeed}</span></div><div class="bar xp"><i style="width:${100*s.exp/s.expNeed}%"></i></div><div class="stats"><div class="stat">⚔️ 攻擊 <span>${s.atk}</span></div><div class="stat">🛡️ 防禦 <span>${s.def}</span></div><div class="stat">💨 身法 <span>${s.agi}</span></div><div class="stat">💰 靈石 <span>${s.stones}</span></div><div class="stat">☯️ 戰力階 <span>${p}</span></div></div>`;let c=document.getElementById('content');({adventure,bag,cult,sect,npc,market,craft,world,chronicle}[tabNow]||adventure)(c);autoSave()}
function tab(t){tabNow=t;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+t)?.classList.add('active');render()}
function nearbyPlaces(){let cur=placeInfo[s.place]||placeInfo['青陽鎮'],same=Object.keys(placeInfo).filter(x=>x!==s.place&&placeInfo[x].王朝===cur.王朝);let easy=same.filter(x=>placeInfo[x].danger<=cur.danger+2);return easy.slice(0,4)}
function adventure(c){let pi=placeInfo[s.place]||{州:'未知',王朝:'無',desc:'未知之地',danger:5};c.innerHTML=`<div class="mapbox"><h2>🗺️ ${s.place}</h2><p>${pi.desc}</p><span class="pill">${pi.州}</span> <span class="pill">${pi.王朝}</span> <span class="pill ${pi.danger>=7?'danger':'safe'}">危險度 ${pi.danger}/10</span><div class="choices">${nearbyPlaces().map((p,i)=>`<button onclick="move('${p}')">${i+1}. 前往 ${p}</button>`).join('')}<button onclick="searchArea()">🔎 探索附近</button><button onclick="cultivate()">🧘 閉關修煉</button><button onclick="localEvent()">🌦️ 觀察異象</button><button onclick="travelLayer()">☁️/🌑 世界層</button></div></div><h3>📜 冒險紀錄</h3><div class="log">${s.log.map(x=>`<div class="entry">${x}</div>`).join('')}</div>`}
function move(p){let d=placeInfo[p]?.danger||5;if(d>Math.ceil(realmPower(s.realm)/10)+4){log('⚠️ 你感覺該區域遠超目前實力，暫時沒有貿然深入。');render();return}advance(2);s.place=p;s.layer=p==='九天浮島群'?'天空':p==='幽冥地脈'?'地下':p==='仙門天域'?'仙界':'地面';log('🧭 你前往【'+p+'】。');if(Math.random()<.28)searchArea();render()}
function localEvent(){advance(1);if(!s.root.includes('光耀')&&!s.root.includes('混沌')&&Math.random()<.008){let nr=Math.random()<.65?'✨光耀':'☯️混沌';showModal(`<h2>🌌 不可思議的靈根異變</h2><p>你在極罕見的天地異象中接觸到【${nr}】本源。這不是出生抽取能得到的力量。</p><div class="choices"><button onclick="acceptRareRoot('${nr}')">承受本源，嘗試轉化靈根</button><button onclick="closeModal()">放棄</button></div>`);return}let e=pick(['🌩️ 突然雷雨大作，附近出現帶電妖獸與雷晶。','🌫️ 山霧中出現短暫秘境入口。','🩸 地面出現獸血痕跡，似乎有受傷的高階妖獸經過。','🌿 靈氣潮汐湧來，今天修煉效率提高。']);log('📍 小事件：'+e);if(Math.random()<.5)searchArea();render()}function acceptRareRoot(nr){let ok=Math.random()<.36;if(ok){s.root=nr;log('🌌 你承受住本源洗禮，靈根蛻變為極罕見的【'+nr+'】！')}else{log('💥 本源過於霸道，你轉化失敗，但從中獲得2點道意。');s.insight+=2;s.hp=Math.max(1,Math.floor(s.hp*.5))}closeModal();render()}
function travelLayer(){let opts=[];if(realmPower(s.realm)>=40)opts.push(`<button onclick="move('九天浮島群')">☁️ 飛往九天浮島群</button>`);opts.push(`<button onclick="move('幽冥地脈')">🌑 探入幽冥地脈</button>`);if(s.immortal)opts.push(`<button onclick="move('仙門天域')">✨ 登臨仙界</button>`);showModal(`<h2>🌌 三層世界</h2><p class="sub">地下、地面、天空彼此連接；飛升後可進入仙界。</p><div class="choices">${opts.join('')}<button onclick="closeModal()">返回</button></div>`)}
function cultivate(){advance(8);s.cultivationDays++;let bonus=s.techs.includes('吐納訣')?1.15:1,g=rint(6,12)*bonus;s.exp=Math.min(s.expNeed,Math.floor(s.exp+g));if(Math.random()<.3)s.insight++;s.mp=s.maxmp;log(`🧘 閉關8小時，修為 +${Math.floor(g)}。${Math.random()<.3?'💡 對大道多了一分理解。':''}`);if(s.exp>=s.expNeed)log('✨ 修為已滿，請到「📖 修煉」準備突破。');render()}
function searchArea(){advance(2);let roll=Math.random();if(roll<.55)encounter();else if(roll<.7){let g=rint(18,100);s.stones+=g;log(`💰 發現遺落靈石 ${g}。`)}else if(roll<.84){let mat=pick(['普通靈草','玄鐵','妖骨','妖皮','靈露']);s.materials[mat]=(s.materials[mat]||0)+rint(1,2);log('🌿 採集到 '+mat+'。')}else{let n=pick(s.npcs.filter(n=>n.alive));n.place=s.place;log(`🌸 你在附近遇到 ${n.name}（${n.realm}・${n.sect}）。`)}render()}
function eligibleMonsters(){let d=placeInfo[s.place]?.danger||3,p=realmPower(s.realm),cap=Math.ceil(p/10)+2;return s.monsterPool.filter(m=>m.danger<=Math.min(10,d+1)&&m.danger<=cap+(m.tier==='高危種'?0:2))}
function encounter(){let pool=eligibleMonsters();let m=pick(pool.length?pool:s.monsterPool.filter(x=>x.tier==='一般種'&&x.danger<=2));let scale=Math.max(1,m.danger),isBoss=m.tier==='高危種',hp=55+scale*28+(isBoss?120:0),atk=7+scale*5+(isBoss?12:0),def=2+scale*3,mp=m.tier==='一般種'?rint(0,18):rint(25,80);enemy={...m,hp,maxhp:hp,atk,def,mp,maxmp:mp};refreshCombat()}
function tierTag(t){return t==='一般種'?'<span class="tag-common">一般種</span>':t==='特殊種'?'<span class="tag-special">特殊種</span>':'<span class="tag-boss">⚠ 高危種・BOSS</span>'}
function refreshCombat(){if(!enemy){closeModal();return}showModal(`<h2>⚔️ 戰鬥</h2><div class="card"><b>👾 ${enemy.name}</b> ${tierTag(enemy.tier)}<br>特徵：${enemy.look}<br>招牌技能：${enemy.skill}<br>❤️ HP：${enemy.hp}/${enemy.maxhp}　🔵 靈力：${enemy.mp}/${enemy.maxmp}</div><div class="card"><b>🧘 ${s.name}</b><br>${s.realm} ${phaseOf(s.realm)}<br>❤️ ${s.hp}/${s.maxhp}　🔵 ${s.mp}/${s.maxmp}</div><div class="choices"><button onclick="attack()">⚔️ ① 攻擊（當前武器）</button><button onclick="skillMenu()">✨ ② 使用技能與功法</button><button onclick="defend()">🛡️ ③ 防禦</button><button onclick="flee()">🏃 ④ 逃跑</button><button onclick="usePotion()">🎒 ⑤ 使用道具或丹藥</button></div>`)}
function enemyTurn(reduce=0){let spell=enemy.mp>=8&&Math.random()<(enemy.tier==='一般種'?.2:.55),dmg;if(spell){enemy.mp-=8;dmg=Math.max(1,enemy.atk+7-s.def+ rint(0,7)-reduce);log(`🌀 ${enemy.name} 施展【${enemy.skill}】，造成 ${dmg} 傷害！`)}else{dmg=Math.max(1,enemy.atk-s.def+rint(0,5)-reduce);log(`💥 ${enemy.name} 攻擊你，造成 ${dmg} 傷害。`)}s.hp-=dmg;if(s.hp<=0){s.hp=1;log('☠️ 你重傷倒地，被附近修士救回安全處。');enemy=null;closeModal();return true}return false}
function attack(){let dmg=Math.max(1,s.atk-enemy.def+rint(1,9));enemy.hp-=dmg;log(`⚔️ 你造成 ${dmg} 傷害。`);if(enemy.hp<=0)return win();enemyTurn();refreshCombat()}
function skillMenu(){let opts=s.skills.length?s.skills:['靈力爆發'];showModal(`<h2>✨ 技能與功法</h2><div class="choices">${opts.map((x,i)=>`<button onclick="useSkill('${x}')">${i+1}. ${x}</button>`).join('')}<button onclick="refreshCombat()">返回戰鬥</button></div>`)}
function useSkill(name){if(s.mp<8){log('🔵 靈力不足。');refreshCombat();return}s.mp-=8;let mult=name.includes('雷')?1.6:name.includes('劍')?1.35:name.includes('回春')?0:1.2;if(name.includes('回春')){s.hp=Math.min(s.maxhp,s.hp+35);log('🌿 回春術恢復35 HP。')}else{let dmg=Math.max(3,Math.floor((s.atk+12)*mult)-enemy.def+rint(0,9));enemy.hp-=dmg;log(`✨ 施展【${name}】，造成 ${dmg} 傷害。`)}if(enemy&&enemy.hp<=0)return win();if(enemy)enemyTurn();refreshCombat()}
function defend(){if(!enemyTurn(8))refreshCombat()}function flee(){let chance=.62+s.agi/200-(enemy.tier==='高危種'?.2:0);if(Math.random()<chance){log('🏃 成功脫離戰場。');enemy=null;closeModal();render()}else{log('🏃 逃跑失敗！');if(!enemyTurn())refreshCombat()}}
function usePotion(){let hp=s.bag.find(x=>x[0].includes('生命')&&x[1]>0),mp=s.bag.find(x=>x[0].includes('靈力')&&x[1]>0),x=s.hp<s.maxhp?hp:mp;if(!x){log('🎒 沒有可用的低級藥水。');refreshCombat();return}x[1]--;if(x[0].includes('生命'))s.hp=Math.min(s.maxhp,s.hp+10);else s.mp=Math.min(s.maxmp,s.mp+10);log('🧪 使用 '+x[0]+'。');if(!enemyTurn())refreshCombat()}
function win(){let t=enemy.tier,reward=t==='一般種'?rint(15,45):t==='特殊種'?rint(55,140):rint(180,650),xp=t==='一般種'?12:t==='特殊種'?28:75;s.stones+=reward;s.exp=Math.min(s.expNeed,s.exp+xp);s.kills[t]++;s.materials['妖核碎片']=(s.materials['妖核碎片']||0)+(t==='一般種'?1:2);if(t!=='一般種')s.materials[t==='高危種'?'高階妖核':'妖骨']=(s.materials[t==='高危種'?'高階妖核':'妖骨']||0)+1;log(`🏆 擊敗 ${enemy.name}【${t}】，獲得 ${reward} 靈石、${xp} 修為。`);if(t==='高危種')log('👑 高危種討伐成功！附近勢力對你的名聲有所提升。');enemy=null;closeModal();render()}
function bag(c){c.innerHTML=`<h2>🎒 背包與裝備</h2><div class="cards">${s.bag.map(x=>`<div class="card"><b>${x[0]}</b><br>數量：${x[1]}<br><span class="sub">${x[2]}</span></div>`).join('')}</div><h3>🧱 材料</h3><div class="cards">${Object.entries(s.materials).map(([k,v])=>`<div class="card">${k}：<b>${v}</b></div>`).join('')}</div><h3>🧥 裝備</h3><div class="equip">${Object.entries(s.equip).map(([k,v])=>`<div>${k}：${v}</div>`).join('')}</div>`}
function cult(c){let ready=s.exp>=s.expNeed;c.innerHTML=`<h2>📖 修煉與功法樹</h2><div class="card">境界：<b class="gold">${s.realm} ${phaseOf(s.realm)}</b><br>修為：${s.exp}/${s.expNeed}<br>💡 道意：${s.insight}<br>🧘 閉關天數：${s.cultivationDays}<br>⚔️ 生死歷練：${s.kills.特殊種+s.kills.高危種}</div><h3>🌳 功法樹</h3><div class="cards">${techTree.map(t=>`<div class="card"><b>${t[0]}</b> <span class="pill">${t[1]}</span><br>${t[2]}<br>${s.techs.includes(t[0])||s.skills.includes(t[0])?'<span class="green">已習得</span>':`<button onclick="learnTech('${t[0]}',${t[3]})">領悟 ${t[3]} 靈石</button>`}</div>`).join('')}</div><h3>✨ 突破</h3><div class="card">突破不只看修為：需要功法、閉關、戰鬥或道意等條件。<br><br><button class="primary" onclick="breakthrough()" ${ready?'':'disabled'}>${ready?'嘗試突破':'修為尚未圓滿'}</button></div>`}
function learnTech(n,cost){if(s.stones<cost)return log('💰 靈石不足。'),render();s.stones-=cost;if(['青鋒劍訣','烈火術','水靈盾','回春術','御風步','雷鳴訣','冰魄封脈','大地護體','萬木回生'].includes(n))s.skills.push(n);else s.techs.push(n);log('📖 你領悟了【'+n+'】。');render()}
function breakthrough(){if(s.exp<s.expNeed)return;if(s.immortal)return immortalBreakthrough();let p=realmPower(s.realm),major=Math.floor((p-1)/10),lv=(p-1)%10+1;if(p>=80)return startTribulation();let reqInsight=major+1;if(s.insight<reqInsight||s.cultivationDays<major+1){log(`⚠️ 突破準備不足：至少需要 ${reqInsight} 道意與 ${major+1} 次閉關積累。`);render();return}let chance=.78+Math.min(.15,(s.kills.特殊種+s.kills.高危種)*.01);if(Math.random()>chance){s.exp=Math.floor(s.expNeed*.72);s.hp=Math.max(1,Math.floor(s.maxhp*.4));log('💥 突破失敗，經脈受創，修為回落。');render();return}s.insight-=reqInsight;s.exp=0;if(lv<10){lv++;s.realm=realmNames[major]+lv+'層'}else{s.realm=realmNames[major+1]+'1層'}s.expNeed=Math.floor(s.expNeed*1.28+35);s.maxhp+=18+major*6;s.maxmp+=7+major*3;s.atk+=4+major;s.def+=3+major;s.hp=s.maxhp;s.mp=s.maxmp;log('✨ 天地靈氣匯聚——突破成功！晉入【'+s.realm+'】。');render()}function immortalBreakthrough(){let order=['真仙','天仙','帝仙','神帝'],cur=order.findIndex(x=>s.realm.startsWith(x));if(cur<0)cur=0;if(cur===3){log('👑 你已位列神帝，修仙世界的最高境界。');render();return}let needInsight=[12,20,32][cur],needBoss=[3,8,15][cur];if(s.insight<needInsight||s.kills.高危種<needBoss){log(`✨ 仙境突破條件不足：需要道意 ${needInsight}、高危種討伐 ${needBoss}。${cur>=1?' 帝仙以上還象徵仙域與天命的承認。':''}`);render();return}let chance=[.62,.48,.32][cur]+Math.min(.18,s.cultivationDays/200);if(Math.random()>chance){s.exp=Math.floor(s.expNeed*.65);s.hp=Math.max(1,Math.floor(s.maxhp*.35));log('🌌 仙道突破失敗，仙軀受創，但境界未跌落。');render();return}s.insight-=needInsight;s.exp=0;s.realm=order[cur+1];s.expNeed=Math.floor(s.expNeed*2.1);s.maxhp+=250*(cur+1);s.maxmp+=180*(cur+1);s.atk+=90*(cur+1);s.def+=70*(cur+1);s.hp=s.maxhp;s.mp=s.maxmp;if(s.realm==='帝仙')log('👑 你凝聚「帝道領域」，踏入【帝仙】！');else if(s.realm==='神帝')log('🌌👑 九州天命共鳴，神帝劫散去——你登臨世界最高境界【神帝】！');else log('✨ 你跨越仙道天關，晉升【'+s.realm+'】！');render()}
function startTribulation(){showModal(`<h2>🌩️ 渡劫</h2><p>你已觸及凡界極限。渡劫將依照所在地、道意、戰鬥經歷與資源判定。</p><div class="card">失敗：跌回大乘五層、HP=1、最大HP暫時30，24小時後自然恢復，或使用仙階療傷手段。</div><div class="choices"><button class="primary" onclick="doTribulation()">引動天劫</button><button onclick="closeModal()">暫緩</button></div>`)}
function doTribulation(){let score=s.insight*4+s.kills.高危種*5+s.cultivationDays*.7+(placeInfo[s.place]?.danger||1)*2,chance=clamp(.25+score/100,.25,.82);if(Math.random()<chance){s.realm='真仙';s.immortal=true;s.exp=0;s.expNeed=900;s.maxhp+=180;s.maxmp+=120;s.atk+=55;s.def+=45;s.hp=s.maxhp;s.mp=s.maxmp;log('🌩️✨ 九重天雷散去——你渡劫成功，飛升【真仙】！仙門天域已開啟。')}else{s.realm='大乘5層';s.hp=1;s.maxhpBackup=s.maxhp;s.maxhp=30;s.tribulation={hours:0};log('🌩️💥 渡劫失敗！你跌回大乘五層，HP=1，最大HP暫時降至30。')}closeModal();render()}
function sect(c){let mine=s.sect?`<div class="card"><b>${s.sect}</b><br>身份：${s.sectRank}<br>宗門聲望：${s.sectRep}<div class="choices"><button onclick="sectTask()">📜 宗門任務</button><button onclick="sectPromote()">⬆️ 申請晉升</button><button onclick="leaveSect()">🚪 退出宗門</button></div></div>`:'<div class="card">你目前是散修，可加入宗門；大型宗門可能要求比試、繳費或聲望。</div>';c.innerHTML=`<h2>🏯 宗門系統</h2>${mine}<h3>九州宗門</h3><div class="cards">${s.sects.map((x,i)=>`<div class="card"><b>${x.name}</b><br>${x.type}・${x.dyn}<br>勢力：${x.power}/100<br>${!s.sect?`<button onclick="joinSect(${i})">申請入宗</button>`:''}</div>`).join('')}<div class="card"><b>🏗️ 自創宗門</b><br>條件：金丹以上、20,000靈石、名望基礎。<br><button onclick="createSect()">建立宗門</button></div></div>`}
function joinSect(i){if(s.sect)return;let x=s.sects[i],fee=x.power>80?300:100;if(s.stones<fee)return log(`💰 ${x.name} 要求繳納 ${fee} 靈石，你的靈石不足。`),render();let trial=Math.random()<.65+realmPower(s.realm)/150;if(!trial)return log(`⚔️ ${x.name} 入門比試失敗。你可以日後再來。`),render();s.stones-=fee;s.sect=x.name;s.sectRank='外門弟子';s.sectRep=5;log(`🏯 通過考核，加入【${x.name}】成為外門弟子。`);render()}
function sectTask(){advance(6);let gain=rint(6,16),money=rint(30,90);s.sectRep+=gain;s.stones+=money;s.exp=Math.min(s.expNeed,s.exp+10);log(`📜 完成宗門任務：聲望 +${gain}、靈石 +${money}。`);render()}
function sectPromote(){let ranks=['外門弟子','內門弟子','真傳弟子','長老'];let i=ranks.indexOf(s.sectRank),need=[30,80,160,300][i];if(i<0||i>=3)return log('🏯 你目前已是宗門高層。'),render();if(s.sectRep<need)return log(`⚠️ 晉升需要宗門聲望 ${need}。`),render();s.sectRank=ranks[i+1];log('⬆️ 你晉升為【'+s.sectRank+'】！');render()}
function leaveSect(){log('🚪 你退出了 '+s.sect+'。');s.sect=null;s.sectRank=null;s.sectRep=0;render()}function createSect(){if(realmPower(s.realm)<21||s.stones<20000)return log('⚠️ 自創宗門需要金丹境與20,000靈石。'),render();s.stones-=20000;s.sect=s.name+'仙宗';s.sectRank='宗主';s.sectRep=100;log('🏯 你建立了自己的宗門【'+s.sect+'】！');render()}
function npc(c){let near=s.npcs.filter(n=>n.alive&&n.place===s.place).slice(0,8);if(near.length<5){for(let i=0;i<6;i++){let n=pick(s.npcs.filter(n=>n.alive));n.place=s.place}near=s.npcs.filter(n=>n.alive&&n.place===s.place).slice(0,8)}c.innerHTML=`<h2>🌸 NPC人生模擬</h2><p class="sub">世界目前生成 ${s.npcs.length.toLocaleString()} 名NPC。NPC可突破、受傷、死亡、換宗門、結婚與生子。</p><div class="cards">${near.map(n=>`<div class="card"><b>${n.gender==='女'?'🌸':'🗡️'} ${n.name}</b><br>${n.realm}・${n.sect}<br>${n.age}歲・${n.personality}<br>好感度：${n.aff}/100<br>${n.married?'💍 已婚':''}<div class="choices"><button onclick="npcAct('${n.id}','chat')">💬 交談</button><button onclick="npcAct('${n.id}','gift')">🎁 贈禮</button><button onclick="npcAct('${n.id}','attack')">⚔️ 攻擊</button><button onclick="npcAct('${n.id}','rob')">💰 搶奪</button>${n.gender!== (s.gender==='少女'?'女':'男')&&n.aff>=65&&!n.married?`<button onclick="npcAct('${n.id}','love')">💗 表明心意</button>`:''}${n.aff>=85&&!n.married?`<button onclick="npcAct('${n.id}','marry')">💍 求婚</button>`:''}</div></div>`).join('')}</div><h3>👨‍👩‍👧 家族</h3><div class="card">伴侶：${s.spouse||'無'}<br>子女：${s.children.length?s.children.join('、'):'無'}${s.spouse?'<br><br><button onclick="familyChild()">👶 與道侶規劃子嗣</button>':''}</div>`}function familyChild(){if(!s.spouse)return;advance(24*30);if(Math.random()<.72){let child=pick(surnames)+pick(given);s.children.push(child);let n=makeNPC(s.npcs.length);n.name=child;n.age=0;n.realm='練氣一層';n.sect='無';n.place=s.place;n.aff=100;s.npcs.push(n);log('👶 你的家族迎來新生命：【'+child+'】。孩子將隨世界時間成長。')}else log('🌙 一個月過去，你與道侶暫時沒有迎來子嗣。');render()}
function npcAct(id,a){let n=s.npcs.find(x=>x.id===id);if(!n||!n.alive)return;if(a==='chat'){advance(1);n.aff=clamp(n.aff+rint(1,5),-100,100);log(`💬 你與 ${n.name} 交談。好感度提升。`)}if(a==='gift'){if(s.stones<30)return log('💰 靈石不足。'),render();s.stones-=30;n.aff=clamp(n.aff+9,-100,100);log(`🎁 ${n.name} 收下了你的禮物。`)}if(a==='attack'){n.alive=false;s.karma-=25;log(`⚔️ 你殺死了 ${n.name}。其親友與宗門可能追究此事。`)}if(a==='rob'){let g=Math.min(n.wealth,rint(20,120));n.wealth-=g;s.stones+=g;n.aff=-100;s.karma-=12;log(`💰 你搶走 ${n.name} 的 ${g} 靈石，因果惡名上升。`)}if(a==='love'){n.aff=clamp(n.aff+6,-100,100);log(`💗 你向 ${n.name} 表明心意。對方沒有拒絕。`)}if(a==='marry'){let ring=s.bag.find(x=>x[0]==='母親的姻緣戒指'&&x[1]>0);if(!ring)return log('💍 姻緣戒指已不在你身上。'),render();if(n.aff<85)return;ring[1]--;n.married=true;n.partner='PLAYER';s.spouse=n.name;log(`💍 你將母親的姻緣戒指交給 ${n.name}。兩人在親友見證下結為道侶。`)}render()}
function marketPrice(base){let war=s.wars.filter(w=>w.active).length;return Math.floor(base*(1+war*.06)*(0.9+Math.random()*.2))}
function market(c){let items=[['普通靈草',12],['玄鐵',25],['妖骨',30],['妖皮',28],['靈露',35],['［初階］低級生命藥水',20],['［初階］低級靈力藥水',20]];c.innerHTML=`<h2>💰 交易市場</h2><p class="sub">物價會受世界戰爭與事件波動。</p><div class="cards">${items.map((x,i)=>{let p=marketPrice(x[1]);return `<div class="card"><b>${x[0]}</b><br>${p} 靈石<br><button onclick="buyItem('${x[0]}',${p})">購買</button></div>`}).join('')}</div><h2>🔨 拍賣行</h2><div class="cards">${s.auction.map((a,i)=>`<div class="card"><b>${a.name}</b><br>${a.desc}<br>目前價格：${a.price} 靈石<br><button onclick="bid(${i})">出價</button></div>`).join('')}</div>`}
function buyItem(n,p){if(s.stones<p)return log('💰 靈石不足。'),render();s.stones-=p;let b=s.bag.find(x=>x[0]===n);if(b)b[1]++;else s.materials[n]=(s.materials[n]||0)+1;log(`🛒 購買 ${n}。`);render()}
function seedAuction(){if(!s)return;s.auction=[];let pool=[['［中階］玄霜劍','冰屬性法器'],['［高階］雷火丹','突破與戰鬥皆可用'],['殘缺古功法・天衍篇','可能開啟稀有功法支線'],['神秘妖獸蛋','未知種族，可能為特殊種'],['［仙階］虛空石','仙階煉器材料']];for(let i=0;i<4;i++){let x=pick(pool);s.auction.push({name:x[0],desc:x[1],price:rint(120,1200)*(x[0].includes('仙階')?4:1)})}}
function bid(i){let a=s.auction[i],p=Math.floor(a.price*1.1);if(s.stones<p)return log('💰 無法支付下一口價。'),render();if(Math.random()<.55){s.stones-=p;s.bag.push([a.name,1,a.desc]);log(`🔨 你以 ${p} 靈石拍得【${a.name}】。`);s.auction.splice(i,1)}else{a.price=Math.floor(p*1.12);log('🔨 有其他修士加價，你沒有拍到。')}render()}
function craft(c){c.innerHTML=`<h2>🔥 煉丹</h2><div class="cards">${recipes.pill.map((r,i)=>recipeCard(r,'pill',i)).join('')}</div><h2>⚒️ 煉器</h2><div class="cards">${recipes.gear.map((r,i)=>recipeCard(r,'gear',i)).join('')}</div>`}
function recipeCard(r,type,i){return `<div class="card"><b>${r[0]}</b><br>${r[2]}<br><span class="tiny">材料：${Object.entries(r[1]).map(([k,v])=>k+'×'+v).join('、')}</span><br><button onclick="craftItem('${type}',${i})">煉製</button></div>`}
function craftItem(type,i){let r=recipes[type][i];for(let [k,v] of Object.entries(r[1]))if((s.materials[k]||0)<v)return log('🔥 材料不足：'+k),render();for(let [k,v] of Object.entries(r[1]))s.materials[k]-=v;let success=Math.random()<(.72+realmPower(s.realm)/220);if(success){s.bag.push([r[0],1,r[2]]);log(`🔥 煉製成功：【${r[0]}】。`)}else log('💥 煉製失敗，材料化為灰燼。');render()}
function world(c){let wars=s.wars.filter(w=>w.active);c.innerHTML=`<h2>🌏 完整九州</h2><div class="world">${dynasties.map(d=>`<div><b>${d[0]}</b><br><span class="gold">${d[1]}</span><br><small>${d[2]}</small><br>${d.slice(3).map(p=>`<span class="pill">${p}</span>`).join('')}</div>`).join('')}</div><h3>🌌 世界層</h3><div class="cards"><div class="card">🌑 地下：幽冥地脈、古遺跡、地底妖國</div><div class="card">🌍 地面：九州王朝、城鎮、山河、宗門</div><div class="card">☁️ 天空：九天浮島群、雲海秘境、天門</div><div class="card">✨ 仙界：真仙後開啟，仙宗、仙獸、仙域戰場</div></div><h3>👾 怪物生態</h3><div class="card">目前世界生成 <b>${s.monsterPool.length}</b> 種妖獸模板：<span class="tag-common">一般種 ${s.monsterPool.filter(x=>x.tier==='一般種').length}</span>・<span class="tag-special">特殊種 ${s.monsterPool.filter(x=>x.tier==='特殊種').length}</span>・<span class="tag-boss">高危種 ${s.monsterPool.filter(x=>x.tier==='高危種').length}</span><br><br>特殊種擁有特殊外觀與獨有技能；高危種為Boss級生物，會受到地區與玩家戰力限制才出現。</div><h3>⚔️ 世界戰爭</h3>${wars.length?wars.map(w=>`<div class="card">${w.a} ⚔️ ${w.b}<br>開戰：${w.start}</div>`).join(''):'<div class="card">目前沒有王朝全面戰爭。</div>'}<h3>🏯 仙道最高境界</h3><div class="card">練氣 → 築基 → 金丹 → 元嬰 → 化神 → 煉虛 → 合體 → 大乘 → 渡劫 → 真仙 → 天仙 → 帝仙 → <b class="gold">神帝</b><br><br>真仙後每次大境界突破會要求仙界功法、仙材、道意與高危種／仙域戰役經歷；帝仙需掌握自身「帝道領域」，神帝需集齊九州天命並渡過神帝劫。</div>`}
function chronicle(c){let alive=s.npcs.filter(n=>n.alive).length,married=s.npcs.filter(n=>n.married).length;c.innerHTML=`<h2>📜 九州世錄</h2><div class="cards"><div class="card">👥 NPC總數<br><b>${s.npcs.length.toLocaleString()}</b></div><div class="card">🫀 存活NPC<br><b>${alive.toLocaleString()}</b></div><div class="card">💍 已婚NPC<br><b>${married.toLocaleString()}</b></div><div class="card">⚔️ 活躍戰爭<br><b>${s.wars.filter(w=>w.active).length}</b></div></div><h3>🏆 你的戰績</h3><div class="card">一般種：${s.kills.一般種}<br>特殊種：${s.kills.特殊種}<br>高危種：${s.kills.高危種}<br>因果值：${s.karma}</div><h3>🌏 最近世界事件</h3><div class="log">${s.worldEvents.map(x=>`<div class="entry">${x}</div>`).join('')||'<div class="entry">世界暫時平靜。</div>'}</div>`}
function showModal(x){document.getElementById('modalbody').innerHTML=x;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modalbody').innerHTML=''}

const SAVE_PREFIX='jiuzhouRPG_v3_', SAVE_VERSION=3;
let autoSaveTimer=null,lastAutoSavedAt=0,saveManagerFromStart=false;
function snapshot(){return {version:SAVE_VERSION,savedAt:new Date().toISOString(),state:s,enemy:enemy,tabNow:tabNow};}
function saveKey(slot){return SAVE_PREFIX+slot}
function saveMeta(slot){try{let raw=localStorage.getItem(saveKey(slot));if(!raw)return null;let d=JSON.parse(raw),g=d.state||d;return {slot,savedAt:d.savedAt||null,name:g.name||'未知',realm:g.realm||'未知境界',year:g.year||213,day:g.day||1,place:g.place||'未知地點',gender:g.gender||'',legacy:!d.state};}catch(e){return null}}
function writeSave(slot,{silent=false}={}){if(!s)return false;try{let data=snapshot();localStorage.setItem(saveKey(slot),JSON.stringify(data));if(slot==='auto')lastAutoSavedAt=Date.now();if(!silent){log(slot==='auto'?'💾 已建立自動存檔。':`💾 已保存至存檔 ${slot}。`);toast(slot==='auto'?'💾 已自動存檔':`💾 存檔 ${slot} 完成`);}refreshContinueButton();return true}catch(e){console.error(e);if(!silent)alert('存檔失敗：瀏覽器儲存空間可能不足。\n'+e.message);return false}}
function autoSave(reason=''){if(!s)return;clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>{writeSave('auto',{silent:true});toast('💾 已自動存檔')},900)}
function quickSave(){if(!s)return;writeSave('auto');}
function loadSave(slot){try{let raw=localStorage.getItem(saveKey(slot));if(!raw)return alert('這個存檔槽目前是空的。');let d=JSON.parse(raw);s=d.state||d;enemy=d.enemy||null;tabNow=d.tabNow||'adventure';document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');closeModal();render();toast(`▶️ 已讀取 ${slot==='auto'?'自動存檔':'存檔 '+slot}`)}catch(e){alert('讀取存檔失敗：'+e.message)}}
function deleteSave(slot){if(!localStorage.getItem(saveKey(slot)))return;if(!confirm(`確定要刪除${slot==='auto'?'自動存檔':'存檔 '+slot}嗎？`))return;localStorage.removeItem(saveKey(slot));openSaveManager(saveManagerFromStart);refreshContinueButton()}
function newestSaveSlot(){let arr=['auto','1','2','3'].map(k=>saveMeta(k)).filter(Boolean);arr.sort((a,b)=>new Date(b.savedAt||0)-new Date(a.savedAt||0));return arr[0]?.slot||null}
function refreshContinueButton(){let b=document.getElementById('continueBtn'),slot=newestSaveSlot();if(!b)return;if(slot){b.classList.remove('hidden');b.textContent='▶️ 繼續遊戲';b.onclick=()=>loadSave(slot)}else b.classList.add('hidden')}
function slotHTML(slot){let m=saveMeta(slot),label=slot==='auto'?'🛟 自動存檔':'📁 手動存檔 '+slot;if(!m)return `<div class="saveslot ${slot==='auto'?'auto':''}"><b>${label}</b><br><span class="sub">空白存檔槽</span><div class="saveactions">${s?`<button onclick="writeSave('${slot}');openSaveManager(${saveManagerFromStart})">💾 儲存</button>`:''}</div></div>`;let time=m.savedAt?new Date(m.savedAt).toLocaleString('zh-TW'):'舊版存檔';return `<div class="saveslot ${slot==='auto'?'auto':''}"><b>${label}</b><br>${m.gender} ${m.name}・<span class="gold">${m.realm}</span><br>王朝${m.year}年 第${m.day}日・${m.place}<br><span class="tiny sub">${time}</span><div class="saveactions"><button onclick="loadSave('${slot}')">▶️ 讀取</button>${s?`<button onclick="writeSave('${slot}');openSaveManager(${saveManagerFromStart})">💾 覆蓋</button>`:''}<button onclick="exportSave('${slot}')">📤 匯出</button><button onclick="deleteSave('${slot}')">🗑️ 刪除</button></div></div>`}
function openSaveManager(fromStart=false){saveManagerFromStart=!!fromStart;showModal(`<h2>💾 修仙存檔</h2><p class="sub">3 個手動槽＋1 個自動槽。角色、3,000名NPC、宗門、戰爭、婚姻子女、怪物、生態、市場、拍賣、當前戰鬥等世界狀態會一起保存。</p><div class="savegrid">${['auto','1','2','3'].map(slotHTML).join('')}</div><hr class="sep"><div class="saveactions"><button onclick="document.getElementById('saveImport').click()">📥 匯入備份</button>${s?'<button onclick="exportCurrent()">📤 匯出目前世界</button>':''}<button onclick="closeModal()">關閉</button></div><p class="tiny sub">自動存檔會在移動、修煉、戰鬥、交易、NPC互動與世界時間推進後延遲寫入，降低手機卡頓。</p>`)}
function exportPayload(data,name){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportSave(slot){let raw=localStorage.getItem(saveKey(slot));if(!raw)return;let d=JSON.parse(raw),g=d.state||d;exportPayload(d,`九州修仙錄_${g.name||'角色'}_${slot}_${Date.now()}.json`)}
function exportCurrent(){if(!s)return;exportPayload(snapshot(),`九州修仙錄_${s.name}_目前世界_${Date.now()}.json`)}
function importSaveFile(file){let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);let g=d.state||d;if(!g||!g.name||!g.npcs)throw new Error('不是有效的九州修仙錄存檔');localStorage.setItem(saveKey('3'),JSON.stringify(d.state?d:{version:2,savedAt:new Date().toISOString(),state:d,enemy:null,tabNow:'adventure'}));alert('匯入成功！已放入「手動存檔 3」。');openSaveManager(saveManagerFromStart);refreshContinueButton()}catch(e){alert('匯入失敗：'+e.message)}};reader.readAsText(file)}
function toast(msg){let t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1500)}
function migrateLegacy(){let old=localStorage.getItem('jiuzhouRPG_v2');if(old&&!localStorage.getItem(saveKey('1'))){try{let g=JSON.parse(old);localStorage.setItem(saveKey('1'),JSON.stringify({version:2,savedAt:new Date().toISOString(),state:g,enemy:null,tabNow:'adventure'}))}catch(e){}}}
window.addEventListener('beforeunload',()=>{if(s)writeSave('auto',{silent:true})});
window.addEventListener('load',()=>{migrateLegacy();document.getElementById('startBtn')?.addEventListener('click',startGame);document.getElementById('saveImport')?.addEventListener('change',e=>{let f=e.target.files?.[0];if(f)importSaveFile(f);e.target.value=''});refreshContinueButton()});

</script></body></html>
